# Checks every pull request and every push to main; publishes main to
# GitHub Pages once the checks pass. There is no build step — the repo is
# the site.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate. Runs on a pull request before anyone can merge it, and again
  # on main. Every bug shipped in the first week parsed fine; the suite in
  # a real browser is what would have caught them, and the phone's engine
  # is what would have caught the rest.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A file the worker caches changed, so its VERSION has to have — or a
      # browser keeps the old files. scripts/check_shell.py says which. On a
      # pull request the base is the branch it goes into, not the last commit.
      - name: A shell change bumps the version
        run: python3 scripts/check_shell.py "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"

      - name: Check every module parses
        run: |
          for f in $(find js -name '*.js'); do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest'))"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Unused names, undefined names, the easy slips. eslint.config.js.
      - name: Lint
        run: npx -y eslint@9.13.0 .

      # The modules that say `// @ts-check`, read against js/types.js. No
      # TypeScript in the repo — JSDoc, and the compiler run over it.
      - name: Typecheck the modules that ask for it
        run: npx -y -p typescript@5.6.3 tsc -p jsconfig.json

      # Chromium and WebKit are the slow part of every run; keep them between runs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.47.2-chromium-webkit
      - name: Browsers
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.47.2
          npx playwright install --with-deps chromium webkit
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 1

      - name: The suite, in Chromium
        run: node tests/run.mjs --browser chromium
      - name: The suite, in WebKit
        run: node tests/run.mjs --browser webkit

      # The app itself, at phone size and laptop size, every route: no
      # uncaught error, no sideways scroll, no box a phone would zoom for.
      - name: Smoke, in Chromium
        run: node tests/smoke.mjs --browser chromium
      - name: Smoke, in WebKit
        run: node tests/smoke.mjs --browser webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: tests/.smoke/
          if-no-files-found: ignore
          include-hidden-files: true   # .smoke is a dot-directory

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package the site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' \
                --exclude 'supabase' --exclude 'tests' --exclude '_site' \
                --exclude 'scripts' --exclude 'docs' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
