<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store tests</title>
<link rel="stylesheet" href="./tests.css">
</head>
<body>
<script type="module">
import { suite, storeWith } from './harness.js';

const v4 = (over = {}) => ({
  version: 4,
  semester: { name: 'Fall 2026', start: '2026-09-02', end: '2026-12-12' },
  areas: [], items: [], notes: {},
  ...over
});

suite('Store — categories, migration, study removal', async ({ check }) => {

  /* ---- kind → category ---- */

  {
    const s = await storeWith(v4({
      areas: [
        { id: 'a1', name: 'Thermo', kind: 'course' },
        { id: 'a2', name: 'Thesis', kind: 'thesis' },
        { id: 'a3', name: 'Lab', kind: 'research' },
        { id: 'a4', name: 'Co-op', kind: 'work' },
        { id: 'a5', name: 'Grad apps', kind: 'applications' },
        { id: 'a6', name: 'Errands', kind: 'personal' },
        { id: 'a7', name: 'Mystery', kind: 'wat' },
        { id: 'a8', name: 'No kind at all' }
      ]
    }));
    const cat = (id) => s.areaById(id).category;
    check('course stays a course', cat('a1') === 'course', `got ${cat('a1')}`);
    check('thesis becomes a project', cat('a2') === 'project', `got ${cat('a2')}`);
    check('research becomes a project', cat('a3') === 'project', `got ${cat('a3')}`);
    check('work becomes a project', cat('a4') === 'project', `got ${cat('a4')}`);
    check('applications becomes a project', cat('a5') === 'project', `got ${cat('a5')}`);
    check('personal stays personal', cat('a6') === 'personal', `got ${cat('a6')}`);
    check('unknown kind falls back to course', cat('a7') === 'course', `got ${cat('a7')}`);
    check('missing kind falls back to course', cat('a8') === 'course', `got ${cat('a8')}`);
    check('the old kind field is dropped', s.state.areas.every((a) => a.kind === undefined));
    check('migration stamps the current schema version',
      s.state.version === s.SCHEMA_VERSION, `got ${s.state.version}`);
  }

  {
    const s = await storeWith(v4({
      areas: [{ id: 'a1', name: 'Aero', kind: 'course', category: 'project' }]
    }));
    check('an explicit category beats the old kind', s.areaById('a1').category === 'project');
  }

  /* ---- NER folded into Projects at schema 11 ---- */

  {
    const s = await storeWith({
      version: 10,
      areas: [{ id: 'a1', name: 'NER Meetings', category: 'ner' }],
      items: []
    });
    check('an NER area becomes a project', s.areaById('a1').category === 'project');
    check('...and shows up under Projects',
      s.areasInCategory('project').some((a) => a.name === 'NER Meetings'));
    check('NER is no longer a category of its own', !s.CATEGORY_IDS.includes('ner'),
      s.CATEGORY_IDS.join());
  }
  {
    // a phone still on 10 pushes its own category name; it must not land in a
    // heading that no longer exists and disappear from the sidebar
    const s = await storeWith({ version: 11, areas: [], items: [] });
    s.applyRow({ kind: 'area', id: 'r1', data: { id: 'r1', name: 'Aero', category: 'ner' } });
    check('an inbound NER row is translated too',
      s.areaById('r1').category === 'project', s.areaById('r1').category);
  }

  /* ---- the Rocket seed ---- */

  {
    const s = await storeWith(v4({ areas: [{ id: 'a1', name: 'Thermo', kind: 'course' }] }));
    check('seeds Rocket when Projects would be empty',
      s.areasInCategory('project').map((a) => a.name).join() === 'Rocket');
  }
  {
    const s = await storeWith(v4({ areas: [{ id: 'a1', name: 'Senior Thesis', kind: 'thesis' }] }));
    check('does not seed Rocket when a project already exists',
      !s.state.areas.some((a) => a.name === 'Rocket'));
  }
  {
    const s = await storeWith(null);
    check('does not seed Rocket on a fresh install', !s.state.areas.length,
      'a new device syncing from the cloud would end up with two');
  }
  {
    // already migrated, and Rocket deleted since: it must stay deleted
    const s = await storeWith({ version: 5, areas: [{ id: 'a1', name: 'Thermo', category: 'course' }], items: [] });
    check('does not re-seed Rocket once already on schema 5',
      !s.state.areas.some((a) => a.name === 'Rocket'));
  }

  /* ---- study data is gone ---- */

  {
    const s = await storeWith(v4({
      areas: [{ id: 'a1', name: 'Thermo', kind: 'course' }],
      items: [{ id: 't1', title: 'PS1', areaId: 'a1' }],
      sessions: [{ id: 's1', areaId: 'a1', mins: 90, date: '2026-08-27' }]
    }));
    check('sessions are dropped from state', s.state.sessions === undefined);
    check('no session rows are synced',
      !s.snapshotRows().some((r) => r.kind === 'session'));
    check('an inbound session row is ignored',
      s.applyRow({ kind: 'session', id: 's9', data: { id: 's9' } }) === false);
    check('the store exports no study helpers',
      s.logSession === undefined && s.studyMinutes === undefined && s.sessionsBetween === undefined);
  }

  /* ---- category selectors ---- */

  {
    const s = await storeWith(v4({
      areas: [
        { id: 'a1', name: 'Thermo', kind: 'course' },
        { id: 'a2', name: 'Dynamics', kind: 'course' },
        { id: 'a3', name: 'Old class', kind: 'course', archived: true },
        { id: 'a4', name: 'Rocket', kind: 'thesis' }
      ],
      items: [
        { id: 't1', title: 'Due first', areaId: 'a1', due: '2026-09-04', estMins: 60 },
        { id: 't2', title: 'Due later', areaId: 'a1', due: '2026-09-20', estMins: 30 },
        { id: 't3', title: 'No date', areaId: 'a1', estMins: 30 },
        { id: 't4', title: 'Done already', areaId: 'a1', due: '2026-09-01', done: true },
        { id: 't5', title: 'Rocket work', areaId: 'a4', due: '2026-09-09', estMins: 120 }
      ]
    }));

    check('areasInCategory hides archived areas',
      s.areasInCategory('course').map((a) => a.name).join() === 'Thermo,Dynamics');
    check('areasInCategory can include archived',
      s.areasInCategory('course', { includeArchived: true }).length === 3);
    check('itemsForArea returns that area only',
      s.itemsForArea('a4').map((t) => t.id).join() === 't5');

    const next = s.nextForArea('a1', 3);
    check('nextForArea skips done work', !next.some((t) => t.done));
    check('nextForArea sorts soonest first', next[0].id === 't1', `got ${next[0]?.id}`);
    check('nextForArea puts undated work last', next[next.length - 1].id === 't3');
    check('nextForArea honours the limit', s.nextForArea('a1', 2).length === 2);

    const load = Object.fromEntries(s.categoryLoad().map((c) => [c.id, c]));
    check('categoryLoad counts open work per category',
      load.course.open === 3 && load.project.open === 1,
      `course=${load.course.open} project=${load.project.open}`);
    check('categoryLoad sums estimates', load.course.mins === 120, `got ${load.course.mins}`);
    check('categoryLoad covers every category',
      s.categoryLoad().length === s.AREA_CATEGORIES.length);
  }

  {
    // every category but course has a seed behind it, so a genuinely empty one
    // only exists on data already at the current schema. Read the version off
    // the module rather than pinning it here: this check is about "already
    // current", so it has to move with each bump, unlike the seeds themselves.
    const current = (await storeWith(null)).SCHEMA_VERSION;
    const s = await storeWith({
      version: current, semester: { name: 'F', start: '2026-09-02', end: '2026-12-12' },
      areas: [{ id: 'a1', name: 'Thermo', category: 'course' }], items: [], cards: [], notes: {}
    });
    const load = Object.fromEntries(s.categoryLoad().map((c) => [c.id, c]));
    check('categoryLoad reports an empty category as zero',
      load.personal.open === 0 && load.personal.areas === 0);
    check('nothing is seeded on data already at the current schema',
      s.state.areas.length === 1, s.state.areas.map((a) => a.name).join());
  }

  /* ---- ordering ---- */

  {
    const s = await storeWith(v4({
      areas: [
        { id: 'a1', name: 'Thermo', kind: 'course' },
        { id: 'a2', name: 'Dynamics', kind: 'course' },
        { id: 'a3', name: 'Orgo', kind: 'course' },
        { id: 'p1', name: 'Rocket', kind: 'thesis' }
      ]
    }));
    check('areas get an order on migration',
      s.areasInCategory('course').every((a) => Number.isFinite(a.order)));
    check('the first order is the existing arrangement',
      s.areasInCategory('course').map((a) => a.name).join() === 'Thermo,Dynamics,Orgo');

    s.reorderAreas('course', ['a3', 'a1', 'a2']);
    check('reordering rewrites the order',
      s.areasInCategory('course').map((a) => a.name).join() === 'Orgo,Thermo,Dynamics');
    check('order is a field on the row, so it syncs',
      s.snapshotRows().find((r) => r.kind === 'area' && r.id === 'a3').data.order === 0,
      'array position alone would never reach another device');
    check('reordering stamps updatedAt, so the row is pushed',
      !!s.areaById('a3').updatedAt);

    check('another category is untouched', s.areasInCategory('project')[0].name === 'Rocket');
    check('a partial list keeps the rest at the end',
      (s.reorderAreas('course', ['a2']), s.areasInCategory('course').map((a) => a.name).join())
        === 'Dynamics,Orgo,Thermo');
    check('an unknown id is ignored',
      (s.reorderAreas('course', ['nope', 'a1']), s.areasInCategory('course')[0].name) === 'Thermo');
  }

  {
    const s = await storeWith(v4({ areas: [{ id: 'a1', name: 'Thermo', kind: 'course' }] }));
    const made = s.upsertArea({ name: 'Late arrival', category: 'course' });
    check('a new area lands last in its category',
      s.areasInCategory('course').map((a) => a.name).join() === 'Thermo,Late arrival',
      `order=${made.order}`);
  }

  {
    // archived areas still hold a position, so restoring one is not a surprise
    const s = await storeWith(v4({
      areas: [
        { id: 'a1', name: 'Thermo', kind: 'course', order: 0 },
        { id: 'a2', name: 'Dropped', kind: 'course', order: 1, archived: true },
        { id: 'a3', name: 'Orgo', kind: 'course', order: 2 }
      ]
    }));
    check('archived areas keep their place',
      s.areasInCategory('course', { includeArchived: true }).map((a) => a.name).join()
        === 'Thermo,Dropped,Orgo');
    check('...but stay hidden from the normal read',
      s.areasInCategory('course').map((a) => a.name).join() === 'Thermo,Orgo');
  }

  /* ---- the end of one day is the start of the next ---- */

  {
    const withNotes = (notes) => ({
      version: 15, semester: { name: 'F', start: '2026-09-02', end: '2026-12-12' },
      areas: [], items: [], cards: [], notes
    });

    {
      const s = await storeWith(withNotes({
        '2026-09-09': { focus: '', text: 'slow day', tomorrow: 'Finish the nozzle CAD', top3: [] }
      }));
      const got = s.carryForward('2026-09-10');
      check('last night’s line becomes today’s focus',
        s.note('2026-09-10').focus === 'Finish the nozzle CAD', s.note('2026-09-10').focus);
      check('...and says where it came from',
        s.note('2026-09-10').carriedFrom === '2026-09-09' && got.date === '2026-09-09');
      check('the line is spent, so it does not arrive twice',
        s.note('2026-09-09').tomorrowUsed === true);
      check('carrying again does nothing',
        s.carryForward('2026-09-11') === null && s.note('2026-09-11').focus === '');
    }

    {
      const s = await storeWith(withNotes({
        '2026-09-09': { focus: '', text: '', tomorrow: 'Nozzle CAD', top3: [] },
        '2026-09-10': { focus: 'Something I chose myself', text: '', top3: [] }
      }));
      s.carryForward('2026-09-10');
      check('a focus you set yourself is not overwritten',
        s.note('2026-09-10').focus === 'Something I chose myself');
      check('...but last night’s line is still spent',
        s.note('2026-09-09').tomorrowUsed === true,
        'left unspent it would arrive a day late, which is worse than not arriving');
    }

    {
      const s = await storeWith(withNotes({
        '2026-09-11': { focus: '', text: '', tomorrow: 'Email the TA', top3: [] }   // a Friday
      }));
      check('a Friday night reaches Monday morning',
        s.carryForward('2026-09-14')?.text === 'Email the TA');
      const old = await storeWith(withNotes({
        '2026-09-01': { focus: '', text: '', tomorrow: 'Ancient history', top3: [] }
      }));
      check('but a line from a fortnight ago does not',
        old.carryForward('2026-09-20') === null,
        'a week is long enough to still mean it');
    }

    {
      const s = await storeWith(withNotes({}));
      check('nothing to carry is not a write',
        s.pendingTomorrow('2026-09-10') === null && s.carryForward('2026-09-10') === null);
      check('...and leaves no empty note behind',
        Object.keys(s.state.notes).length === 0,
        'a write on every render would sync a row a day for nothing');
    }

    {
      const s = await storeWith(withNotes({
        '2026-09-09': { focus: '', text: '', tomorrow: 'Only a line for tomorrow', top3: [] }
      }));
      const row = s.snapshotRows().find((r) => r.kind === 'note' && r.id === '2026-09-09');
      check('a note holding only tomorrow’s line still syncs',
        !!row && row.data.tomorrow === 'Only a line for tomorrow',
        'dropped as empty, the carry-forward would never reach another device');
      s.carryForward('2026-09-10');
      const spent = s.snapshotRows().find((r) => r.kind === 'note' && r.id === '2026-09-09');
      check('...and so does the fact that it was spent', spent.data.tomorrowUsed === true);
    }

    {
      const s = await storeWith(withNotes({}));
      check('an old note with no tomorrow field is not a crash',
        (s.state.notes['2026-09-09'] = { focus: '', text: 'from schema 14', top3: [] },
        s.carryForward('2026-09-10') === null));
      check('note() gives a new day the shape the box expects',
        s.note('2026-09-12').tomorrow === '');
    }
  }

  /* ---- a daily journal ---- */

  {
    const withJournal = (over = {}) => ({
      version: 17, semester: { name: 'F', start: '2026-09-02', end: '2026-12-12' },
      areas: [
        { id: 'j1', name: 'Journal', category: 'personal', order: 0, journal: true },
        { id: 'p1', name: 'Rocket', category: 'project', order: 1 }
      ],
      items: [], cards: [], notes: {}, ...over
    });

    {
      const s = await storeWith(withJournal());
      check('an area with no entries has nothing to show',
        s.journalEntry('j1', '2026-09-10') === '' && s.journalDates('j1').length === 0);

      s.setJournalEntry('j1', '2026-09-10', 'Nozzle came out warped.');
      check('what was written comes back', s.journalEntry('j1', '2026-09-10') === 'Nozzle came out warped.');
      check('...on the day it was written for',
        s.journalDates('j1').join() === '2026-09-10');
      check('the entry lives in that day’s note, not a pile of its own',
        s.state.notes['2026-09-10'].journal.j1 === 'Nozzle came out warped.',
        'a note row is already one per date, so a year of writing stays a year of small rows');
      check('the rest of the day is untouched',
        s.state.notes['2026-09-10'].focus === '' && s.state.notes['2026-09-10'].text === '');
    }

    {
      const s = await storeWith(withJournal());
      s.setJournalEntry('j1', '2026-09-08', 'Monday');
      s.setJournalEntry('j1', '2026-09-12', 'Friday');
      s.setJournalEntry('j1', '2026-09-10', 'Wednesday');
      check('earlier entries come back newest first',
        s.journalDates('j1').join() === '2026-09-12,2026-09-10,2026-09-08',
        s.journalDates('j1').join());

      s.setJournalEntry('p1', '2026-09-10', 'Static fire prep');
      check('two areas can write on the same day without meeting',
        s.journalEntry('j1', '2026-09-10') === 'Wednesday'
        && s.journalEntry('p1', '2026-09-10') === 'Static fire prep');
      check('...and each only lists its own days',
        s.journalDates('p1').join() === '2026-09-10');
    }

    {
      const s = await storeWith(withJournal());
      s.setJournalEntry('j1', '2026-09-10', 'Written then thought better of');
      s.setJournalEntry('j1', '2026-09-10', '   ');
      check('an emptied entry stops being an entry',
        s.journalEntry('j1', '2026-09-10') === '' && s.journalDates('j1').length === 0,
        'a blank day should not sit in the dropdown forever');
      check('...and leaves no empty note behind to sync',
        !s.snapshotRows().some((r) => r.kind === 'note' && r.id === '2026-09-10'));
    }

    {
      const s = await storeWith(withJournal());
      s.setJournalEntry('j1', '2026-09-10', 'Only a journal entry today.');
      const row = s.snapshotRows().find((r) => r.kind === 'note' && r.id === '2026-09-10');
      check('a day with only an entry on it still syncs',
        !!row && row.data.journal.j1 === 'Only a journal entry today.',
        'dropped as empty, a journal would never reach another device');
      check('it needs no new row kind',
        !s.snapshotRows().some((r) => r.kind === 'journal'),
        'a new kind would need the Supabase CHECK constraint widened');

      s.applyRow({
        kind: 'note', id: '2026-09-11',
        data: { focus: '', text: '', top3: [], journal: { j1: 'From the phone' } }
      });
      check('an inbound day brings its entry with it',
        s.journalEntry('j1', '2026-09-11') === 'From the phone');
    }

    {
      const s = await storeWith({
        version: 16,
        areas: [{ id: 'j1', name: 'Journal', category: 'personal', order: 0 }], items: []
      });
      check('the seeded Journal is marked as one on 17', s.areaById('j1').journal === true);
      check('...and the mark travels with the area row',
        s.snapshotRows().find((r) => r.kind === 'area' && r.id === 'j1').data.journal === true);

      const other = await storeWith({
        version: 16,
        areas: [{ id: 'p1', name: 'Rocket', category: 'project', order: 0 }], items: []
      });
      check('nothing else grows a writing box uninvited',
        other.areaById('p1').journal === false);
      check('but any area can be given one',
        (other.commit(() => other.upsertArea({ id: 'p1', journal: true })),
        other.journalAreas().map((a) => a.name).join() === 'Rocket'));
    }
  }

  /* ---- the week begins on Sunday (schema 18) ---- */

  {
    const s = await storeWith(v4());
    check('an old install is moved to Sunday', s.state.settings.weekStart === 0);

    const fresh = await storeWith({ version: 18, areas: [], items: [] });
    check('and one that never had the setting starts there',
      fresh.state.settings.weekStart === 0);

    const chosen = await storeWith({
      version: 18, areas: [], items: [], settings: { weekStart: 1 }
    });
    check('someone who has since chosen Monday keeps it',
      chosen.state.settings.weekStart === 1,
      'the flip is pinned to 18 like a seed, not forced at every load');
  }

  /* ---- the freewrite box every area page ends in ---- */

  {
    const s = await storeWith(v4({ areas: [{ id: 'a1', name: 'Rocket', kind: 'research' }] }));
    check('an area starts with an empty one', s.areaById('a1').freewrite === '');
    check('...a string, never missing', typeof s.areaById('a1').freewrite === 'string');

    s.commit(() => s.upsertArea({ id: 'a1', freewrite: 'Think about the nozzle.' }));
    check('what is written stays written', s.areaById('a1').freewrite === 'Think about the nozzle.');
    check('...and travels with the area row',
      s.snapshotRows().find((r) => r.kind === 'area' && r.id === 'a1').data.freewrite
        === 'Think about the nozzle.',
      'no new row kind: it is a field on the area, not a thing of its own');

    const back = await storeWith({
      version: 18,
      areas: [{ id: 'a1', name: 'Rocket', category: 'project', order: 0, freewrite: 'Kept.' }],
      items: []
    });
    check('and survives a reload', back.areaById('a1').freewrite === 'Kept.');
  }

  /* ---- what is on today, for the line in the topbar ---- */

  {
    const day = '2026-09-09';                       // a Wednesday in term
    const s = await storeWith({
      version: 18,
      semester: { name: 'Fall 2026', start: '2026-09-02', end: '2026-12-12' },
      areas: [{
        id: 'c1', name: 'Thermo', category: 'course', order: 0,
        schedule: [{ days: [3], start: '09:00', end: '10:15' }]
      }],
      items: [
        { id: 't1', title: 'Write up lab', areaId: 'c1', plan: { date: day, start: '13:00', mins: 90 } },
        { id: 't2', title: 'Read chapter 4', areaId: 'c1', plan: { date: day, start: null, mins: 60 } },
        { id: 't3', title: 'Already done', areaId: 'c1', done: true, plan: { date: day, start: '15:00', mins: 30 } }
      ],
      events: [
        { id: 'e1', title: 'Advisor', date: day, start: '11:00', end: '11:30' },
        { id: 'e2', title: 'Reading week', date: day, allDay: true }
      ],
      notes: {}
    });

    const line = s.dayTimeline(day);
    check('the day is one list, whatever each thing came from',
      line.map((e) => e.title).join(' | ') === 'Thermo | Advisor | Write up lab',
      line.map((e) => e.title).join(' | '));
    check('...in time order', line.map((e) => e.start).join() === '09:00,11:00,13:00');
    check('an all-day thing is not on it',
      !line.some((e) => e.title === 'Reading week'),
      'it has no time, so it can never be what is next');
    check('nor is a planned block with no time on it',
      !line.some((e) => e.title === 'Read chapter 4'));
    check('nor is work already finished',
      !line.some((e) => e.title === 'Already done'));

    const at = (mins) => s.nowNext(day, mins);
    check('before the first thing, the first thing is next',
      at(8 * 60).title === 'Thermo' && at(8 * 60).live === false);
    check('during a class, the class is what is on',
      at(9 * 60 + 30).title === 'Thermo' && at(9 * 60 + 30).live === true,
      'at half past nine the useful answer is the lecture, not the thing after it');
    check('the moment it ends, the next thing takes over',
      at(10 * 60 + 15).title === 'Advisor' && at(10 * 60 + 15).live === false);
    check('a planned block counts as much as an appointment',
      at(13 * 60 + 30).title === 'Write up lab' && at(13 * 60 + 30).live === true);
    check('after the last thing there is nothing next', at(23 * 60) === null);
    check('a day with nothing on it says so',
      s.nowNext('2026-09-12', 9 * 60) === null,
      'the topbar reads a null as "no scheduled events today"');
  }

  /* ---- the day begins at 3am, not midnight ---- */

  {
    const { today, DAY_RESET_HOUR } = await import('../js/util.js');
    const at = (iso) => today(new Date(iso));

    check('the reset is 3am', DAY_RESET_HOUR === 3);
    check('the middle of the afternoon is that day',
      at('2026-09-09T14:00:00') === '2026-09-09');
    check('half past midnight still belongs to the day before',
      at('2026-09-10T00:30:00') === '2026-09-09',
      'writing about your day at half past midnight is writing about that day');
    check('...and so does ten to three',
      at('2026-09-10T02:50:00') === '2026-09-09');
    check('three o’clock is the new day', at('2026-09-10T03:00:00') === '2026-09-10');
    check('and so is one minute past', at('2026-09-10T03:01:00') === '2026-09-10');
    check('the last minute of the old day is 2:59',
      at('2026-09-10T02:59:00') === '2026-09-09');
    check('a night crossing a month still lands in the old month',
      at('2026-10-01T01:00:00') === '2026-09-30');
    check('...and one crossing a year, in the old year',
      at('2027-01-01T02:00:00') === '2026-12-31');
    check('today() with no clock is still just today',
      typeof today() === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(today()));
  }

  /* ---- finished work is swept at the reset ---- */

  {
    const day = '2026-09-10';
    const doneAt = (d, h) => `${d}T${String(h).padStart(2, '0')}:00:00`;
    const fixture = (over = {}) => ({
      version: 18,
      semester: { name: 'Fall 2026', start: '2026-09-02', end: '2026-12-12' },
      areas: [{ id: 'c1', name: 'Thermo', category: 'course', order: 0 }],
      items: [
        { id: 'open', title: 'Still to do', areaId: 'c1' },
        { id: 'today', title: 'Ticked this afternoon', areaId: 'c1', done: true, doneAt: doneAt(day, 14) },
        { id: 'lastnight', title: 'Ticked after midnight', areaId: 'c1', done: true, doneAt: doneAt('2026-09-11', 1) },
        { id: 'yesterday', title: 'Ticked yesterday', areaId: 'c1', done: true, doneAt: doneAt('2026-09-09', 20) },
        { id: 'ancient', title: 'Done, never stamped', areaId: 'c1', done: true }
      ],
      cards: [], links: [], wishlist: [], habits: [], habitLog: {}, notes: {},
      ...over
    });

    const s = await storeWith(fixture());
    const left = () => s.state.items.map((t) => t.id).sort().join(',');

    check('nothing unfinished is ever swept',
      s.doneBefore(day).every((t) => t.done));
    check('a task ticked earlier today survives its own day',
      !s.doneBefore(day).some((t) => t.id === 'today'),
      'nothing may vanish while you are looking at it');
    check('one ticked at 1am belongs to the day that was ending, not the new one',
      !s.doneBefore(day).some((t) => t.id === 'lastnight'),
      'at 1am on the 11th the planner is still on the 10th, and the 10th is not over');
    check('...and goes at the reset that ends it',
      s.doneBefore('2026-09-11').some((t) => t.id === 'lastnight'),
      'ticked before the reset, gone at the reset — the same rule as the afternoon');
    check('one ticked yesterday goes', s.doneBefore(day).some((t) => t.id === 'yesterday'));
    check('one done before doneAt existed goes too',
      s.doneBefore(day).some((t) => t.id === 'ancient'),
      'no stamp means older than any day this could be asked about');

    const gone = s.sweepDone(day);
    check('the sweep returns what it took',
      gone.map((t) => t.id).sort().join(',') === 'ancient,yesterday');
    check('...and leaves the rest', left() === 'lastnight,open,today');
    check('sweeping twice takes nothing the second time',
      s.sweepDone(day).length === 0 && left() === 'lastnight,open,today');

    // an undo puts a task back, and putting it back re-renders, and a render
    // sweeps — so the caller names what it has already spared
    s.state.items.push(...gone);
    const spared = new Set(gone.map((t) => t.id));
    check('a spared id is not offered again', s.doneBefore(day, spared).length === 0);
    check('...and survives the next sweep',
      s.sweepDone(day, spared).length === 0 && left() === 'ancient,lastnight,open,today,yesterday');
    check('one nobody spared still goes',
      s.sweepDone(day, new Set(['ancient'])).map((t) => t.id).join(',') === 'yesterday');
  }

  {
    const s = await storeWith({
      version: 18,
      areas: [], items: [{ id: 't1', title: 'Done', done: true, doneAt: '2026-09-01T10:00:00' }],
      settings: { sweepDone: false }
    });
    check('the switch really stops it', s.doneBefore('2026-09-30').length === 0);
    check('...and nothing is deleted', s.sweepDone('2026-09-30').length === 0 && s.state.items.length === 1);
    check('the switch travels between devices',
      s.snapshotRows().find((r) => r.kind === 'meta').data.settings.sweepDone === false);

    const on = await storeWith({ version: 18, areas: [], items: [] });
    check('and it is on unless turned off', on.state.settings.sweepDone === true);
  }

  {
    // a swept task named in a day's top three has to leave it as well, or
    // emptyNote() keeps counting a note that renders as nothing
    const s = await storeWith({
      version: 18,
      areas: [],
      items: [
        { id: 'a', title: 'Gone', done: true, doneAt: '2026-09-01T10:00:00' },
        { id: 'b', title: 'Kept' }
      ],
      notes: { '2026-09-01': { focus: '', text: '', tomorrow: '', top3: ['a', 'b'], journal: {} } }
    });
    s.sweepDone('2026-09-02');
    check('a swept task is taken out of the top three',
      s.state.notes['2026-09-01'].top3.join() === 'b');

    const s2 = await storeWith({
      version: 18, areas: [],
      items: [{ id: 'a', title: 'Gone', done: true, doneAt: '2026-09-01T10:00:00' }],
      notes: { '2026-09-01': { focus: '', text: '', tomorrow: '', top3: ['a'], journal: {} } }
    });
    s2.sweepDone('2026-09-02');
    check('...and a note left holding nothing stops syncing',
      !s2.snapshotRows().some((r) => r.kind === 'note' && r.id === '2026-09-01'));
  }

  /* ---- deleting an area leaves its work behind ---- */

  {
    const s = await storeWith(v4({
      areas: [{ id: 'a1', name: 'Thermo', kind: 'course' }],
      items: [{ id: 't1', title: 'PS1', areaId: 'a1' }]
    }));
    s.deleteArea('a1');
    check('deleting an area keeps its tasks', s.itemById('t1') !== null);
    check('...and unfiles them', s.itemById('t1').areaId === null);
  }
});

suite('Series — this and after, and a copy', async ({ check }) => {
  const s = await storeWith({
    version: 20,
    semester: { name: 'Fall 2026', start: '2026-09-01', end: '2026-12-12' },
    areas: [{ id: 'th', name: 'Thermodynamics', category: 'course', order: 0 }],
    items: [{
      id: 'lec', title: 'Lecture', areaId: 'th', type: 'meeting',
      plan: { date: '2026-09-07', start: '10:30', mins: 60 },
      repeat: { freq: 'weekly', every: 1, days: [1], until: null, count: null,
        ex: { '2026-09-14': { title: 'Guest lecture' }, '2026-10-26': { off: true } } },
      subtasks: [{ id: 'x1', text: 'bring notes', done: true }],
      notes: 'room 302', gcalId: 'g1', gcalIds: { '2026-09-07': 'e1' }
    }],
    cards: [], notes: {}
  });

  {
    // from October 12 the lecture moves to 14:00
    const old = s.itemById('lec');
    const made = s.splitSeriesAt(old, '2026-10-12', { plan: { date: '2026-10-12', start: '14:00', mins: 60 } });
    check('a new series starts at the split', made && made.plan.date === '2026-10-12' && made.plan.start === '14:00',
      JSON.stringify(made?.plan));
    check('...with the edit and the rest of the series', made.title === 'Lecture' && made.notes === 'room 302' && made.areaId === 'th');
    check('...and its own id, no Google ids', made.id !== 'lec' && !made.gcalId && !made.gcalIds);
    check('the old series ends the day before', s.itemById('lec').repeat.until === '2026-10-11', s.itemById('lec').repeat.until);
    check('an exception before the split stays with the old', s.itemById('lec').repeat.ex['2026-09-14']?.title === 'Guest lecture');
    check('...and one after it goes with the new',
      made.repeat.ex['2026-10-26']?.off === true && s.itemById('lec').repeat.ex['2026-10-26'] === undefined);
    check('the old series still draws before the split', s.itemsPlannedOn('2026-09-28').some((t) => t.title === 'Lecture'));
    check('...and not after it', s.itemsPlannedOn('2026-10-19').every((t) => t.plan.start === '14:00'));
    const newOcc = s.itemsPlannedOn('2026-10-19');
    check('the new series draws after it, at the new time', newOcc.length === 1 && newOcc[0].plan.start === '14:00',
      JSON.stringify(newOcc.map((t) => [t.id, t.plan.start])));
    check('the skip that moved with it still skips', s.itemsPlannedOn('2026-10-26').length === 0);
    check('and nothing draws twice on the split day', s.itemsPlannedOn('2026-10-12').length === 1);
  }

  {
    const before = s.state.items.length;
    const copy = s.duplicateItem('lec');
    check('a copy is a new row', copy && copy.id !== 'lec' && s.state.items.length === before + 1);
    check('...named as one', copy.title === 'Lecture (copy)');
    check('...not done, not on Google, not from Canvas', !copy.done && !copy.gcalId && !copy.gcalIds && !copy.canvasId);
    check('...with fresh, unticked subtasks', copy.subtasks.length === 1 && copy.subtasks[0].id !== 'x1' && !copy.subtasks[0].done);
    check('...and the rule but not its exceptions', copy.repeat?.freq === 'weekly' && Object.keys(copy.repeat.ex).length === 0);
    check('the copy of an occurrence is a copy of the series',
      s.duplicateItem('lec@2026-09-07')?.repeat?.freq === 'weekly');
  }

  {
    // a counted series splits its count
    s.upsertItem({ id: 'cnt', title: 'Five', plan: { date: '2026-09-01', start: '09:00', mins: 30 },
      repeat: { freq: 'daily', every: 1, days: [], until: null, count: 5, ex: {} } });
    const made = s.splitSeriesAt(s.itemById('cnt'), '2026-09-03', {});
    check('the new series keeps what was left of the count', made.repeat.count === 3, String(made.repeat.count));
    check('the old one ends before it', s.itemById('cnt').repeat.until === '2026-09-02' && s.itemById('cnt').repeat.count === null);
    check('a plain item cannot be split', s.splitSeriesAt(s.upsertItem({ title: 'once' }), '2026-09-03') === null);
  }
});
</script>
