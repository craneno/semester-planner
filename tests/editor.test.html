<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editor tests</title>
<link rel="stylesheet" href="./tests.css">
</head>
<body>
<script type="module">
/* The task panel. What has to hold: it opens on the task with its name and
   its when; a change in a box is written to the task; an end before the
   start means the morning after; All day drops the time and offers Until,
   which makes a stretch; a colour swatch gives the task a colour of its
   own and the first takes it back. */
import { suite, sharedStoreWith, renderInto } from './harness.js';

const s = await sharedStoreWith({
  version: 20,
  semester: { name: 'Fall 2026', start: '2026-09-02', end: '2026-12-12' },
  areas: [{ id: 'gen', name: 'General', category: 'personal', order: 0, color: '#3C6E8F' }],
  items: [
    { id: 'a', title: 'Late show', areaId: 'gen', plan: { date: '2026-09-11', start: '22:00', mins: 60 }, due: null },
    // Tuesdays and Wednesdays from the first week of term, for the series suites
    { id: 'w', title: 'Lab', areaId: 'gen', plan: { date: '2026-09-01', start: '10:00', mins: 60 }, due: null,
      repeat: { freq: 'weekly', every: 1, days: [], until: null, count: null, ex: {} } },
    { id: 'w2', title: 'Seminar', areaId: 'gen', plan: { date: '2026-09-02', start: '14:00', mins: 60 }, due: null,
      repeat: { freq: 'weekly', every: 1, days: [], until: null, count: null, ex: {} } },
    { id: 'n', title: 'Read', areaId: 'gen', due: '2026-09-20', subtasks: [{ id: 'st1', title: 'first', done: false }] },
    { id: 'del', title: 'Doomed', areaId: 'gen', due: '2026-09-21' }
  ],
  cards: [], notes: {},
  habits: [{ id: 'h1', name: 'Workout', order: 0, archived: false }], habitLog: {}, habitLogAt: {}
});

const change = (el, value) => { el.value = value; el.dispatchEvent(new Event('change', { bubbles: true })); };
const $ = (sel) => document.querySelector('#peek ' + sel);
const $$ = (sel) => [...document.querySelectorAll('#peek ' + sel)];

suite('Editor — the panel on a task', async ({ check }) => {
  const E = await import('../js/editor.js');
  const U = await import('../js/ui.js');
  renderInto(() => {}).done();     // the hosts the panel writes to
  try {
    E.openItem('a');
    check('it opens', document.getElementById('peek').classList.contains('open'));
    check('on the task, by name', $('.peek-title')?.value === 'Late show');
    const modes = $$('.mode-toggle .mode');
    check('three ways of being when, Scheduled on', modes.length === 3 && modes[0].classList.contains('on'), modes.map((m) => m.textContent).join());
    const times = $$('.timebox');
    check('from and to', times.length === 2 && times[0].value === '22:00' && times[1].value === '23:00', times.map((t) => t.value).join());

    change(times[1], '01:00');
    check('an end before the start is the morning after', s.itemById('a').plan.mins === 180, String(s.itemById('a').plan.mins));

    const swatches = $$('.swatch');
    check('the area\u2019s colour and ten more', swatches.length === 11 && swatches[0].classList.contains('on'));
    swatches[3].click();
    check('a swatch gives it a colour of its own', s.itemById('a').color === swatches[3].title, s.itemById('a').color);
    check('...shown as on', $$('.swatch')[3].classList.contains('on'));
    $$('.swatch')[0].click();
    check('the first takes it back', s.itemById('a').color === null);

    const habitSel = $$('select').find((el) => el.getAttribute('aria-label') === 'Habit this counts for');
    check('a habit to count for, none by default', !!habitSel && habitSel.value === '' && habitSel.options.length === 2);
    change(habitSel, 'h1');
    check('...picked, the task is tied to it', s.itemById('a').habitId === 'h1');
    change(habitSel, '');
    check('...and None unties it', s.itemById('a').habitId === null);

    $$('.mode-toggle .mode')[1].click();
    check('All day drops the time', s.itemById('a').plan.start === null && s.itemById('a').plan.date === '2026-09-11');
    const dates = $$('input[type=date]');
    check('...and offers Until', dates.length === 2 && dates[1].value === '');
    change(dates[1], '2026-09-13');
    check('Until makes a stretch', s.itemById('a').plan.end === '2026-09-13');
    change($$('input[type=date]')[1], '2026-09-10');
    check('an Until before the day is no stretch', !s.itemById('a').plan.end);

    U.closePeek();
    check('it closes', !document.getElementById('peek').classList.contains('open'));
  } finally {
    U.closePeek();
  }
});

const tick = (ms) => new Promise((r) => setTimeout(r, ms));
const type = (el, value) => { el.value = value; el.dispatchEvent(new Event('input', { bubbles: true })); };
const scopeBtn = (label) => $$('.mode-toggle .mode').find((b) => b.textContent === label);
const isOpen = () => document.getElementById('peek').classList.contains('open');

suite('Editor — one of a series', async ({ check }) => {
  const E = await import('../js/editor.js');
  const U = await import('../js/ui.js');
  renderInto(() => {}).done();
  try {
    /* All of them, from the third Tuesday. The new time was sent with the
       third Tuesday's date, the series' own day moved there, and the two
       before it were gone. */
    E.openItem('w@2026-09-15');
    scopeBtn('All of them').click();
    change($$('.timebox')[0], '11:00');
    const w = s.itemById('w');
    check('All of them: a new time reaches the series', w.plan.start === '11:00', JSON.stringify(w.plan));
    check('...and the series keeps its own first day', w.plan.date === '2026-09-01', w.plan.date);
    check('...so the ones before this are still there, at the new time',
      s.itemById('w@2026-09-08')?.plan.start === '11:00', JSON.stringify(s.itemById('w@2026-09-08')?.plan));
    change($$('.timebox')[1], '12:30');
    check('a new end is a new length, the day still kept',
      s.itemById('w').plan.mins === 90 && s.itemById('w').plan.date === '2026-09-01', JSON.stringify(s.itemById('w').plan));
    U.closePeek();

    /* This and after, by a name typed in two goes: the first splits the
       series, and the second has to find the new one. It went to the day
       the split had just ended, found it gone, and shut the panel. */
    E.openItem('w2@2026-09-16');
    scopeBtn('This and after').click();
    type($('.peek-title'), 'Seminar, room 2');
    await tick(450);
    const made = s.state.items.find((t) => t.id !== 'w2' && t.title === 'Seminar, room 2');
    check('the first word splits the series', !!made && s.itemById('w2').repeat.until === '2026-09-15',
      JSON.stringify(s.itemById('w2').repeat));
    type($('.peek-title'), 'Seminar, room 204');
    await tick(450);
    check('the next word goes to the new series', !!made && s.itemById(made.id)?.title === 'Seminar, room 204',
      String(made && s.itemById(made.id)?.title));
    check('...not to the old one', s.itemById('w2').title === 'Seminar');
    check('...and the panel stays open', isOpen());
  } finally {
    U.closePeek();
  }
});

suite('Editor — a write finds the row as it is now', async ({ check }) => {
  const E = await import('../js/editor.js');
  const U = await import('../js/ui.js');
  renderInto(() => {}).done();
  // what a pull does (applyRow: arr[i] = obj), and an undo or another tab's save alike
  const replace = () => { const i = s.state.items.findIndex((t) => t.id === 'n'); s.state.items[i] = structuredClone(s.state.items[i]); };
  const seen = [];
  const off = s.subscribe((meta) => seen.push(meta?.source));
  try {
    E.openItem('n');
    replace();
    type($('textarea'), 'page 42');
    await tick(450);
    check('notes typed after the row was replaced land on the row', s.itemById('n').notes === 'page 42', String(s.itemById('n').notes));
    replace();
    type($('.subtask input[type=text]'), 'first, and done');
    await tick(450);
    check('a subtask renamed after it was replaced lands on the row', s.itemById('n').subtasks[0].title === 'first, and done',
      JSON.stringify(s.itemById('n').subtasks));
    replace();
    $('.subtask input[type=checkbox]').click();
    check('...ticked, too', s.itemById('n').subtasks[0].done === true);
    replace();
    $$('button').find((b) => b.textContent === '+ Add subtask').click();
    check('...and one added', s.itemById('n').subtasks.length === 2);
    check('each told the view under the panel, as the editor', seen.length >= 4 && seen.every((x) => x === 'editor'), seen.join());
  } finally {
    off();
    U.closePeek();
  }
});

suite('Editor — deleted, then put back twice', async ({ check }) => {
  const E = await import('../js/editor.js');
  const U = await import('../js/ui.js');
  renderInto(() => {}).done();
  try {
    E.openItem('del');
    $$('.peek-h button').find((b) => b.title === 'Delete task').click();
    document.querySelector('.modal .btn.primary').click();
    await tick(0);
    check('it is deleted', s.itemById('del') === null);
    s.undo();                                   // Ctrl+Z
    check('Ctrl+Z puts it back', !!s.itemById('del'));
    const toast = [...document.querySelectorAll('#toasts .toast')].find((t) => t.dataset.msg === 'Task deleted');
    toast?.querySelector('button')?.click();    // ...and then the toast's Undo
    check('the toast’s Undo after it adds no second row', s.state.items.filter((t) => t.id === 'del').length === 1,
      String(s.state.items.filter((t) => t.id === 'del').length));
  } finally {
    U.closePeek();
  }
});
</script>
</body>
</html>
