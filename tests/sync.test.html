<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cloud sync tests</title>
<link rel="stylesheet" href="./tests.css">
</head>
<body>
<script type="module">
import { suite } from './harness.js';

suite('Cloud sync — delete durability', async ({ check }) => {
  const { state, commit, subscribe, upsertItem, deleteItem, itemById, applyRow, snapshotRows } = await import('../js/store.js');
  const C = await import('../js/cloud.js');

  /* A stand-in for Supabase: one in-memory table that stamps synced_at on write,
     mirroring the planner_touch() trigger in supabase/schema.sql. The query
     object is a thenable so it serves both call shapes cloud.js uses —
     .select().gt().order().limit() for pull, .upsert().select() for push. */
  function makeFake(seed = [], { mutate = false } = {}) {
    const table = seed.slice();
    let clock = 100, touched = 0;
    const stamp = () => new Date(Date.UTC(2026, 0, 1) + (++clock) * 1000).toISOString();
    // Postgres keeps jsonb with its keys sorted, and hands rows back that way.
    // The fake has to do the same, or a hash that minds the order passes here
    // and pushes the same row again for ever against the real thing.
    const jsonb = (v) => Array.isArray(v) ? v.map(jsonb)
      : v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, jsonb(v[k])]))
      : v;
    // the pull's order, and its key: (synced_at, kind, id)
    const byKey = (a, b) => a.synced_at < b.synced_at ? -1 : a.synced_at > b.synced_at ? 1
      : a.kind < b.kind ? -1 : a.kind > b.kind ? 1 : a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
    const api = {
      table, writes: 0, reads: 0,
      history: [],       // what .from('planner_rows_history') answers
      feed: null,        // the one planner_feeds row, if saved
      failNext: null,    // an error the next query answers with, once
      auth: {
        sessions: 0, refreshes: 0,
        async getSession() { api.auth.sessions++; return { data: { session: api.auth.none ? null : { user: { id: USER }, access_token: 'tok' } } }; },
        async refreshSession() { api.auth.refreshes++; return { data: { session: { user: { id: USER } } } }; }
      },
      from(name) {
        const q = {
          _table: name,
          _gt: null, _after: null, _limit: null, _up: null, _del: false,
          select() { return q; },
          gt(_col, val) { q._gt = val; return q; },
          // the keyset page: synced_at.gt."t",and(synced_at.eq."t",kind.gt."k"),and(…,id.gt."i")
          or(expr) {
            const take = (col) => { const m = expr.match(new RegExp(col + '\\.gt\\."((?:[^"\\\\]|\\\\.)*)"')); return m ? m[1].replace(/\\(.)/g, '$1') : null; };
            q._after = { synced_at: take('synced_at'), kind: take('kind'), id: take('id') };
            return q;
          },
          eq() { return q; },
          order() { return q; },
          limit(n) { q._limit = n; return q; },
          maybeSingle() { return q; },
          delete() { q._del = true; return q; },
          upsert(list) { q._up = list; return q; },
          then(res) {
            if (api.failNext) { const err = api.failNext; api.failNext = null; res({ data: null, error: err }); return; }
            if (q._table === 'planner_feeds') {
              if (q._up) api.feed = { ...q._up };
              else if (q._del) api.feed = null;
              res({ data: q._up || q._del ? null : (api.feed ? { updated_at: api.feed.updated_at } : null), error: null });
            } else if (q._up) {
              const data = [];
              for (const r of q._up) {
                const i = table.findIndex((x) => x.kind === r.kind && x.id === r.id);
                const old = i >= 0 ? table[i] : null;
                // planner_rows_keep_newest: a live write older than the row it lands
                // on is dropped, and what comes back is the row the server kept
                const refused = !!(old && !r.deleted && old.updated_at && r.updated_at && r.updated_at < old.updated_at);
                // a server that never keeps quite what it was sent, for the loop breaker
                const kept = refused ? old.data : mutate ? { ...jsonb(r.data), touched: ++touched } : jsonb(r.data);
                const row = refused ? { ...old, synced_at: stamp() } : { ...r, data: kept, synced_at: stamp() };
                if (i >= 0) table[i] = row; else table.push(row);
                api.writes++;
                // what .select('kind,id,data,deleted,synced_at') answers
                data.push({ kind: row.kind, id: row.id, data: row.data, deleted: row.deleted, synced_at: row.synced_at });
              }
              res({ data, error: null });
            } else if (q._table === 'planner_rows_history') {
              res({ data: api.history.slice().sort((a, b) => (a.replaced_at < b.replaced_at ? 1 : -1)), error: null });
            } else {
              api.reads++;
              let data = table
                .filter((r) => q._gt ? r.synced_at > q._gt : q._after ? byKey(r, q._after) > 0 : true)
                .sort(byKey);
              if (q._limit) data = data.slice(0, q._limit);
              res({ data, error: null });
            }
          }
        };
        return q;
      }
    };
    return api;
  }

  const USER = 'test-user';
  const serverRow = (fake, id) => fake.table.find((r) => r.kind === 'item' && r.id === id);
  const at = (n) => new Date(Date.UTC(2026, 0, 1) + n * 1000).toISOString();   // the fake's clock, n seconds in
  const remote = (id, n, title = id) => ({
    user_id: USER, kind: 'item', id, data: { id, title }, deleted: false, updated_at: at(n), synced_at: at(n)
  });

  function reset() {
    state.items.length = 0; state.areas.length = 0;
    for (const k of Object.keys(state.notes)) delete state.notes[k];
    Object.assign(state.settings.cloud, {
      url: 'https://fake.supabase.co', anonKey: 'anon', enabled: true, cursor: '', lastSync: null
    });
    C.resetLocalSyncState();   // the key on disk, and the copy cloud.js keeps in memory
  }

  function fresh(seed, opts) {
    reset();
    const fake = makeFake(seed, opts);
    C._setClient(fake, { userId: USER, email: 't@e.st' });
    return fake;
  }

  /* A delete must survive a pull that still sees the row alive on the server.
     Regression: winner() treated "missing locally" as "new from the cloud" and
     re-added it, after which push saw it present and never wrote the tombstone. */
  async function tDeleteBeatsLivePull() {
    const fake = fresh();
    commit(() => { upsertItem({ id: 'hw', title: 'hw' }); });
    await C.sync();
    check('setup: server has the item', !!serverRow(fake, 'hw') && !serverRow(fake, 'hw').deleted);

    // another device touches the row, so our next pull re-fetches it
    serverRow(fake, 'hw').synced_at = new Date(Date.UTC(2026, 0, 2)).toISOString();

    commit(() => deleteItem('hw'));
    await C.sync();

    check('delete survives a pull', !itemById('hw'), '(it came back)');
    check('tombstone reaches the server', !!serverRow(fake, 'hw')?.deleted,
          `(deleted=${serverRow(fake, 'hw')?.deleted})`);
  }

  /* A delete landing mid-round-trip must still be pushed. Regression: the
     baseline was snapshotted from state after push returned, so a delete made
     during the await looked already-synced and its tombstone was never sent —
     gone here, still alive on every other device. */
  async function tDeleteDuringPush() {
    const fake = fresh();
    commit(() => { upsertItem({ id: 'ps4', title: 'ps4' }); });
    await C.sync();

    let fired = false;
    const origFrom = fake.from.bind(fake);
    fake.from = () => {
      const q = origFrom();
      const origThen = q.then.bind(q);
      q.then = (res) => {
        if (q._up && !fired) { fired = true; commit(() => deleteItem('ps4')); }
        origThen(res);
      };
      return q;
    };

    commit(() => { upsertItem({ id: 'ps4', title: 'ps4 edited' }); });
    await C.sync();          // the delete lands inside this sync's push
    fake.from = origFrom;
    await C.sync();          // the next sync must still tombstone it

    check('delete during push survives', !itemById('ps4'), '(it came back)');
    check('tombstone still reaches the server', !!serverRow(fake, 'ps4')?.deleted,
          `(deleted=${serverRow(fake, 'ps4')?.deleted})`);
  }

  /* Guards on the fix: a row genuinely new to this device must still arrive. */
  async function tRemoteRowAdopted() {
    fresh([{
      user_id: USER, kind: 'item', id: 'remote1',
      data: { id: 'remote1', title: 'from other device', subtasks: [], done: false },
      deleted: false,
      updated_at: new Date(Date.UTC(2026, 0, 3)).toISOString(),
      synced_at: new Date(Date.UTC(2026, 0, 3)).toISOString()
    }]);
    await C.sync();
    check('new remote row is adopted', !!itemById('remote1'), '(never arrived)');
  }

  /* Our own write comes back down the realtime channel we are subscribed to.
     Applying it sets the row to what it already holds and still reports a
     change, and the repaint that follows takes the caret out of whatever was
     being typed — the typing having caused the write. */
  async function tOwnEchoIsQuiet() {
    const fake = fresh();
    commit(() => { upsertItem({ id: 'fw', title: 'freewrite' }); });
    await C.sync();

    // the server re-announces the row we just sent, unchanged
    const row = serverRow(fake, 'fw');
    row.synced_at = new Date(Date.UTC(2026, 0, 9)).toISOString();

    let repaints = 0;
    const off = subscribe((meta) => { if (meta?.source === 'cloud') repaints++; });
    await C.sync();
    off();

    check('our own echo repaints nothing', repaints === 0, `(repainted ${repaints}x)`);
    check('...and the row is still here', itemById('fw')?.title === 'freewrite');
  }

  /* A push must settle. The server hands rows back with jsonb's sorted keys;
     a hash that minded the order read every row back as "changed", adopted
     the server's copy, recorded the server's hash — and the next sync hashed
     our own order, saw a change, and sent the same row up again. Every sync,
     each push waking the next: one a second, for as long as the app was open. */
  async function tPushSettles() {
    const fake = fresh();
    commit(() => { upsertItem({ id: 'ps', title: 'settle', plan: { date: '2026-09-03', start: '09:00', mins: 60 } }); });
    await C.sync();
    const after = fake.writes;
    check('setup: the first sync wrote', after > 0);
    await C.sync();
    check('a second sync with nothing edited writes nothing', fake.writes === after, `(wrote ${fake.writes - after} more)`);
    await C.sync();
    check('...nor a third', fake.writes === after, `(wrote ${fake.writes - after} more)`);
    check('...and the row is still here, as it was', itemById('ps')?.plan?.start === '09:00');
  }

  /* The log says what each sync did. It is how the next loop gets found in
     a minute instead of three releases. */
  async function tSyncLog() {
    const fake = fresh();
    commit(() => { upsertItem({ id: 'lg', title: 'logged' }); });
    await C.sync();
    let e = C.cloud.log[0];
    check('the log has the sync, newest first', !!e && e.up >= 1 && e.down === 0 && e.error === null,
      JSON.stringify(e));
    check('...with how long it took', typeof e.ms === 'number' && e.ms >= 0);

    fake.table.push({ user_id: USER, kind: 'item', id: 'from-phone', data: { id: 'from-phone', title: 'phone' },
      deleted: false, updated_at: new Date(Date.UTC(2026, 0, 5)).toISOString(), synced_at: new Date(Date.UTC(2026, 0, 5)).toISOString() });
    await C.sync();
    e = C.cloud.log[0];
    check('a row that came down is counted', e.down === 1 && e.up === 0, JSON.stringify(e));
    check('the log is kept to thirty', C.cloud.log.length <= 30);
  }

  /* A push with nothing edited here, sync after sync, is a loop — the kind
     shipped three times this week. Sync stops itself rather than run all
     night, and Sync now starts it again. */
  async function tLoopBreaker() {
    const fake = fresh([], { mutate: true });
    commit(() => { upsertItem({ id: 'lp', title: 'looping' }); });
    let halted = 0;
    for (let i = 0; i < 8; i++) { await C.sync(); if (C.cloud.halted) { halted = i + 1; break; } }
    check('a push on every sync with nothing edited trips the breaker', C.cloud.halted === true, `(after ${halted} syncs)`);
    check('...and says so as an error', C.cloud.status === 'error' && /loop/i.test(C.cloud.message), C.cloud.message);
    check('...in the log too', C.cloud.log[0].error === 'loop');

    const before = fake.writes;
    await C.sync();
    check('a sync while halted does nothing', fake.writes === before);
    await C.sync({ manual: true });
    check('Sync now runs once more', fake.writes > before);

    commit(() => { upsertItem({ id: 'lp2', title: 'a real edit' }); });
    C.resetLocalSyncState();
    check('a rebuild clears the halt', C.cloud.halted === false);
  }

  /* An upsert has no undo; the history table on the server is it. A version
     put back must go up as the newest thing, or the trigger drops it. */
  async function tRestore() {
    const fake = fresh();
    commit(() => { upsertItem({ id: 'rs', title: 'new draft' }); });
    await C.sync();
    fake.history.push({
      hid: 1, kind: 'item', id: 'rs', deleted: false,
      data: { id: 'rs', title: 'old draft', updatedAt: '2026-01-01T00:00:00.000Z' },
      updated_at: '2026-01-01T00:00:00.000Z', replaced_at: '2026-01-02T00:00:00.000Z'
    });
    const rows = await C.history();
    check('history lists what the server used to hold', rows.length === 1 && rows[0].data.title === 'old draft');

    let repaints = 0;
    const off = subscribe((meta) => { if (meta?.source === 'restore') repaints++; });
    check('a version can be put back', C.restore(rows[0]) === true && itemById('rs')?.title === 'old draft');
    off();
    check('...and the page is told', repaints === 1);
    check('...stamped now, not with the old clock', itemById('rs').updatedAt > '2026-06-01', itemById('rs').updatedAt);
    const before = fake.writes;
    await C.sync();
    check('...so it goes up on the next sync', fake.writes > before && serverRow(fake, 'rs').data.title === 'old draft');
  }

  /* An iOS app that slept for hours wakes with an expired token. A sync fired
     straight away got a 401 before supabase-js had refreshed it, and the
     first thing the phone showed after waking was an error. */
  async function tResume() {
    const fake = fresh();
    commit(() => { upsertItem({ id: 'rs1', title: 'resume' }); });
    await C.resume();
    check('resume asks for the session first', fake.auth.sessions === 1, String(fake.auth.sessions));
    check('...then syncs', fake.writes > 0 && C.cloud.status === 'ready');

    fake.auth.none = true;
    await C.resume();
    check('no session on waking means signed out, not an error', C.cloud.status === 'signed-out');
    fake.auth.none = false;
  }

  async function tExpiredToken() {
    const fake = fresh();
    commit(() => { upsertItem({ id: 'jw1', title: 'expired' }); });
    fake.failNext = { code: 'PGRST301', message: 'JWT expired' };
    await C.sync();
    await new Promise((r) => setTimeout(r, 400));   // the retry runs 250ms after
    check('an expired token is refreshed', fake.auth.refreshes === 1, String(fake.auth.refreshes));
    check('...and the sync tried once more, and got through', C.cloud.status === 'ready' && !!serverRow(fake, 'jw1'));
    check('...noted in the log', C.cloud.log.some((e) => /refreshed/.test(e.error || '')));

    // and when the refresh does not help: the retry fails the same way
    fake.failNext = { code: 'PGRST301', message: 'JWT expired' };
    await C.sync();                                  // fails, refreshes, schedules the retry
    fake.failNext = { code: 'PGRST301', message: 'JWT expired' };
    await new Promise((r) => setTimeout(r, 400));   // the retry meets it again
    check('a refresh that does not help ends as an error, not a loop',
      C.cloud.status === 'error' && fake.auth.refreshes === 2, `${C.cloud.status} after ${fake.auth.refreshes} refreshes`);
  }

  /* The guard has to be the hash, not applyRow: applyRow reports a change for
     any live row, identical or not, which is what made the echo loud. */
  {
    const before = state.items.length;
    check('applyRow cannot tell an identical row from a new one',
      applyRow({ kind: 'item', id: 'nosuch', data: { id: 'nosuch', title: 'x' }, deleted: false }) === true);
    state.items.length = before;
  }

  /* ...and a delete made on another device must still remove it here. */
  async function tRemoteTombstoneApplied() {
    const fake = fresh();
    commit(() => { upsertItem({ id: 'gone', title: 'gone' }); });
    await C.sync();

    const row = serverRow(fake, 'gone');
    row.deleted = true;
    row.updated_at = new Date(Date.UTC(2026, 0, 5)).toISOString();
    row.synced_at = new Date(Date.UTC(2026, 0, 5)).toISOString();

    await C.sync();
    check('remote tombstone deletes locally', !itemById('gone'), '(still here)');
  }

  /* The Canvas feed link carries a token, so it is one row of its own on
     the server, never in state or a snapshot; the canvas-feed function is
     what reads it. */
  async function tFeedRow() {
    const fake = fresh();
    check('no link saved reads as none', (await C.feedSaved()) === null);
    await C.saveFeedUrl('https://x.instructure.com/feeds/calendars/user_1.ics');
    check('the link goes to its own row, as this user', fake.feed?.user_id === USER && /instructure/.test(fake.feed.url), JSON.stringify(fake.feed));
    check('...and reads back as saved', typeof (await C.feedSaved()) === 'string');
    check('...and is nowhere in a snapshot', !JSON.stringify(snapshotRows()).includes('instructure'));

    const real = globalThis.fetch;
    const calls = [];
    let answer = { status: 204, body: '' };
    globalThis.fetch = async (url, init) => {
      calls.push({ url, init });
      return { status: answer.status, ok: answer.status < 300, text: async () => answer.body };
    };
    const fails = async () => { try { await C.fetchFeed(); return null; } catch (e) { return e; } };
    try {
      check('no link on the server is 204, and null here', (await C.fetchFeed()) === null);
      check('...asked of the function, as this user',
        /\/functions\/v1\/canvas-feed$/.test(calls[0]?.url) && calls[0].init.headers.Authorization === 'Bearer tok', JSON.stringify(calls[0]));
      answer = { status: 200, body: 'BEGIN:VCALENDAR' };
      check('the feed text comes through', (await C.fetchFeed()) === 'BEGIN:VCALENDAR');
      answer = { status: 404, body: '{"code":"NOT_FOUND"}' };
      check('a function not deployed says how to deploy it', /deploy canvas-feed/.test((await fails())?.message));
      answer = { status: 502, body: 'Canvas answered 500' };
      check('any other failure comes through as the function said it', (await fails())?.message === 'Canvas answered 500');
    } finally { globalThis.fetch = real; }

    await C.saveFeedUrl('');
    check('forgetting the link deletes the row', fake.feed === null && (await C.feedSaved()) === null);
    check('a missing feeds table names the file to run',
      /upgrade\.sql/.test(C.describeSyncError({ code: '42P01', message: 'relation "public.planner_feeds" does not exist' })));
  }

  /* A push upserts 200 rows in one statement, and the server stamps them all
     with the one transaction time. Paged by that stamp alone, a page that
     ended inside a batch lost the rest of it: the next page asked for what
     came after the stamp. Ten rows over three stamps, three to a page, so
     both page ends fall inside a stamp. */
  async function tPagedPull() {
    const stamps = [5, 5, 5, 5, 6, 6, 7, 7, 7, 7];
    const seed = stamps.map((s, i) => remote('pg' + i, s, 'page ' + i));
    const fake = fresh(seed);
    C.pullSettings.page = 3;
    try { await C.sync(); } finally { C.pullSettings.page = 500; }
    const got = seed.filter((r) => itemById(r.id)).length;
    check('a pull paged inside a batch brings every row', got === 10, `(got ${got} of 10)`);
    check('...over several pages', fake.reads >= 4, `(${fake.reads} reads)`);
    check('...and the cursor is the last stamp', state.settings.cloud.cursor === at(7), state.settings.cloud.cursor);
    const before = fake.writes;
    await C.sync();
    check('...none of which goes back up', fake.writes === before, `(wrote ${fake.writes - before})`);
  }

  /* A row another device wrote between our pull and our push has a stamp
     after the one and before the other. A cursor moved up to the push
     stepped over it, and no pull ever asked for it again. */
  async function tCursorStaysAtPull() {
    const fake = fresh([remote('early', 1)]);
    commit(() => { upsertItem({ id: 'mine', title: 'mine' }); });
    await C.sync();   // pulls `early`, pushes `mine` after it
    check('setup: the push landed after the pull', serverRow(fake, 'mine').synced_at > at(1) && !!itemById('early'));
    check('the cursor is what pull saw, not what push wrote', state.settings.cloud.cursor === at(1), state.settings.cloud.cursor);
    fake.table.push(remote('phone', 50));   // between the two
    await C.sync();
    check('a row written between our pull and our push still comes down', !!itemById('phone'), '(never arrived)');
  }

  /* A live row sent for one the server has since tombstoned: the trigger
     keeps the tombstone and hands it back. Kept here and recorded as sent,
     the row sat on this device for ever and never went up again. */
  async function tRefusedForTombstone() {
    // something far ahead to pull, so the cursor sits past where the tombstone will
    const fake = fresh([remote('far', 500)]);
    commit(() => { upsertItem({ id: 'tb', title: 'tb' }); });
    await C.sync();
    // deleted on the phone, newer than anything here, and stamped behind our cursor so no pull sees it
    Object.assign(serverRow(fake, 'tb'), { deleted: true, data: {}, updated_at: '2027-01-01T00:00:00.000Z', synced_at: at(200) });
    commit(() => { upsertItem({ id: 'tb', title: 'tb edited' }); });
    await C.sync();
    check('a live row refused for a newer tombstone is let go here', !itemById('tb'), '(kept)');
    check('...and counted as adopted', C.cloud.log[0].adopted === 1, JSON.stringify(C.cloud.log[0]));
    const before = fake.writes;
    await C.sync();
    check('...and nothing is sent for it after', fake.writes === before, `(wrote ${fake.writes - before})`);
  }

  /* Two tabs on one device. The other tab's edits arrive as a save from
     outside, and its push leaves our baseline behind, so our next sync sends
     rows nothing here typed — once per glance at the idle tab. Five glances
     halted sync for a loop that was not one. */
  async function tExternalSaveIsAnEdit() {
    fresh([], { mutate: true });   // a server that has this device push on every sync
    commit(() => { upsertItem({ id: 'tab', title: 'two tabs' }); });
    for (let i = 0; i < 8; i++) {
      window.dispatchEvent(new StorageEvent('storage', { key: 'semesterPlanner.v1', newValue: JSON.stringify(state) }));
      await C.sync();
    }
    check('a save seen from another tab counts as an edit for the loop breaker',
      C.cloud.halted === false && C.cloud.status === 'ready', C.cloud.message);
  }

  /* An edit made here while a page of the pull was on its way. Judged by
     hashes taken before the await, the row looked clean, the remote copy
     won, and the edit was written over. */
  async function tEditDuringPull() {
    const fake = fresh();
    commit(() => { upsertItem({ id: 'ed', title: 'first' }); });
    await C.sync();
    // the phone's edit, older than the one about to be typed here
    const row = serverRow(fake, 'ed');
    Object.assign(row, { data: { ...row.data, title: 'from the phone' }, updated_at: at(5), synced_at: at(900) });

    let fired = false;
    const origFrom = fake.from.bind(fake);
    fake.from = () => {
      const q = origFrom();
      const origThen = q.then.bind(q);
      q.then = (res) => {
        if (!q._up && !fired) { fired = true; commit(() => { upsertItem({ id: 'ed', title: 'typed here' }); }); }
        origThen(res);
      };
      return q;
    };
    await C.sync();
    fake.from = origFrom;
    check('an edit made while the pull was out is kept', itemById('ed')?.title === 'typed here', itemById('ed')?.title);
    check('...and goes up', serverRow(fake, 'ed').data.title === 'typed here', serverRow(fake, 'ed').data.title);
  }

  for (const [name, fn] of [
    ['delete beats a live pull', tDeleteBeatsLivePull],
    ['delete during push', tDeleteDuringPush],
    ['remote row adopted', tRemoteRowAdopted],
    ['our own echo is quiet', tOwnEchoIsQuiet],
    ['remote tombstone applied', tRemoteTombstoneApplied],
    ['a push settles', tPushSettles],
    ['the sync log', tSyncLog],
    ['the loop breaker', tLoopBreaker],
    ['history and restore', tRestore],
    ['resume refreshes first', tResume],
    ['an expired token', tExpiredToken],
    ['the feed row', tFeedRow],
    ['a paged pull', tPagedPull],
    ['the cursor stays at the pull', tCursorStaysAtPull],
    ['refused for a tombstone', tRefusedForTombstone],
    ['an external save is an edit', tExternalSaveIsAnEdit],
    ['an edit during the pull', tEditDuringPull]
  ]) {
    await fn();
  }

  /* ---- the one Postgres error worth explaining ---- */

  {
    const help = /upgrade\.sql/;
    check('a kind CHECK violation names the file to run',
      help.test(C.describeSyncError({ code: '23514', message: 'violates check constraint' })));
    check('...matched by name too, since PostgREST may drop the code',
      help.test(C.describeSyncError({ message: 'new row violates check constraint "planner_rows_kind_check"' })));
    check('any other error is passed through as it came',
      C.describeSyncError({ code: '42501', message: 'permission denied' }) === 'permission denied');
    check('a thrown non-error still reads as something',
      C.describeSyncError('network down') === 'network down');
  }

  // stand down before the harness restores localStorage
  state.settings.cloud.enabled = false;
  C.stop();
});

suite('Cloud sync — the baseline is small', async ({ check }) => {
  /* The baseline used to keep every row's whole JSON as its "hash", one
     copy of the store beside the store. On a phone that ran localStorage
     out of room, the baseline stopped saving, and every sync pushed
     everything. A hash is a few characters now. */
  const { rowHash } = await import('../js/cloud.js');
  const row = { id: 'i1', title: 'Read chapter 3', plan: { date: '2026-09-03', start: '09:00', mins: 60 }, notes: 'x'.repeat(2000) };

  check('a hash is short', rowHash(row).length < 24, rowHash(row));
  check('...whatever the row holds', rowHash({ ...row, notes: 'y'.repeat(50000) }).length < 24);
  check('the same row hashes the same', rowHash(row) === rowHash(JSON.parse(JSON.stringify(row))));
  check('one changed letter is a different hash', rowHash(row) !== rowHash({ ...row, title: 'Read chapter 4' }));
  check('a tick is a different hash', rowHash({ ...row, done: false }) !== rowHash({ ...row, done: true }));
  check('an empty row still has one', typeof rowHash({}) === 'string' && rowHash({}).length > 0);
  const many = new Set();
  for (let i = 0; i < 5000; i++) many.add(rowHash({ ...row, title: 'Task ' + i }));
  check('five thousand near-identical rows do not collide', many.size === 5000, String(many.size));

  /* Postgres keeps jsonb with its keys sorted, so a row comes back from the
     server in an order other than the one it went up in. A hash of the bytes
     as they were called that a change, and push read its own row back as
     "different" on every sync — for ever, one a second. */
  check('the order of the keys makes no difference',
    rowHash({ a: 1, b: 2, c: [1, 2] }) === rowHash({ c: [1, 2], b: 2, a: 1 }));
  check('...nor nested', rowHash({ plan: { date: 'd', start: 's', mins: 1 } }) === rowHash({ plan: { mins: 1, start: 's', date: 'd' } }));
  check('the order inside a list still counts', rowHash({ ids: ['a', 'b'] }) !== rowHash({ ids: ['b', 'a'] }));
  check('a key holding undefined is the same as no key at all', rowHash({ a: 1, b: undefined }) === rowHash({ a: 1 }),
    'JSON.stringify drops it, and so does the server');
  check('null is not undefined', rowHash({ a: 1, b: null }) !== rowHash({ a: 1 }));
});
