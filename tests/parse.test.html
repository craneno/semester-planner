<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick add tests</title>
<link rel="stylesheet" href="./tests.css">
</head>
<body>
<script type="module">
import { suite, storeWith } from './harness.js';

const base = {
  version: 8,
  semester: { name: 'Fall 2026', start: '2026-08-01', end: '2026-12-12' },
  areas: [
    { id: 'a1', name: 'Thermodynamics', category: 'course', order: 0 },
    { id: 'p1', name: 'Personal', category: 'personal', order: 1 }
  ],
  items: [], cards: [], notes: {}
};

suite('Quick add — dates, ranges and types', async ({ check }) => {
  const s = await storeWith(base);
  const p = (str) => s.parseQuickAdd(str);

  /** end time, worked back out of start + duration */
  const endOf = (plan) => {
    const [H, M] = plan.start.split(':').map(Number);
    const t = H * 60 + M + plan.mins;
    return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
  };
  const span = (str) => {
    const r = p(str);
    return r.plan && r.plan.start ? `${r.plan.start}-${endOf(r.plan)}` : null;
  };

  /* ---- the case that started this ---- */

  {
    const r = p('fly to boston aug 29 12-7');
    check('a time range is not left in the title', r.title === 'fly to boston', `got "${r.title}"`);
    check('a time range books the block', !!r.plan && r.plan.start === '12:00', `got ${r.plan?.start}`);
    check('...for the whole span', r.plan.mins === 420, `got ${r.plan.mins}`);
    check('...on the date given', r.plan.date === '2026-08-29', `got ${r.plan.date}`);
    check('a scheduled thing has no due date', r.due === null && r.dueTime === null,
      'a due date alone never reaches Google Calendar');
    check('a range with no other hint reads as an event', r.type === 'event', `got ${r.type}`);
  }

  /* ---- reading bare hours the way a person means them ---- */

  check('morning hours stay morning', span('lab 9-11') === '09:00-11:00', span('lab 9-11'));
  check('small hours read as afternoon', span('study 2-4') === '14:00-16:00', span('study 2-4'));
  check('noon reads as noon', span('shift 12-3') === '12:00-15:00', span('shift 12-3'));
  check('a range across noon still moves forward', span('shift 11-1') === '11:00-13:00', span('shift 11-1'));
  check('an explicit meridiem is obeyed', span('dinner 6pm-8pm') === '18:00-20:00', span('dinner 6pm-8pm'));
  check('minutes survive', span('call 2:30-4pm') === '14:30-16:00', span('call 2:30-4pm'));
  check('"to" works as well as a dash', span('seminar 9 to 11am') === '09:00-11:00', span('seminar 9 to 11am'));
  check('a trailing meridiem covers both ends', span('office 10 to 11am') === '10:00-11:00', span('office 10 to 11am'));

  /* ---- ranges of things that are not hours ---- */

  for (const str of ['read ch 3-4', 'pages 10-20', 'problem 2-5', 'section 1-3', 'week 2-3 notes']) {
    check(`"${str}" is not a time range`, p(str).plan === null,
      'a chapter range must not become an afternoon meeting');
  }
  check('a chapter range stays in the title', p('read ch 3-4').title === 'read ch 3-4');

  /* ---- deadlines still behave ---- */

  {
    const r = p('problem set 3 due fri 5pm 2h !high');
    check('a deadline keeps its due date', !!r.due);
    check('a deadline keeps its time', r.dueTime === '17:00', `got ${r.dueTime}`);
    check('a deadline books no block', r.plan === null);
    check('a duration becomes the estimate', r.estMins === 120, `got ${r.estMins}`);
    check('priority is read', r.priority === 'high');
    check('the noise is stripped from the title', r.title === 'problem set 3', `got "${r.title}"`);
  }

  /* ---- the four types ---- */

  check('coursework is homework', p('problem set 4').type === 'homework');
  check('reading is homework', p('read chapter 9').type === 'homework');
  check('an exam is an event', p('midterm exam').type === 'event');
  check('a meeting is a meeting', p('sync with advisor').type === 'meeting');
  check('an errand is a task', p('email registrar').type === 'task');
  check('anything unrecognised is a task', p('something vague').type === 'task', p('something vague').type);
  check('every parsed type is a real type',
    ['problem set 4', 'midterm', 'sync', 'email someone', 'whatever']
      .every((str) => s.ITEM_TYPES.includes(p(str).type)));
  check('an explicit type word wins', p('event with the dean').type === 'event');

  /* ---- areas ---- */

  check('an area is matched by name', p('Thermodynamics reading').areaId === 'a1');
  check('an area is matched by #tag', p('essay #Thermodynamics').areaId === 'a1');
  check('no match leaves it for the store to default', p('random thing').areaId === null);

  /* ---- all day ----
     A date with no time in it: the third shape a `when` can take, beside a
     booked block and a deadline. It reaches Google as an all-day event, so
     the parse has to leave a plan behind rather than a due date. */

  {
    const r = p('team dinner sep 12 all day');
    check('"all day" books the day rather than a deadline',
      !!r.plan && r.plan.date === '2026-09-12', `got ${JSON.stringify(r.plan)}`);
    check('...with no time of its own', r.plan.start === null, `got ${r.plan.start}`);
    check('...and nothing owed', r.due === null && r.dueTime === null);
    check('the words are out of the title', r.title === 'team dinner', `got "${r.title}"`);
  }

  check('a hyphen reads the same', p('conference oct 2 all-day').plan?.start === null);
  check('and one word too', p('conference oct 2 allday').plan?.start === null);
  const { today } = await import('../js/util.js');
  check('"all day" alone means today',
    p('reading day all day').plan?.date === today(), `got ${p('reading day all day').plan?.date}`);
  check('a time range loses to it — the day was named twice',
    p('offsite sep 12 9-5 all day').plan?.start === null);
  check('"all" on its own is just a word',
    p('read all of chapter 4 sep 12').plan === null);
  check('...and so is "day"', p('day trip sep 12').plan === null);

  /* ---- what the store then does with it ---- */

  {
    const made = s.upsertItem(p('random errand'));
    check('an item with no area lands in Personal',
      made.areaId === 'p1', `got ${s.areaName(made.areaId)}`);
  }
  {
    const made = s.upsertItem(p('Thermodynamics reading'));
    check('a matched area is not overridden by the default', made.areaId === 'a1');
  }
});

suite('Quick add — more ways to say when, and repeats', async ({ check }) => {
  const s = await storeWith(base);
  const p = (str) => s.parseQuickAdd(str);
  const { today, addDays } = await import('../js/util.js');
  const dow = (d) => new Date(d + 'T00:00:00').getDay();

  check('"tmrw" is tomorrow', p('call advisor tmrw').due === addDays(today(), 1));
  check('"in 3 days" counts from today', p('renew pass in 3 days').due === addDays(today(), 3));
  check('...and leaves a clean title', p('renew pass in 3 days').title === 'renew pass');
  check('"in a week" is seven days', p('follow up in a week').due === addDays(today(), 7));
  check('"in 2 weeks" is fourteen', p('follow up in 2 weeks').due === addDays(today(), 14));
  check('"next week" is a week from today', p('draft next week').due === addDays(today(), 7));
  {
    const d = p('rent in a month').due;
    const [y, m] = today().split('-').map(Number);
    check('"in a month" lands a month on', d && d.slice(0, 7) === `${m === 12 ? y + 1 : y}-${String(m === 12 ? 1 : m + 1).padStart(2, '0')}`, String(d));
  }
  check('"this fri" is the coming Friday, and "this" goes with it',
    p('gym this fri').title === 'gym' && dow(p('gym this fri').due) === 5);

  {
    const r = p('gym every mon');
    check('"every mon" makes a weekly rule on Monday', r.repeat?.freq === 'weekly' && r.repeat.days.join() === '1', JSON.stringify(r.repeat));
    check('...anchored on a Monday', dow(r.due) === 1 && r.due >= today(), r.due);
    check('...with the word gone from the title', r.title === 'gym');
    check('...and an empty exception list to write into', r.repeat.ex && Object.keys(r.repeat.ex).length === 0);
  }
  {
    const r = p('lab every tue and thu 2-4pm');
    check('two days and a range make a weekly block', r.repeat?.days.join() === '2,4' && r.plan?.start === '14:00' && r.plan.mins === 120, JSON.stringify(r));
    check('...on the first of those days', [2, 4].includes(dow(r.plan.date)) && r.plan.date >= today(), r.plan.date);
  }
  check('"every other week" doubles the interval', p('laundry every other week').repeat?.every === 2);
  check('"every weekday" is Monday to Friday', p('standup every weekday 9am').repeat?.days.join() === '1,2,3,4,5');
  check('"daily" is a daily rule due today', p('vitamins daily').repeat?.freq === 'daily' && p('vitamins daily').due === today());
  check('"monthly" is monthly', p('rent monthly').repeat?.freq === 'monthly');
  check('a named day still wins as the anchor', p('reading every mon fri').due && dow(p('reading every mon fri').due) === 5,
    '"every mon" then "fri": the rule is Mondays, the first one is set by the date word');
  check('"every monitor" is not a repeat', p('check every monitor').repeat === undefined && p('check every monitor').title === 'check every monitor');
  check('a line with no repeat has no rule', p('read ch 3 fri').repeat === undefined);
});

suite('Quick add — area tags', async ({ check }) => {
  const s = await storeWith({
    ...base,
    areas: [
      { id: 'th', name: 'Thermodynamics', category: 'course', order: 0 },
      { id: 'ee', name: 'Electrical Engineering', category: 'course', order: 1 },
      { id: 'lab', name: 'EE lab', category: 'course', order: 2 },
      { id: 'mm', name: 'Math Methods', category: 'course', order: 3 },
      { id: 'gone', name: 'Old course', category: 'course', order: 4, archived: true }
    ]
  });
  const p = (str) => s.parseQuickAdd(str);

  check('#thermo is the start of a name', p('pset 3 #thermo').areaId === 'th');
  check('@ does the same as #', p('pset 3 @thermo').areaId === 'th');
  check('the whole name still works', p('pset 3 #thermodynamics').areaId === 'th');
  check('the start of any word in the name', p('quiz @methods').areaId === 'mm');
  check('an exact name beats a prefix of a longer one', p('report @eelab').areaId === 'lab');
  check('a prefix of the name beats a word inside another', p('report @electrical').areaId === 'ee');
  check('the tag is taken out of the title', p('pset 3 @thermo').title === 'pset 3', JSON.stringify(p('pset 3 @thermo').title));
  check('an archived area is not a home', p('x @old').areaId === null);
  check('an unknown tag leaves the area unset', p('x @nothing').areaId === null);
  check('a tag with no letters is not a tag', p('call at 3 @ 4').areaId === null);
});

/* The 2026-09-04 bug hunt: every line here was typed into the real bar and
   came out wrong. Kept as the spec for the parser. */
suite('Quick add — what the bug hunt found', async ({ check }) => {
  const s = await storeWith({
    ...base,
    areas: [
      { id: 'th', name: 'Thermodynamics', category: 'course', order: 0 },
      { id: 'cs', name: 'CS', category: 'course', order: 1 },
      { id: 'cs101', name: 'CS 101', category: 'course', order: 2 },
      { id: 'cpp', name: 'C++', category: 'course', order: 3 },
      { id: 'gone', name: 'Old course', category: 'course', order: 4, archived: true }
    ]
  });
  const p = (str) => s.parseQuickAdd(str);
  const { today, addDays, diffDays } = await import('../js/util.js');
  const dow = (d) => new Date(d + 'T00:00:00').getDay();

  /* ---- "by" is "due" ---- */

  {
    const r = p('Read ch 3 by fri');
    check('"by fri" is a deadline', !!r.due && dow(r.due) === 5, String(r.due));
    check('...and "by" goes with the day', r.title === 'Read ch 3', `got "${r.title}"`);
  }
  check('"by" with no day after it is a word',
    p('stand by the door').title === 'stand by the door' && p('stand by the door').due === null);
  {
    const r = p('essay by kant due fri');
    check('"due" still wins, and a "by" that names no day stays',
      !!r.due && dow(r.due) === 5 && r.title === 'essay by kant', `got "${r.title}"`);
  }

  /* ---- dates the calendar does not have ---- */

  for (const [str, title] of [['exam #cs 3/40', 'exam 3/40'], ['meet 31/2', 'meet 31/2'], ['party feb 30', 'party feb 30']]) {
    const r = p(str);
    check(`"${str}" is not a date`, r.due === null && r.plan === null, JSON.stringify([r.due, r.plan]));
    check('...and the words stay in the title', r.title === title, `got "${r.title}"`);
  }
  check('...though the area still lands', p('exam #cs 3/40').areaId === 'cs');
  check('a real numeric date still reads', p('exam 3/4/2027').due === '2027-03-04', p('exam 3/4/2027').due);

  /* ---- a month and day with no year ---- */

  {
    const past = addDays(today(), -30);
    const md = `${+past.slice(5, 7)}/${+past.slice(8, 10)}`;
    const r = p(`exam ${md}`);
    check('a day a month gone means next year',
      !!r.due && r.due > today() && r.due.slice(5) === past.slice(5), `${md} -> ${r.due}`);
    const near = addDays(today(), -6);
    const md2 = `${+near.slice(5, 7)}/${+near.slice(8, 10)}`;
    const r2 = p(`exam ${md2}`);
    check('...but a few days back stays where it is',
      !!r2.due && r2.due.slice(5) === near.slice(5) && diffDays(r2.due, today()) <= 14, `${md2} -> ${r2.due}`);
  }

  /* ---- clocks that do not exist ---- */

  {
    const r = p('task at 25:99');
    check('"25:99" is not a time', r.dueTime === null && r.due === null && r.plan === null, JSON.stringify(r));
    check('...and stays in the title', r.title === 'task at 25:99', `got "${r.title}"`);
  }
  check('"13pm" is not a time either', p('call 13pm').dueTime === null, String(p('call 13pm').dueTime));
  check('"at 14:30" still is', p('call at 14:30').dueTime === '14:30');

  /* ---- more words for when ---- */

  check('"yesterday" is yesterday', p('log hours due yesterday').due === addDays(today(), -1));
  check('...and is out of the title', p('log hours due yesterday').title === 'log hours',
    `got "${p('log hours due yesterday').title}"`);
  {
    const r = p('noon meeting at noon');
    check('"noon" is twelve', r.dueTime === '12:00', String(r.dueTime));
    check('...the second one, not the first', r.title === 'noon meeting', `got "${r.title}"`);
  }
  check('"midnight" is the end of the day', p('submit by midnight').dueTime === '23:59', String(p('submit by midnight').dueTime));
  check('"at 5pm" takes the "at" with it', p('call at 5pm').title === 'call', `got "${p('call at 5pm').title}"`);

  /* ---- repeats ---- */

  {
    const r = p('every 2 weeks review');
    check('"every 2 weeks" is every second week', r.repeat?.freq === 'weekly' && r.repeat.every === 2, JSON.stringify(r.repeat));
    check('...with a clean title', r.title === 'review', `got "${r.title}"`);
  }
  check('"every 3 days" is daily, every third',
    p('water plants every 3 days').repeat?.freq === 'daily' && p('water plants every 3 days').repeat.every === 3,
    JSON.stringify(p('water plants every 3 days').repeat));
  check('"every 6 months" is monthly, every sixth',
    p('dentist every 6 months').repeat?.freq === 'monthly' && p('dentist every 6 months').repeat.every === 6,
    JSON.stringify(p('dentist every 6 months').repeat));
  for (const str of ['gym weekly on sat and sun', 'gym every sat and sun', 'gym every week on sat, sun']) {
    const r = p(str);
    check(`"${str}" is Saturdays and Sundays`, r.repeat?.days?.join() === '0,6', JSON.stringify(r.repeat));
    check('...and nothing but "gym" is left', r.title === 'gym', `got "${r.title}"`);
  }

  /* ---- plan and due in one line ---- */

  {
    const r = p('essay work on mon due fri');
    check('"work on mon due fri" plans Monday', !!r.plan && dow(r.plan.date) === 1, JSON.stringify(r.plan));
    check('...and is due Friday', !!r.due && dow(r.due) === 5, String(r.due));
    check('...leaving "essay"', r.title === 'essay', `got "${r.title}"`);
  }
  {
    const r = p('essay plan mon due fri 5pm');
    check('the due clause keeps its own time', !!r.due && dow(r.due) === 5 && r.dueTime === '17:00',
      JSON.stringify([r.due, r.dueTime]));
    check('...and the plan does not take it', !!r.plan && dow(r.plan.date) === 1 && r.plan.start === null,
      JSON.stringify(r.plan));
  }
  {
    const r = p('essay due fri 5pm plan mon 9am');
    check('the other way round works too',
      dow(r.due) === 5 && r.dueTime === '17:00' && dow(r.plan.date) === 1 && r.plan.start === '09:00' && r.title === 'essay',
      JSON.stringify(r));
  }

  /* ---- letters that grow when lowered ---- */

  check('"İstanbul" keeps all its letters', p('İstanbul trip tomorrow').title === 'İstanbul trip',
    `got "${p('İstanbul trip tomorrow').title}"`);

  /* ---- areas by name ---- */

  check('an archived area is not matched by name', p('Old course notes').areaId === null);
  check('the longest name wins', p('CS 101 hw').areaId === 'cs101', String(p('CS 101 hw').areaId));
  check('...and the short one still works alone', p('CS hw').areaId === 'cs');
  check('"C++" can be an area', p('C++ hw').areaId === 'cpp', String(p('C++ hw').areaId));

  /* ---- words that hide a weekday ---- */

  check('"Thus" is not Thursday', p('Thus we begin').due === null && p('Thus we begin').title === 'Thus we begin',
    JSON.stringify(p('Thus we begin')));
  check('"next monitor" is not next Monday', p('next monitor').due === null);

  /* ---- ranges that are not hours ---- */

  check('"problem set 3-4" is not a time range',
    p('problem set 3-4').plan === null && p('problem set 3-4').title === 'problem set 3-4', p('problem set 3-4').title);
  {
    const r = p('Sep 3-5 conference');
    check('"Sep 3-5" is days, not hours', r.plan === null, JSON.stringify(r.plan));
    check('...and stays whole in the title', r.title === 'Sep 3-5 conference', `got "${r.title}"`);
  }
  {
    const r = p('submit 2026-09-04');
    check('an ISO date is a date', r.due === '2026-09-04', String(r.due));
    check('...not a nine-to-four', r.plan === null && r.title === 'submit', `got "${r.title}"`);
  }
  {
    const r = p('lab 14:00-16:00');
    check('a 24h range is read as one', r.plan?.start === '14:00' && r.plan.mins === 120, JSON.stringify(r.plan));
  }
  check('"12-7" is still noon to seven', p('12-7').plan?.start === '12:00' && p('12-7').plan.mins === 420, JSON.stringify(p('12-7').plan));
  check('...named by what was typed', p('12-7').title === '12-7', `got "${p('12-7').title}"`);

  /* ---- a title has a length ---- */

  check('a title stops at 500 characters', p('x'.repeat(600)).title.length === 500, String(p('x'.repeat(600)).title.length));
});

</script>
</body>
</html>
