<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time grid tests</title>
<link rel="stylesheet" href="./tests.css">
</head>
<body>
<script type="module">
/* The gesture itself needs a pointer, but everything it decides is
   arithmetic: which way the drag went, where the quarter hours fall, and how
   long a block ends up. That part is testable, and it is the part that has
   ever been wrong. */
import { suite, sharedStoreWith } from './harness.js';

suite('Time grid — sweeping out a range', async ({ check }) => {

  // timegrid.js reaches the canonical store through ui.js and editor.js
  await sharedStoreWith({
    version: 15,
    semester: { name: 'Fall 2026', start: '2026-09-02', end: '2026-12-12' },
    areas: [{ id: 'c1', name: 'Thermo', category: 'course', order: 0 }],
    items: [], cards: [], links: [], wishlist: [], habits: [], habitLog: {}, notes: {}
  });
  const {
    sweep, spanBetween, snapMins, SNAP,
    grabMode, moveBlock, resizeTop, resizeBottom, EDGE
  } = await import('../js/timegrid.js');

  /* ---- quarter hours ---- */

  {
    check('a snap is a quarter of an hour', SNAP === 15);
    check('minutes round to the nearest quarter', snapMins(607) === 600, String(snapMins(607)));
    check('...in both directions', snapMins(608) === 615, String(snapMins(608)));
    check('a quarter is left alone', snapMins(615) === 615);
  }

  /* ---- which way the drag went ---- */

  {
    const down = sweep(9 * 60, 11 * 60);
    check('dragging down is the range you drew',
      down.start === 540 && down.mins === 120, `${down.start} +${down.mins}`);
    const up = sweep(11 * 60, 9 * 60);
    check('dragging up is the same range, not a negative one',
      up.start === 540 && up.mins === 120, `${up.start} +${up.mins}`);
  }

  /* ---- a block always has a height ---- */

  {
    const flick = sweep(600, 600);
    check('a range with no drag in it is still one quarter',
      flick.start === 600 && flick.mins === 15, `${flick.mins}`);
    check('...so a flick of the wrist cannot make a block with no height',
      sweep(600, 604).mins === 15);
    check('a few pixels either way still snaps to something real',
      sweep(607, 613).mins === 15 && sweep(607, 613).start === 600);
  }

  /* ---- the ends of the day ---- */

  {
    check('a drag off the top of the grid starts at midnight',
      sweep(-120, 90).start === 0);
    check('a drag off the bottom stops at midnight',
      sweep(23 * 60, 26 * 60).start + sweep(23 * 60, 26 * 60).mins === 24 * 60,
      String(sweep(23 * 60, 26 * 60).mins));
    check('a range at the very end of the day still has room to exist',
      (() => { const r = sweep(24 * 60, 24 * 60); return r.start === 24 * 60 - 15 && r.mins === 15; })());
    check('a grid that ends early clamps to its own end',
      (() => { const r = sweep(22 * 60, 23 * 60, { dayEnd: 22 * 60 + 30 }); return r.start + r.mins === 22 * 60 + 30; })(),
      'the week grid stops at the hour Settings gives it');
  }

  /* ---- typed times, once the prompt is open ---- */

  {
    check('an hour is an hour', spanBetween('09:00', '10:00') === 60);
    check('quarter hours survive', spanBetween('09:15', '09:45') === 30);
    check('midnight at the end is a real end', spanBetween('23:00', '24:00') === 60);
    check('an end before the start falls back to an hour',
      spanBetween('11:00', '09:00') === 60,
      'better an hour than a block with a negative length');
    check('the same time twice is not a zero-length block',
      spanBetween('09:00', '09:00') === 60);
    check('nonsense is an hour', spanBetween('', 'later') === 60);
  }

  /* ---- which part of a block the pointer has hold of ---- */

  {
    const tall = { top: 100, bottom: 200, height: 100 };
    check('the top edge resizes', grabMode(tall, 103) === 'top');
    check('the bottom edge resizes', grabMode(tall, 197) === 'bottom');
    check('the middle moves', grabMode(tall, 150) === 'move');
    check('one pixel inside the edge is still the edge',
      grabMode(tall, 100 + EDGE - 1) === 'top' && grabMode(tall, 200 - EDGE + 1) === 'bottom');
    check('one pixel past it is the middle',
      grabMode(tall, 100 + EDGE) === 'move' && grabMode(tall, 200 - EDGE) === 'move');

    // a quarter-hour block is about 13px tall on the day clock
    const short = { top: 0, bottom: 13, height: 13 };
    check('a short block keeps a middle to be moved by',
      grabMode(short, 6) === 'move',
      'two full edges would leave a quarter-hour block impossible to move');
    check('...and still has edges', grabMode(short, 1) === 'top' && grabMode(short, 12) === 'bottom');
    const tiny = { top: 0, bottom: 2, height: 2 };
    check('a block too small for any of it is all middle',
      grabMode(tiny, 1) === 'move',
      'better a block that only moves than one that cannot be caught at all');
  }

  /* ---- carrying a block to another time ---- */

  {
    check('a block moves to where it is put',
      (() => { const r = moveBlock(10 * 60, 90); return r.start === 600 && r.mins === 90; })());
    check('...keeping its length', moveBlock(7 * 60 + 7, 45).mins === 45);
    check('...and snapping to the quarter', moveBlock(607, 60).start === 600);
    check('a block carried off the top of the day stops at midnight',
      moveBlock(-90, 60).start === 0);
    check('a block carried off the bottom stops with its end at midnight',
      (() => { const r = moveBlock(23 * 60 + 45, 60); return r.start + r.mins === 24 * 60; })(),
      'the whole block stays in the day, rather than its tail being cut off');
    check('a block longer than the grid still lands somewhere',
      moveBlock(600, 26 * 60).start === 0);
  }

  /* ---- stretching one by an edge ---- */

  {
    // 09:00 for an hour
    const s = 9 * 60, dur = 60;

    check('dragging the top up starts it earlier and makes it longer',
      (() => { const r = resizeTop(s, dur, 8 * 60 + 30); return r.start === 510 && r.mins === 90; })());
    check('dragging the top down starts it later and makes it shorter',
      (() => { const r = resizeTop(s, dur, 9 * 60 + 30); return r.start === 570 && r.mins === 30; })());
    check('the end stays exactly where it was',
      [8 * 60, 9 * 60 + 15, 9 * 60 + 45].every((m) => {
        const r = resizeTop(s, dur, m); return r.start + r.mins === s + dur;
      }), 'the top edge is the only one being dragged');
    check('the top cannot be dragged past the end',
      (() => { const r = resizeTop(s, dur, 11 * 60); return r.mins === 15 && r.start === s + dur - 15; })(),
      'a block turned inside out would draw with a negative height');
    check('...nor off the top of the day', resizeTop(s, dur, -120).start === 0);

    check('dragging the bottom down makes it longer',
      (() => { const r = resizeBottom(s, 11 * 60); return r.start === 540 && r.mins === 120; })());
    check('dragging the bottom up makes it shorter',
      resizeBottom(s, 9 * 60 + 30).mins === 30);
    check('the start stays exactly where it was',
      [8 * 60, 10 * 60, 23 * 60].every((m) => resizeBottom(s, m).start === s));
    check('the bottom cannot be dragged above the start',
      resizeBottom(s, 7 * 60).mins === 15,
      'one quarter is the floor, the same one a swept range gets');
    check('...nor past midnight',
      resizeBottom(s, 26 * 60).start + resizeBottom(s, 26 * 60).mins === 24 * 60);
    check('a grid that ends early clamps a stretch to its own end',
      resizeBottom(s, 23 * 60, { dayEnd: 22 * 60 }).mins === 22 * 60 - s);
  }

  /* ---- the click a block owns ----
     The browser fires one after every drag, so dragBlock listens for it
     rather than letting the element carry its own onclick. That is also the
     only way a block opens on a phone, where the drag never starts. */

  {
    const { dragBlock } = await import('../js/timegrid.js');
    const host = document.createElement('div');
    host.style.cssText = 'position:absolute;left:-9999px;top:0;width:200px;height:400px';
    document.body.append(host);
    const el = document.createElement('div');
    el.style.cssText = 'position:absolute;top:0;height:52px;width:100%';
    host.append(el);

    let opened = 0;
    dragBlock(el, { date: '2026-09-10', start: '09:00', mins: 60 }, {
      hit: () => ({ date: '2026-09-10', mins: 540, col: host }),
      hourH: 52,
      onDrop: () => {},
      onClick: () => { opened++; }
    });

    el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    check('a tap on a block opens it', opened === 1, String(opened));

    // a real drag: press, move past the threshold, release — then the click
    // the browser sends afterwards, which must not open anything
    const pt = (type, x, y) => new PointerEvent(type,
      { bubbles: true, button: 0, pointerId: 1, pointerType: 'mouse', clientX: x, clientY: y });
    el.dispatchEvent(pt('pointerdown', 10, 10));
    window.dispatchEvent(pt('pointermove', 10, 90));
    window.dispatchEvent(pt('pointerup', 10, 90));
    el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    check('the click after a drag is eaten, not an open', opened === 1, String(opened));

    el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    check('...and only that one — the next tap opens it again', opened === 2, String(opened));

    // touch never starts a drag, so the tap is all there is
    el.dispatchEvent(new PointerEvent('pointerdown',
      { bubbles: true, button: 0, pointerId: 2, pointerType: 'touch', clientX: 10, clientY: 10 }));
    el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    check('a touch press leaves the tap alone', opened === 3, String(opened));

    host.remove();
  }
});
</script>
</body>
</html>
