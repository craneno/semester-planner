<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar tests</title>
<link rel="stylesheet" href="./tests.css">
</head>
<body>
<script type="module">
import { suite, sharedStoreWith } from './harness.js';

const base = {
  version: 6,
  semester: { name: 'Fall 2026', start: '2026-09-02', end: '2026-12-12' },
  areas: [], items: [], cards: [], notes: {}
};

// 2026-09-07 is a Monday, so: Mon 1, Tue 2, Wed 3, Thu 4, Fri 5
const ev = (o) => ({ allDay: false, location: '', end: null, ...o });
const weekly = (id, title, dates, start, end, location) =>
  dates.map((d) => ev({ id: id + d, recurringEventId: id, title, date: d, start, end, location }));

suite('Calendar — recurring series detection', async ({ check }) => {
  // gcal.js reads the canonical store, so this suite must share that instance
  const s = await sharedStoreWith(base);
  const G = await import('../js/gcal.js');
  const only = (id, list) => list.find((x) => x.id === id);

  /* a lecture Mon/Wed plus a Friday lab under one parent, one moved instance,
     a weekly meeting, a one-off, and a repeating all-day event */
  s.state.events = [
    ...weekly('lec', 'Thermo Lecture', ['2026-09-07', '2026-09-14', '2026-09-21'], '10:30', '11:35', 'Snell 108'),
    ...weekly('lec', 'Thermo Lecture', ['2026-09-09', '2026-09-16', '2026-09-23'], '10:30', '11:35', 'Snell 108'),
    ...weekly('lec', 'Thermo Lecture', ['2026-09-11', '2026-09-18'], '14:00', '16:00', 'Lab 22'),
    ev({ id: 'moved', recurringEventId: 'lec', title: 'Thermo Lecture', date: '2026-09-28', start: '08:00', end: '09:00' }),
    ...weekly('ner', 'NER Weekly', ['2026-09-08', '2026-09-15', '2026-09-22'], '19:00', '20:30', 'Hayden'),
    ...weekly('rare', 'Advisor 1:1', ['2026-09-10', '2026-09-24'], '15:00', '15:30', ''),
    ev({ id: 'oneoff', recurringEventId: null, title: 'Coffee', date: '2026-09-10', start: '09:00' }),
    ...weekly('hol', 'Reading day', ['2026-09-05', '2026-09-12'], null, null, '').map((e) => ({ ...e, allDay: true }))
  ];

  const series = G.recurringSeries();
  const lec = only('lec', series);
  const ner = only('ner', series);

  check('a repeating event is found', !!lec);
  check('a one-off is not a series', !only('oneoff', series) && !series.some((x) => x.title === 'Coffee'));
  check('an all-day series is skipped', !only('hol', series), 'they belong in the all-day rail, not a schedule');
  check('a series below the threshold is skipped', !only('rare', series), '2 instances is not a pattern');

  check('the title comes from the instances', lec.title === 'Thermo Lecture');
  check('the room comes from the instances', lec.location === 'Snell 108');
  check('instances are counted', lec.count === 9, `got ${lec.count}`);   // 3 Mon + 3 Wed + 2 Fri + 1 moved
  check('the range is reported', lec.first === '2026-09-07' && lec.last === '2026-09-28');

  /* the interesting part: one parent, two different weekly slots */
  check('two distinct slots become two schedule rows', lec.schedule.length === 2,
    `got ${lec.schedule.length}`);
  const mw = lec.schedule.find((r) => r.start === '10:30');
  const fri = lec.schedule.find((r) => r.start === '14:00');
  check('same-time days are merged into one row', mw && mw.days.join() === '1,3', `got ${mw?.days}`);
  check('the second slot keeps its own day', fri && fri.days.join() === '5', `got ${fri?.days}`);
  check('each row keeps its own end time', mw.end === '11:35' && fri.end === '16:00');
  check('each row keeps its own room', fri.location === 'Lab 22', `got ${fri.location}`);
  check('a one-off moved instance is not in the schedule',
    !lec.schedule.some((r) => r.start === '08:00'),
    'a single rescheduled week would otherwise become a phantom weekly slot');

  check('a second series is separate', ner && ner.schedule.length === 1);
  check('the meeting lands on its weekday', ner.schedule[0].days.join() === '2', `got ${ner.schedule[0].days}`);
  check('busier series sort first', series[0].id === 'lec');

  /* the shape has to drop straight into an area */
  const row = lec.schedule[0];
  check('a schedule row is shaped like an area schedule',
    Array.isArray(row.days) && 'start' in row && 'end' in row && 'location' in row);

  s.state.events = [];
  check('no events means no series', G.recurringSeries().length === 0);

  /* ---- what a planned block becomes on Google ----
     A block with a start is a span of time; one without is the whole day, and
     Google says whole days in dates rather than times — `end.date` being the
     morning after, not the same date twice. */

  {
    const item = (plan) => ({ id: 't1', title: 'Retreat', areaId: null, notes: '', due: null, plan });

    const allDay = G.eventBodyFor(item({ date: '2026-09-12', start: null, mins: 0 }));
    check('an all-day block goes up as a date', allDay.start.date === '2026-09-12',
      JSON.stringify(allDay.start));
    check('...with no time in it', !allDay.start.dateTime && !allDay.end.dateTime);
    check('...ending the morning after', allDay.end.date === '2026-09-13',
      'Google reads end.date as exclusive; the same date twice is a zero-length event');

    const timed = G.eventBodyFor(item({ date: '2026-09-12', start: '09:00', mins: 90 }));
    check('a timed block still goes up as times',
      !!timed.start.dateTime && !timed.start.date, JSON.stringify(timed.start));
    check('...for exactly as long as it is', timed.end.dateTime.includes('10:30'),
      timed.end.dateTime);
    check('both carry the id that makes it ours',
      allDay.extendedProperties.private.plannerItemId === 't1'
      && timed.extendedProperties.private.plannerItemId === 't1');
  }
});
</script>
</body>
</html>
