<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar tests</title>
<link rel="stylesheet" href="./tests.css">
</head>
<body>
<script type="module">
import { suite, sharedStoreWith } from './harness.js';

const base = {
  version: 6,
  semester: { name: 'Fall 2026', start: '2026-09-02', end: '2026-12-12' },
  areas: [], items: [], cards: [], notes: {}
};

// 2026-09-07 is a Monday, so: Mon 1, Tue 2, Wed 3, Thu 4, Fri 5
const ev = (o) => ({ allDay: false, location: '', end: null, ...o });
const weekly = (id, title, dates, start, end, location) =>
  dates.map((d) => ev({ id: id + d, recurringEventId: id, title, date: d, start, end, location }));

/* Seeded once, before any suite: gcal.js reads the canonical store, and
   import() caches, so the three suites below share this one state. Each
   puts back what it touched — items, outbox, events, settings — in finally. */
const s = await sharedStoreWith(base);

suite('Calendar — recurring series detection', async ({ check }) => {
  const G = await import('../js/gcal.js');
  const only = (id, list) => list.find((x) => x.id === id);

  try {
    /* a lecture Mon/Wed plus a Friday lab under one parent, one moved instance,
       a weekly meeting, a one-off, and a repeating all-day event */
    s.state.events = [
      ...weekly('lec', 'Thermo Lecture', ['2026-09-07', '2026-09-14', '2026-09-21'], '10:30', '11:35', 'Snell 108'),
      ...weekly('lec', 'Thermo Lecture', ['2026-09-09', '2026-09-16', '2026-09-23'], '10:30', '11:35', 'Snell 108'),
      ...weekly('lec', 'Thermo Lecture', ['2026-09-11', '2026-09-18'], '14:00', '16:00', 'Lab 22'),
      ev({ id: 'moved', recurringEventId: 'lec', title: 'Thermo Lecture', date: '2026-09-28', start: '08:00', end: '09:00' }),
      ...weekly('ner', 'NER Weekly', ['2026-09-08', '2026-09-15', '2026-09-22'], '19:00', '20:30', 'Hayden'),
      ...weekly('rare', 'Advisor 1:1', ['2026-09-10', '2026-09-24'], '15:00', '15:30', ''),
      ev({ id: 'oneoff', recurringEventId: null, title: 'Coffee', date: '2026-09-10', start: '09:00' }),
      ...weekly('hol', 'Reading day', ['2026-09-05', '2026-09-12'], null, null, '').map((e) => ({ ...e, allDay: true }))
    ];

    const series = G.recurringSeries();
    const lec = only('lec', series);
    const ner = only('ner', series);

    check('a repeating event is found', !!lec);
    check('a one-off is not a series', !series.some((x) => x.title === 'Coffee'));
    check('an all-day series is skipped', !only('hol', series), 'they belong in the all-day rail, not a schedule');
    check('a series below the threshold is skipped', !only('rare', series), '2 instances is not a pattern');

    check('the title comes from the instances', lec.title === 'Thermo Lecture');
    check('the room comes from the instances', lec.location === 'Snell 108');
    check('instances are counted', lec.count === 9, `got ${lec.count}`);   // 3 Mon + 3 Wed + 2 Fri + 1 moved
    check('the range is reported', lec.first === '2026-09-07' && lec.last === '2026-09-28');

    /* the interesting part: one parent, two different weekly slots */
    check('two distinct slots become two schedule rows', lec.schedule.length === 2,
      `got ${lec.schedule.length}`);
    const mw = lec.schedule.find((r) => r.start === '10:30');
    const fri = lec.schedule.find((r) => r.start === '14:00');
    check('same-time days are merged into one row', mw && mw.days.join() === '1,3', `got ${mw?.days}`);
    check('the second slot keeps its own day', fri && fri.days.join() === '5', `got ${fri?.days}`);
    check('each row keeps its own end time', mw.end === '11:35' && fri.end === '16:00');
    check('each row keeps its own room', fri.location === 'Lab 22', `got ${fri.location}`);
    check('a one-off moved instance is not in the schedule',
      !lec.schedule.some((r) => r.start === '08:00'),
      'a single rescheduled week would otherwise become a phantom weekly slot');

    check('a second series is separate', ner && ner.schedule.length === 1);
    check('the meeting lands on its weekday', ner.schedule[0].days.join() === '2', `got ${ner.schedule[0].days}`);
    check('busier series sort first', series[0].id === 'lec');

    /* the shape has to drop straight into an area */
    const row = lec.schedule[0];
    check('a schedule row is shaped like an area schedule',
      Array.isArray(row.days) && 'start' in row && 'end' in row && 'location' in row);

    s.state.events = [];
    check('no events means no series', G.recurringSeries().length === 0);

    /* ---- what a planned block becomes on Google ----
       A block with a start is a span of time; one without is the whole day, and
       Google says whole days in dates rather than times — `end.date` being the
       morning after, not the same date twice. */

    const item = (plan) => ({ id: 't1', title: 'Retreat', areaId: null, notes: '', due: null, plan });

    const allDay = G.eventBodyFor(item({ date: '2026-09-12', start: null, mins: 0 }));
    check('an all-day block goes up as a date', allDay.start.date === '2026-09-12',
      JSON.stringify(allDay.start));
    check('...with no time in it', !allDay.start.dateTime && !allDay.end.dateTime);
    check('...ending the morning after', allDay.end.date === '2026-09-13',
      'Google reads end.date as exclusive; the same date twice is a zero-length event');

    const timed = G.eventBodyFor(item({ date: '2026-09-12', start: '09:00', mins: 90 }));
    check('a timed block still goes up as times',
      !!timed.start.dateTime && !timed.start.date, JSON.stringify(timed.start));
    check('...for exactly as long as it is', timed.end.dateTime.includes('10:30'),
      timed.end.dateTime);
    check('both carry the id that makes it ours',
      allDay.extendedProperties.private.plannerItemId === 't1'
      && timed.extendedProperties.private.plannerItemId === 't1');

    // the summary names the area; the description is the notes, then the deadline
    s.state.areas.push({ id: 'a1', name: 'Thermo', category: 'course' });
    const full = G.eventBodyFor({ id: 't2', title: 'Retreat', areaId: 'a1', notes: 'bring the notes', due: '2026-09-20',
      plan: { date: '2026-09-12', start: '09:00', mins: 30 } });
    check('the summary is the area and the title', full.summary === 'Thermo: Retreat', full.summary);
    check('the description carries the notes, then the deadline', full.description === 'bring the notes\n\nDue 2026-09-20',
      JSON.stringify(full.description));
    check('no area, no prefix', G.eventBodyFor(item({ date: '2026-09-12', start: '09:00', mins: 30 })).summary === 'Retreat');

    // how long: the block's own minutes, else the estimate, else an hour
    const endOf = (extra) => G.eventBodyFor({ ...item({ date: '2026-09-12', start: '09:00', mins: 0 }), ...extra }).end.dateTime;
    check('a block with no length takes the estimate', endOf({ estMins: 45 }).includes('09:45'), endOf({ estMins: 45 }));
    check('...and an hour with no estimate either', endOf({}).includes('10:00'), endOf({}));
  } finally {
    s.state.events = [];
    s.state.areas.length = 0;
  }
});

/* Pushes are a queue. What has to hold: nothing goes out the moment a block
   changes; the changes of one item fold into one write, sent after a quiet
   spell; a rate limit is a pause that keeps the queue and sends again by
   itself, and is never shown as an error. */
suite('Calendar — pushes go out together', async ({ check }) => {
  const G = await import('../js/gcal.js');
  // A hidden tab throttles a timer set from inside another timer harder
  // with every link in the chain, down to one a minute; a message hop after
  // each wait starts the chain over, so this suite runs the same hidden as
  // shown.
  const hop = () => new Promise((r) => { const c = new MessageChannel(); c.port1.onmessage = () => r(); c.port2.postMessage(0); });
  const tick = (ms) => new Promise((r) => setTimeout(r, ms)).then(hop);

  const real = globalThis.fetch;
  const calls = [];
  // an id per POST, given as the POST comes in: one worked out later from
  // the count of calls named whatever had been fetched in between
  let posts = 0;
  const ok = (init) => {
    const id = init.method === 'POST' ? 'ev-' + (++posts) : 'ev-x';
    return { ok: true, status: 200, json: async () => ({ id }), text: async () => '' };
  };
  let answer = ok;
  globalThis.fetch = async (url, init = {}) => {
    calls.push({ method: init.method || 'GET', url: String(url), at: performance.now() });
    return answer(init);
  };
  const writes = () => calls.filter((c) => c.method !== 'GET');
  const last = () => writes()[writes().length - 1];

  const g = s.state.settings.gcal;
  const had = { settings: { ...G.pushSettings }, g: { ...g }, status: G.gcal.status, lastError: G.gcal.lastError, backoffUntil: G.gcal.backoffUntil };
  Object.assign(g, { enabled: true, pushPlans: true, clientId: 'test-client', calendarId: 'primary' });
  G.gcal.token = { access_token: 'tok', expires_at: Date.now() + 3600e3 };
  Object.assign(G.pushSettings, { wait: 300, maxWait: 600, backoff: 1200, backoffMax: 3000 });
  s.state.outbox.length = 0;

  try {
    s.upsertItem({ id: 'g1', title: 'Lab prep', plan: { date: '2026-09-10', start: '09:00', mins: 60 } });
    await G.pushItem('g1');
    s.upsertItem({ id: 'g1', plan: { date: '2026-09-10', start: '10:00', mins: 60 } });
    await G.pushItem('g1');
    s.upsertItem({ id: 'g1', plan: { date: '2026-09-10', start: '11:00', mins: 60 } });
    await G.pushItem('g1');
    check('nothing goes out the moment a block moves', writes().length === 0);
    check('...it waits in the outbox, once', s.state.outbox.filter((o) => o.itemId === 'g1').length === 1);
    await tick(450);
    check('after a quiet spell, three moves are one write', writes().length === 1 && writes()[0].method === 'POST', JSON.stringify(writes()));
    check('...and the item has its event', s.itemById('g1').gcalId === 'ev-1' && s.state.outbox.length === 0);

    // changes that keep coming for longer than maxWait: the first of them
    // still goes up by maxWait, and never more often than one write per
    // `wait` — measured against the clock, since a browser pane in the
    // background stretches every timer
    // A pane behind another window rounds every timer up to the second, and
    // then "by maxWait" cannot be told from "a second later": measure the
    // drift first, and let the tight bound go only where the clock is coarse
    const d0 = performance.now();
    await new Promise((r) => setTimeout(r, 100));
    const coarse = performance.now() - d0 > 400;
    const t0 = performance.now();
    for (let i = 0; i < 9; i++) {
      setTimeout(() => {
        s.upsertItem({ id: 'g1', plan: { date: '2026-09-10', start: `1${i}:00`, mins: 60 } });
        G.pushItem('g1');
      }, i * 100);
    }
    await tick(1500);
    const took = performance.now() - t0;
    const second = writes()[1];
    check('changes that keep coming still go up by maxWait after the first',
      !!second && second.method === 'PATCH' && (coarse || second.at - t0 <= G.pushSettings.maxWait + 300),
      second ? `${second.method} at ${Math.round(second.at - t0)}ms, maxWait ${G.pushSettings.maxWait}${coarse ? ' (timers coarse here: only the order is checked)' : ''}` : `${writes().length} writes`);
    check('...and never more often than one write per wait',
      writes().length - 1 <= Math.floor(took / G.pushSettings.wait) + 1, `${writes().length - 1} writes in ${Math.round(took)}ms`);

    // Google says slow down: a pause, not an error
    answer = () => ({ ok: false, status: 403, text: async () => '{"error":{"errors":[{"domain":"usageLimits","reason":"rateLimitExceeded"}]}}' });
    s.upsertItem({ id: 'g1', plan: { date: '2026-09-11', start: '09:00', mins: 60 } });
    await G.pushItem('g1');
    await tick(450);
    check('a rate limit is a pause, shown as waiting, not an error', G.gcal.status === 'waiting' && /pause/.test(G.gcal.message), G.gcal.status);
    check('...the change stays in line', s.state.outbox.some((o) => o.itemId === 'g1'));
    const left = G.gcal.backoffUntil - Date.now();
    check('...for as long as Google asked', left > 0 && left <= G.pushSettings.backoff, `(${left}ms left of ${G.pushSettings.backoff})`);
    const n = writes().length;
    answer = ok;
    await tick(1500);
    check('...and goes out by itself when the pause is over', writes().length === n + 1 && s.state.outbox.length === 0, `${writes().length} vs ${n}`);
    check('...back to ready', G.gcal.status === 'ready' && G.gcal.backoffUntil === 0);

    // the event is gone from Google's side: forget the id and make it again
    answer = (init) => init.method === 'PATCH' ? { ok: false, status: 404, text: async () => 'Not Found' } : ok(init);
    s.upsertItem({ id: 'g1', plan: { date: '2026-09-12', start: '09:00', mins: 60 } });
    await G.pushItem('g1');
    await tick(450);
    const tail = writes().slice(-2).map((c) => c.method).join(' ');
    check('a 404 on the PATCH makes the event again', tail === 'PATCH POST' && s.itemById('g1').gcalId === 'ev-2',
      `(${tail}, gcalId ${s.itemById('g1').gcalId})`);
    answer = ok;

    // ticked: the event is not wanted any more
    s.upsertItem({ id: 'g1', done: true });
    await G.pushItem('g1');
    await tick(450);
    check('a ticked item takes its event off the calendar',
      last().method === 'DELETE' && /ev-2$/.test(last().url) && s.itemById('g1').gcalId === null, `${last().method} ${last().url}`);

    // deleted: the item is gone from state by the time the queue goes out,
    // so the delete has to carry the event id itself
    s.upsertItem({ id: 'g1', done: false, plan: { date: '2026-09-12', start: '09:00', mins: 60 } });
    await G.pushItem('g1');
    await tick(450);   // a new event, ev-3
    G.forgetItem(s.itemById('g1'));
    const op = s.state.outbox.find((o) => o.itemId === 'g1');
    check('forgetting an item queues a delete that carries the event id', op?.kind === 'delete' && op.ids?.[0] === 'ev-3', JSON.stringify(op));
    s.deleteItem('g1');
    await tick(450);
    check('...sent from those ids once the item is gone',
      last().method === 'DELETE' && /ev-3$/.test(last().url) && s.state.outbox.length === 0, `${last().method} ${last().url}`);

    // Google is down: an error, and the change stays in line for next time
    answer = () => ({ ok: false, status: 500, text: async () => 'Backend Error' });
    s.upsertItem({ id: 'g2', title: 'Retry me', plan: { date: '2026-09-13', start: '09:00', mins: 60 } });
    await G.pushItem('g2');
    await tick(450);
    check('a 5xx is an error, and the change stays in line',
      G.gcal.status === 'error' && s.state.outbox.some((o) => o.itemId === 'g2'), `(${G.gcal.status}, outbox ${s.state.outbox.length})`);
  } finally {
    globalThis.fetch = real;
    G.gcal.token = null;
    Object.assign(g, had.g);
    Object.assign(G.pushSettings, had.settings);
    Object.assign(G.gcal, { status: had.status, lastError: had.lastError, backoffUntil: had.backoffUntil });
    s.state.outbox.length = 0;
    s.state.items.length = 0;
  }
});

/* The planner is for a life, not a term: Google is read from the day the
   calendar began to a year ahead. A sync token only reports the window it
   was made under, so a window that moved — the start changed, or the year
   ahead run down — reads the lot again. */
suite('Calendar — read from the day the calendar began', async ({ check }) => {
  const G = await import('../js/gcal.js');
  const { today, addDays } = await import('../js/util.js');
  const real = globalThis.fetch;
  const gets = [];
  const reply = (body) => ({ ok: true, status: 200, json: async () => body, text: async () => '' });
  let mode = 'plain';   // plain | gone | paged — what the next read meets, once
  const page1 = { id: 'pg1', summary: 'Page one', start: { date: today() }, end: { date: addDays(today(), 1) } };
  const page2 = { id: 'pg2', summary: 'Page two', start: { date: addDays(today(), 1) }, end: { date: addDays(today(), 2) } };
  globalThis.fetch = async (url, init = {}) => {
    const u = new URL(String(url));
    if ((init.method || 'GET') === 'GET') gets.push(u);
    if (mode === 'gone' && u.searchParams.get('syncToken')) { mode = 'plain'; return { ok: false, status: 410, text: async () => '' }; }
    if (mode === 'paged') {
      if (u.searchParams.get('pageToken') !== 'p2') return reply({ items: [page1], nextPageToken: 'p2' });
      mode = 'plain';
      return reply({ items: [page2], nextSyncToken: 'tok-paged' });
    }
    return reply({ items: [], nextSyncToken: 'tok-' + gets.length });
  };
  const g = s.state.settings.gcal;
  const had = { ...g }, cal0 = s.state.calendar.start;
  Object.assign(g, { enabled: true, pushPlans: true, clientId: 'test-client', calendarId: 'primary', syncToken: '', window: null });
  G.gcal.token = { access_token: 'tok', expires_at: Date.now() + 3600e3 };
  s.state.calendar.start = '2026-08-01';
  const last = () => gets[gets.length - 1].searchParams;

  // the slack is 30 days (AHEAD_SLACK): a year ahead run down by that much
  // is still the window a token was made under; a day more is not
  {
    const want = { start: '2026-08-01', end: '2027-09-08' };
    check('a window short of the year ahead by the slack has not moved', !G.windowMoved({ start: want.start, end: addDays(want.end, -30) }, want));
    check('...one day more, and it has', G.windowMoved({ start: want.start, end: addDays(want.end, -31) }, want));
  }

  try {
    await G.sync();
    check('the first read is from the day the calendar began', (last().get('timeMin') || '').startsWith('2026-08-01'), last().get('timeMin'));
    check('...to a year ahead, not the end of term', (last().get('timeMax') || '').startsWith(addDays(today(), 366)), last().get('timeMax'));
    check('...and the window is written down with the token', g.syncToken === 'tok-1' && g.window?.start === '2026-08-01' && g.window.end === addDays(today(), 365));
    await G.sync();
    check('the next read uses the token', last().get('syncToken') === 'tok-1' && !last().get('timeMin'));

    // Google will not honour the token any more: a 410, once, and the
    // window is read again from the top, with no token in the ask
    mode = 'gone';
    const n = gets.length;
    await G.sync();
    check('a 410 on the token drops it and reads the window again',
      gets.length === n + 2 && !!last().get('timeMin') && !last().get('syncToken'), `(${gets.length - n} reads, last asked ${last()})`);
    check('...and the token that read gave is kept', g.syncToken === 'tok-' + gets.length, g.syncToken);

    // two pages: the first with a page token and no sync token, the last with the sync token
    mode = 'paged';
    await G.sync();
    check('a read of two pages takes both', s.state.events.map((e) => e.id).sort().join() === 'pg1,pg2', JSON.stringify(s.state.events.map((e) => e.id)));
    check('...and keeps the token from the last page', g.syncToken === 'tok-paged' && last().get('pageToken') === 'p2', g.syncToken);

    s.state.calendar.start = '2026-07-01';
    await G.sync();
    check('a first day moved reads the lot again', (last().get('timeMin') || '').startsWith('2026-07-01') && g.window.start === '2026-07-01');
    g.window = { ...g.window, end: addDays(today(), 300) };
    await G.sync();
    check('so does a year ahead run down by more than a month', !!last().get('timeMin') && g.window.end === addDays(today(), 365));
    g.window = { ...g.window, end: addDays(today(), 350) };
    await G.sync();
    check('...but not by less', !!last().get('syncToken') && !last().get('timeMin'));
    check('the term never comes into it', !gets.some((u) => (u.searchParams.get('timeMin') || '').startsWith(base.semester.start)));
  } finally {
    globalThis.fetch = real;
    G.gcal.token = null;
    Object.assign(g, had);
    s.state.calendar.start = cal0;
    s.state.events = [];
  }
});

/* Google's own events, changed in place. What has to hold: the mirror says
   the change at once; a run of edits is one PATCH, with the name and the
   when and nothing else; a pull that gets in first cannot put the old copy
   back; a delete is one DELETE and the event is gone here at once; a PATCH
   on an event Google no longer has drops it here too; and with two-way
   sync off nothing is touched. */
suite('Calendar — Google\'s own events, edited in place', async ({ check }) => {
  const G = await import('../js/gcal.js');
  const hop = () => new Promise((r) => { const c = new MessageChannel(); c.port1.onmessage = () => r(); c.port2.postMessage(0); });
  const tick = (ms) => new Promise((r) => setTimeout(r, ms)).then(hop);

  const real = globalThis.fetch;
  const calls = [];
  let answer = () => ({ ok: true, status: 200, json: async () => ({ items: [], nextSyncToken: 'tok-ev' }), text: async () => '' });
  globalThis.fetch = async (url, init = {}) => {
    calls.push({ method: init.method || 'GET', url: String(url), body: init.body ? JSON.parse(init.body) : null });
    return answer(init, String(url));
  };
  const writes = () => calls.filter((x) => x.method !== 'GET');

  const g = s.state.settings.gcal;
  const had = { settings: { ...G.pushSettings }, g: { ...g }, status: G.gcal.status, lastError: G.gcal.lastError, backoffUntil: G.gcal.backoffUntil };
  // the pull keeps only what falls in the window, which begins the day the
  // calendar did — today, in this seed — so the calendar begins earlier here
  const cal0 = s.state.calendar.start;
  s.state.calendar.start = '2026-08-01';
  Object.assign(g, { enabled: true, pushPlans: true, clientId: 'test-client', calendarId: 'primary', syncToken: 'tok-ev', window: G.pullWindow() });
  G.gcal.token = { access_token: 'tok', expires_at: Date.now() + 3600e3 };
  Object.assign(G.pushSettings, { wait: 300, maxWait: 600, backoff: 1200, backoffMax: 3000 });
  s.state.outbox.length = 0;
  const heads = () => s.state.events.find((x) => x.id === 'heads');
  const seed = () => { s.state.events = [ev({ id: 'heads', title: 'Heads', date: '2026-09-08', start: '18:30', end: '19:00', endDate: '2026-09-08', link: 'https://calendar.google.com/x' })]; };

  try {
    seed();
    check('the change shows at once', G.editEvent('heads', { title: 'Heads, moved', start: '19:00', end: '20:00' }) && heads().title === 'Heads, moved' && heads().start === '19:00');
    G.editEvent('heads', { date: '2026-09-09' });
    check('...and a second edit joins the first in line', s.state.outbox.length === 1 && s.state.outbox[0].itemId === 'event:heads', JSON.stringify(s.state.outbox));
    check('nothing has gone out yet', writes().length === 0);

    // a pull that gets in first brings Google's old copy of it
    answer = () => ({ ok: true, status: 200, json: async () => ({ items: [{ id: 'heads', summary: 'Heads', start: { dateTime: '2026-09-08T18:30:00-04:00' }, end: { dateTime: '2026-09-08T19:00:00-04:00' }, updated: 'x' }], nextSyncToken: 'tok-ev2' }), text: async () => '' });
    await G.sync();
    check('a pull that gets in first does not put the old copy back', heads().title === 'Heads, moved' && heads().date === '2026-09-09' && heads().start === '19:00', JSON.stringify(heads()));
    answer = () => ({ ok: true, status: 200, json: async () => ({ id: 'heads' }), text: async () => '' });

    await tick(450);
    const patch = writes()[0];
    check('a run of edits is one PATCH to the event', writes().length === 1 && patch.method === 'PATCH' && /\/events\/heads$/.test(patch.url), JSON.stringify(writes().map((w) => w.method + ' ' + w.url)));
    check('...with the name and the when', patch.body.summary === 'Heads, moved' && /^2026-09-09T19:00/.test(patch.body.start.dateTime) && /^2026-09-09T20:00/.test(patch.body.end.dateTime), JSON.stringify(patch.body));
    check('...and nothing else of the event', Object.keys(patch.body).sort().join() === 'end,start,summary', Object.keys(patch.body).join());
    check('...the line empty after', s.state.outbox.length === 0);

    G.editEvent('heads', { allDay: true });
    await tick(450);
    check('all day goes as dates, the end the morning after', writes()[1].body.start.date === '2026-09-09' && writes()[1].body.end.date === '2026-09-10' && heads().start === null, JSON.stringify(writes()[1]?.body));

    G.editEvent('heads', { allDay: false, start: '23:00', end: '00:30' });
    await tick(450);
    check('an end before its start is the next morning', /^2026-09-10T00:30/.test(writes()[2].body.end.dateTime), JSON.stringify(writes()[2]?.body));

    // Google no longer has it
    answer = () => ({ ok: false, status: 404, text: async () => 'gone' });
    G.editEvent('heads', { title: 'Heads, again' });
    await tick(450);
    check('a change to an event Google has dropped drops it here too', !heads() && s.state.outbox.length === 0, JSON.stringify(s.state.events));

    seed();
    answer = () => ({ ok: true, status: 204, json: async () => null, text: async () => '' });
    check('a delete takes it off the screen at once', G.removeEvent('heads') && !heads());
    await tick(450);
    const del = writes()[writes().length - 1];
    check('...and off Google with one DELETE', del.method === 'DELETE' && /\/events\/heads$/.test(del.url) && s.state.outbox.length === 0, JSON.stringify(del));

    // every time of a repeating event: one day stands for the rule
    const series = () => s.state.events.filter((x) => x.recurringEventId === 'lab');
    s.state.events = [
      ev({ id: 'lab_1', recurringEventId: 'lab', title: 'Lab', date: '2026-09-08', start: '14:00', end: '15:00', endDate: '2026-09-08' }),
      ev({ id: 'lab_2', recurringEventId: 'lab', title: 'Lab', date: '2026-09-15', start: '14:00', end: '15:00', endDate: '2026-09-15' }),
      ev({ id: 'other', title: 'Other', date: '2026-09-15', start: '14:00', end: '15:00', endDate: '2026-09-15' })
    ];
    const rule = { id: 'lab', summary: 'Lab', start: { dateTime: '2026-09-01T14:00:00-04:00' }, end: { dateTime: '2026-09-01T15:00:00-04:00' } };
    answer = (init) => init.method === 'GET'
      ? { ok: true, status: 200, json: async () => rule, text: async () => '' }
      : { ok: true, status: 200, json: async () => ({ id: 'lab' }), text: async () => '' };
    check('every time: each day of it changes here at once',
      G.editEvent('lab_1', { title: 'Lab, moved', start: '16:00', end: '17:00' }, { all: true })
      && series().every((x) => x.title === 'Lab, moved' && x.start === '16:00' && x.end === '17:00')
      && series().map((x) => x.date).join() === '2026-09-08,2026-09-15', JSON.stringify(series()));
    check('...and not another event at the same time', s.state.events.find((x) => x.id === 'other').title === 'Other');
    check('...one op in line, for the rule', s.state.outbox.length === 1 && s.state.outbox[0].eventId === 'lab' && s.state.outbox[0].series === true, JSON.stringify(s.state.outbox));
    const before = calls.length;
    await tick(450);
    const sent = calls.slice(before);
    check('the rule is read first, for the day it starts', sent[0]?.method === 'GET' && /\/events\/lab$/.test(sent[0].url), JSON.stringify(sent.map((x) => x.method + ' ' + x.url)));
    check('...then changed on that day, at the new time', sent[1]?.method === 'PATCH' && /\/events\/lab$/.test(sent[1].url)
      && sent[1].body.summary === 'Lab, moved' && /^2026-09-01T16:00/.test(sent[1].body.start.dateTime) && /^2026-09-01T17:00/.test(sent[1].body.end.dateTime), JSON.stringify(sent[1]?.body));
    check('delete every time takes each day off the screen', G.removeEvent('lab_2', { all: true }) && series().length === 0 && s.state.events.some((x) => x.id === 'other'));
    answer = () => ({ ok: true, status: 204, json: async () => null, text: async () => '' });
    await tick(450);
    const d2 = writes()[writes().length - 1];
    check('...and the rule off Google', d2.method === 'DELETE' && /\/events\/lab$/.test(d2.url), JSON.stringify(d2));

    seed();
    g.pushPlans = false;
    const n = writes().length;
    check('with two-way sync off nothing is touched', !G.canEditEvents() && G.editEvent('heads', { title: 'x' }) === false && heads().title === 'Heads' && !G.removeEvent('heads') && !!heads());
    await tick(450);
    check('...and nothing goes out', writes().length === n);
  } finally {
    globalThis.fetch = real;
    G.gcal.token = null;
    Object.assign(g, had.g);
    Object.assign(G.pushSettings, had.settings);
    G.gcal.status = had.status; G.gcal.lastError = had.lastError; G.gcal.backoffUntil = had.backoffUntil;
    s.state.calendar.start = cal0;
    s.state.outbox.length = 0;
    s.state.events = [];
  }
});

/* A sign-in that keeps. An access token lasts an hour; a refresh token,
   given when the sign-in went through google-token on the edge, buys the
   next hour without a popup. What has to hold: the refresh token is tried
   first and kept; a 401 spends the hour, not the grant; a grant Google has
   ended is dropped, not asked again for ever; with cloud sync signed in,
   Connect goes the code way and comes back with a refresh token; the
   function not deployed is said plainly; and with no cloud session the
   browser-only way is as it was. */
suite('Calendar — a sign-in that keeps', async ({ check }) => {
  const G = await import('../js/gcal.js');
  const C = await import('../js/cloud.js');
  const real = globalThis.fetch;
  const calls = [];
  let answer = () => ({ status: 200, json: {} });
  globalThis.fetch = async (url, init = {}) => {
    const c = { method: init.method || 'GET', url: String(url), body: init.body ? JSON.parse(init.body) : null };
    calls.push(c);
    const r = await answer(c);
    const text = r.text ?? JSON.stringify(r.json ?? {});
    return { ok: r.status < 300, status: r.status, text: async () => text, json: async () => JSON.parse(text) };
  };
  const toks = () => calls.filter((c) => c.url.includes('/functions/v1/google-token'));
  const g = s.state.settings.gcal;
  const cl = s.state.settings.cloud;
  const had = { g: { ...g }, cl: { ...cl }, google: window.google, token: G.gcal.token, status: G.gcal.status };
  Object.assign(g, { enabled: true, pushPlans: true, clientId: 'test-client', calendarId: 'primary' });
  Object.assign(cl, { url: 'https://x.supabase.co', anonKey: 'anon' });
  const withSession = (tok) => C._setClient({ auth: { getSession: async () => ({ data: { session: tok ? { access_token: tok } : null } }) } }, { userId: 'u1' });
  withSession('sb-jwt');
  // Google's script, stood in for: a popup that never opens, and a code
  // client that hands back a code at once
  let popups = 0;
  window.google = { accounts: { oauth2: {
    initTokenClient: () => ({ requestAccessToken() { popups++; this.error_callback({ type: 'popup_closed' }); } }),
    initCodeClient: (o) => ({ requestCode: () => o.callback({ code: 'code-1' }) })
  } } };

  try {
    // the hour is up, and a refresh token is on the token
    G.gcal.token = { access_token: 'old', expires_at: 0, refresh_token: 'r1' };
    answer = (c) => c.url.includes('google-token') ? { status: 200, json: { access_token: 'new', expires_in: 3600 } } : { status: 200, json: {} };
    await G.signIn(false);
    check('the refresh token buys the hour, with no popup', G.gcal.token.access_token === 'new' && popups === 0, G.gcal.token.access_token);
    check('...asked of google-token as a refresh, with the client id', toks().length === 1 && toks()[0].body.grant === 'refresh' && toks()[0].body.refresh_token === 'r1' && toks()[0].body.client_id === 'test-client', JSON.stringify(toks()[0]?.body));
    check('...and the refresh token is kept, Google having sent none back', G.gcal.token.refresh_token === 'r1');
    const stored = JSON.parse(localStorage.getItem('semesterPlanner.gcalToken') || 'null');
    check('...on this device: in localStorage, never in state', stored?.refresh_token === 'r1' && !JSON.stringify(s.state).includes('refresh_token'));

    // a 401 mid-flight: the hour is spent, the grant is not
    calls.length = 0;
    let first = true;
    answer = (c) => {
      if (c.url.includes('google-token')) return { status: 200, json: { access_token: 'new2', expires_in: 3600 } };
      if (first) { first = false; return { status: 401, text: 'expired' }; }
      return { status: 200, json: { items: [] } };
    };
    await G.listCalendars();
    const lists = calls.filter((c) => c.url.includes('calendarList'));
    check('a 401 refreshes and asks again', toks().length === 1 && G.gcal.token.access_token === 'new2' && lists.length === 2, `${toks().length} refreshes, ${lists.length} asks, ${G.gcal.token.access_token}`);
    check('...keeping the refresh token', G.gcal.token.refresh_token === 'r1');

    // Google has ended the grant: dropped, and the browser-only way is tried
    calls.length = 0;
    G.gcal.token = { access_token: 'old', expires_at: 0, refresh_token: 'r1' };
    answer = (c) => c.url.includes('google-token')
      ? { status: 400, text: JSON.stringify({ error: 'invalid_grant', error_description: 'Token has been expired or revoked.' }) }
      : { status: 200, json: {} };
    await G.signIn(false).catch(() => {});
    check('a grant Google has ended is dropped', !G.gcal.token?.refresh_token, JSON.stringify(G.gcal.token));
    check('...and the browser-only way is tried instead', popups === 1 && G.gcal.status === 'signed-out', `${popups} popups, ${G.gcal.status}`);

    // Connect, with cloud sync signed in: the code way, and a refresh token comes back
    calls.length = 0;
    answer = (c) => c.url.includes('google-token') ? { status: 200, json: { access_token: 'via-code', expires_in: 3600, refresh_token: 'r2' } } : { status: 200, json: {} };
    await G.signIn(true);
    check('Connect goes the code way when cloud sync is signed in', toks().length === 1 && toks()[0].body.grant === 'code' && toks()[0].body.code === 'code-1' && toks()[0].body.redirect_uri === 'postmessage', JSON.stringify(toks()[0]?.body));
    check('...and comes back signed in for good', G.gcal.token.access_token === 'via-code' && G.gcal.token.refresh_token === 'r2' && G.isSignedIn());

    // the function not deployed: said plainly, not a hung Connecting…
    G.gcal.token = null;
    calls.length = 0;
    answer = (c) => c.url.includes('google-token') ? { status: 404, text: 'not found' } : { status: 200, json: {} };
    const err = await G.signIn(true).then(() => null, (e) => e);
    check('google-token missing names the deploy', /functions deploy google-token/.test(err?.message || '') && G.gcal.status === 'signed-out', err?.message);

    // no cloud session: the browser-only way, as before
    withSession(null);
    calls.length = 0;
    popups = 0;
    await G.signIn(true).catch(() => {});
    check('with no cloud session, the popup way as before', popups === 1 && toks().length === 0, `${popups} popups, ${toks().length} asks`);
  } finally {
    globalThis.fetch = real;
    window.google = had.google;
    G.gcal.token = had.token;
    G.gcal.status = had.status;
    try { localStorage.removeItem('semesterPlanner.gcalToken'); } catch { /* ignore */ }
    Object.assign(g, had.g);
    Object.assign(cl, had.cl);
    C._setClient(null);
    C.cloud.userId = null;
  }
});
</script>
