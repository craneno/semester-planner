<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Version tests</title>
<link rel="stylesheet" href="./tests.css">
</head>
<body>
<script type="module">
/* Two things that have to agree with a file rather than with each other:
   the changelog with the service worker's VERSION, and the worker's SHELL
   with what the app actually imports. Both have been wrong before, and
   neither shows up as an error — one deploys the wrong version number, the
   other ships a module that only loads while you are online.

   These read the files over HTTP, which means they read them the way the
   browser does: with a service worker registered, a stale cache would answer
   here too. Tick "Update on reload" in DevTools while developing. */
import { suite } from './harness.js';
import { CHANGELOG, APP_VERSION } from '../js/changelog.js';
import { SYNCED_SETTINGS, DEVICE_SETTINGS } from '../js/store.js';

const text = async (path) => {
  const r = await fetch(path, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${path} → ${r.status}`);
  return r.text();
};

suite('Version — the changelog and the shell', async ({ check }) => {

  const sw = await text('../sw.js');
  const swVersion = (sw.match(/const VERSION = '([^']+)'/) || [])[1];

  /* ---- what the browser is actually running ---- */

  {
    check('the worker names a version', !!swVersion, String(swVersion));
    check('the changelog is that version',
      swVersion === `planner-${APP_VERSION}`,
      `sw.js says ${swVersion}, changelog says ${APP_VERSION}`);
    // CURRENT is defined as CHANGELOG[0]; that it is the newest is the order check below
  }

  /* ---- the changelog itself ---- */

  {
    const nums = CHANGELOG.map((r) => Number(r.version.replace(/^v/, '')));
    check('every version is vN', CHANGELOG.every((r) => /^v\d+$/.test(r.version)));
    // strictly falling, so no number can appear twice either
    check('newest first', nums.every((n, i) => i === 0 || n < nums[i - 1]), nums.join(','));
    check('every release is dated',
      CHANGELOG.every((r) => /^\d{4}-\d{2}-\d{2}$/.test(r.date)));
    const dates = CHANGELOG.map((r) => r.date);
    check('...and the dates run newest first too', dates.every((d, i) => i === 0 || d <= dates[i - 1]),
      dates.filter((d, i) => i > 0 && d > dates[i - 1]).join(','));
    check('every release says what changed',
      CHANGELOG.every((r) => r.notes.length && r.notes.every((n) => n.trim().length > 12)),
      'an empty release note is worse than no list at all');
    check('every release has a title', CHANGELOG.every((r) => r.title.trim().length > 3));
  }

  /* ---- the shell holds everything the app imports ---- */

  {
    const block = sw.slice(sw.indexOf('const SHELL'), sw.indexOf('];', sw.indexOf('const SHELL')));
    const shell = new Set([...block.matchAll(/'(\.\/[^']+)'/g)].map((m) => m[1]));

    // walk the import graph from the entry point index.html loads
    const root = new URL('../', location.href);
    const rel = (u) => u.href.slice(root.href.length);
    const seen = new Set(['js/app.js']);
    const queue = ['js/app.js'];
    const missing = [];
    while (queue.length) {
      const file = queue.shift();
      if (!shell.has('./' + file)) missing.push(file);
      const src = await text('../' + file);
      // `from './x.js'`, a bare `import './x.js'`, and a lazy `import('./x.js')`
      for (const m of src.matchAll(/(?:from\s+|import\s*\(?\s*)'([^']+)'/g)) {
        if (!m[1].startsWith('.')) continue;            // a CDN url is not ours to cache
        const next = rel(new URL(m[1], new URL(file, root)));
        if (!seen.has(next)) { seen.add(next); queue.push(next); }
      }
    }

    check('the app reaches more than a handful of modules', seen.size > 10, String(seen.size));

    // every settings key the code writes is synced or the device's, on
    // purpose: one in neither list would sync, or not, by accident
    const written = new Set();
    for (const file of seen) {
      const src = await text('../' + file);
      for (const m of src.matchAll(/\bsettings\.([a-zA-Z]\w*)\s*=[^=]/g)) written.add(m[1]);
      if (file === 'js/views/settings.js') for (const m of src.matchAll(/\bs\.([a-zA-Z]\w*)\s*=[^=]/g)) written.add(m[1]);
    }
    const listed = new Set([...SYNCED_SETTINGS, ...DEVICE_SETTINGS]);
    const unlisted = [...written].filter((k) => !listed.has(k));
    check('every settings key written is synced or the device\u2019s, by name', unlisted.length === 0, `in neither list: ${unlisted.join(', ')}`);
    check('no key is both', SYNCED_SETTINGS.every((k) => !DEVICE_SETTINGS.includes(k)));
    check('every module the app imports is in the shell', missing.length === 0,
      `not cached: ${missing.join(', ')} — offline, these load from the network or not at all`);
    check('the changelog module is in it', shell.has('./js/changelog.js'));
    check('the shell has no module the app cannot reach',
      [...shell].filter((p) => p.endsWith('.js')).every((p) => seen.has(p.slice(2))),
      [...shell].filter((p) => p.endsWith('.js') && !seen.has(p.slice(2))).join(', '));

    // install is cache.addAll: one path that 404s and the new worker never
    // installs, with nothing said. The css, the icons and the manifest are
    // not imports, so the walk above never sees them
    const gone = [];
    for (const path of shell) {
      const r = await fetch('../' + path.slice(2), { cache: 'no-store' }).catch(() => ({ ok: false, status: 'network' }));
      if (!r.ok) gone.push(`${path} → ${r.status}`);
    }
    check('every path in the shell is really there', gone.length === 0, gone.join(', '));
  }

});
</script>
</body>
</html>
