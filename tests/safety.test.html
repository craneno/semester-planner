<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Safety tests</title>
<link rel="stylesheet" href="./tests.css">
</head>
<body>
<script type="module">
/* Written after a real loss. A schema upgrade added a field to every area, the
   sync layer hashes rows to spot changes, so every area looked freshly edited
   — and the first device to open the new build pushed its whole copy over
   everyone else's. A freewrite written on the phone was replaced by the
   laptop's empty one, and an upsert keeps no history to undo it with.

   Three things have to hold, and each is checked here:
     an upgrade must not look like an edit,
     a row must carry the time it was really edited, not the time it was sent,
     and there must be a copy on this device that no sync can reach. */
import { suite, storeWith } from './harness.js';
import { today } from '../js/util.js';

const base = (over = {}) => ({
  version: 20,
  semester: { name: 'Fall 2026', start: '2026-09-02', end: '2026-12-12' },
  areas: [], items: [], cards: [], links: [], wishlist: [], sprints: [],
  habits: [], habitLog: {}, notes: {}, ...over
});

suite('Safety — a row says when it was really edited', async ({ check }) => {
  const s = await storeWith(base({
    areas: [{
      id: 'c1', name: 'Job search', category: 'personal', order: 0,
      freewrite: 'email the distributor', schedule: [],
      createdAt: '2026-08-01T00:00:00.000Z',
      updatedAt: '2026-08-30T12:00:00.000Z'
    }],
    items: [{ id: 't1', title: 'apply', areaId: 'c1', updatedAt: '2026-08-30T12:00:00.000Z' }],
    cards: [{ id: 'k1', text: 'a card', updatedAt: '2026-08-30T12:00:00.000Z' }],
    notes: { '2026-08-30': { focus: 'f', text: '', tomorrow: '', top3: [], journal: {}, updatedAt: '2026-08-30T12:00:00.000Z' } }
  }));

  {
    // the bug that cost the freewrite: migrate() rebuilt each area and dropped
    // the stamp, so every area reached the sync layer with no clock at all
    const a = s.state.areas[0];
    check('an area keeps the time it was edited', a.updatedAt === '2026-08-30T12:00:00.000Z', String(a.updatedAt));
    check('...and the day it was made', a.createdAt === '2026-08-01T00:00:00.000Z');
    check('...and its freewrite is still there', a.freewrite === 'email the distributor');
  }

  {
    check('sync can read an area’s clock',
      s.rowStamp('area', 'c1') === '2026-08-30T12:00:00.000Z', String(s.rowStamp('area', 'c1')));
    check('...an item’s, as before', s.rowStamp('item', 't1') === '2026-08-30T12:00:00.000Z');
    check('...a card’s', s.rowStamp('card', 'k1') === '2026-08-30T12:00:00.000Z', String(s.rowStamp('card', 'k1')));
    check('...and a day’s note, by its date', s.rowStamp('note', '2026-08-30') === '2026-08-30T12:00:00.000Z',
      String(s.rowStamp('note', '2026-08-30')));
    check('...and says so plainly when there is none', s.rowStamp('area', 'nope') === null);
  }

  {
    s.upsertArea({ id: 'c1', freewrite: 'and chase the tank' });
    const after = s.rowStamp('area', 'c1');
    check('an edit moves the clock forward', after > '2026-08-30T12:00:00.000Z', String(after));
  }

  {
    // an area the user has never touched has no clock to offer, and that must
    // be an honest null rather than a made-up now
    s.state.areas.push({ id: 'c2', name: 'Rocket', category: 'project', order: 1, schedule: [] });
    check('an untouched area claims nothing', s.rowStamp('area', 'c2') == null);
  }
});

suite('Safety — did you run upgrade.sql? The server is the backstop', async ({ check, log }) => {
  /* The sync layer's own behaviour — its edit times, the read-back hash, a
     tab's save, the channel echo — is driven in sync.test.html. What the
     client cannot check by running is the database: the trigger that drops
     a stale write, the history that is the only way back from a bad sync,
     and the kinds the CHECK constraint allows. Both SQL files must say the
     same, since upgrade.sql is what an existing project runs by hand. */
  const schema = await fetch('../supabase/schema.sql').then((r) => r.text());
  const upgrade = await fetch('../supabase/upgrade.sql').then((r) => r.text());
  for (const [name, sql] of [['schema.sql', schema], ['upgrade.sql', upgrade]]) {
    check(`${name} refuses a stale write`, /planner_rows_keep_newest/.test(sql),
      'the client can be wrong; the database is the backstop');
    check(`...and still lets a delete through in ${name}`,
      /NEW\.deleted is distinct from true/.test(sql),
      'a tombstone is a real decision');
    check(`${name} keeps a history of every row`, /create table if not exists public\.planner_rows_history/.test(sql));
    check(`...filled after update or delete in ${name}`,
      /after update or delete on public\.planner_rows[\s\S]{0,80}planner_rows_keep_history/.test(sql));
    check(`...that a user can read but never write in ${name}`,
      /"planner_rows_history owner"[\s\S]{0,120}for select/.test(sql) && /security definer/.test(sql));
    check(`${name} allows the schema-20 kinds`, /'link', 'wish', 'sprint', 'habit', 'habitlog'/.test(sql),
      'a new kind needs an ALTER the user has to run');
  }
  log('The trigger is the only guard a bad build cannot get past.');
});

suite('Safety — a copy this device keeps', async ({ check }) => {
  const BAK = 'semesterPlanner.bak.';
  const clear = () => {
    for (const k of Object.keys(localStorage)) if (k.startsWith(BAK)) localStorage.removeItem(k);
  };

  {
    clear();
    // a store opened on data from an older schema
    const s = await storeWith(base({
      version: 18,
      areas: [{ id: 'c1', name: 'Job search', category: 'personal', order: 0, freewrite: 'email the distributor', schedule: [] }],
      events: [{ id: 'e1', title: 'a mirrored event', date: '2026-09-02' }]
    }));
    const kept = s.listBackups();
    check('an upgrade leaves a copy behind', kept.some((b) => b.label === 'before-v' + s.SCHEMA_VERSION),
      kept.map((b) => b.label).join() || 'none');
    check('...and a copy for the day as well', kept.some((b) => /^\d{4}-\d{2}-\d{2}$/.test(b.label)));

    const pre = JSON.parse(s.readBackup(BAK + 'before-v' + s.SCHEMA_VERSION));
    check('the copy holds the data as it was found', pre.version === 18, String(pre.version));
    check('...with the freewrite in it', pre.areas[0].freewrite === 'email the distributor');
    check('...and says when it was taken', !!pre.backedUpAt);
    check('the Google mirror is left out of it', pre.events === undefined,
      'it is most of the bytes and the next sync fetches it again');
    check('so is the outbox', pre.outbox === undefined);
  }

  {
    // the copy is taken before anything is written, so a second load on the
    // same day must not overwrite it with whatever happened since. The key
    // is BAK + today(): a marker under it is what a load would overwrite.
    clear();
    localStorage.setItem(BAK + today(), JSON.stringify({ marker: 'kept' }));
    await storeWith(base());
    check('a copy already taken is left alone',
      JSON.parse(localStorage.getItem(BAK + today()) || '{}').marker === 'kept',
      'one a day, and it is the state at the start of the day');
  }

  {
    clear();
    const s = await storeWith(base());
    check('a store on current data still keeps the day’s copy',
      s.listBackups().length === 1);
    check('...but no upgrade copy, there having been no upgrade',
      !s.listBackups().some((b) => b.label.startsWith('before-')));
  }

  {
    clear();
    for (const d of ['2026-08-25', '2026-08-26', '2026-08-27', '2026-08-28', '2026-08-29', '2026-08-30']) {
      localStorage.setItem(BAK + d, JSON.stringify({ day: d }));
    }
    const s = await storeWith(base());
    const dailies = s.listBackups().filter((b) => /^\d{4}-\d{2}-\d{2}$/.test(b.label)).map((b) => b.label);
    check('old copies are dropped rather than piling up for ever', dailies.length === 5,
      String(dailies.length));
    // six seeded and today's makes seven; the two oldest go, by name
    check('...and the newest are the ones kept',
      dailies.join() === [today(), '2026-08-30', '2026-08-29', '2026-08-28', '2026-08-27'].join(),
      dailies.join());
    clear();
  }
});

suite('Safety — each thing its own row', async ({ check }) => {
  /* These used to ride together inside `meta`: one row, no clock, and a
     clash settled by whoever pushed last — which is how a whole pile of
     links went at once. Now each is a row with a clock of its own. One
     table, every kind through the same six claims, so a kind cannot be
     forgotten the way the wishlist's tests once were. */
  const AT = '2026-09-01T00:00:00.000Z';
  const s = await storeWith({
    version: 20,
    semester: { name: 'Fall 2026', start: '2026-09-02', end: '2026-12-12' },
    areas: [], items: [], cards: [], notes: {},
    links: [{ id: 'l1', url: 'https://a.example', title: 'a', updatedAt: AT }],
    wishlist: [{ id: 'w1', title: 'boots', updatedAt: AT }],
    sprints: [{ id: 's1', title: 'push', start: '2026-09-07', end: '2026-09-20', updatedAt: AT }],
    habits: [{ id: 'h1', name: 'Sunscreen', createdAt: '2026-08-30T00:00:00.000Z' }],
    habitLog: { '2026-09-01': ['h1'] },
    habitLogAt: { '2026-09-01': '2026-09-01T09:00:00.000Z' }
  });

  // kind, the pile it left in meta, the seeded id, how the app reads one
  // back, and a row as another device would send it
  const KINDS = [
    { kind: 'link', pile: 'links', id: 'l1', find: (id) => s.linkById(id),
      inbound: { id: 'l2', url: 'https://b.example', title: 'b' } },
    { kind: 'wish', pile: 'wishlist', id: 'w1', find: (id) => s.wishById(id),
      inbound: { id: 'w2', title: 'calipers', status: 'wanted' } },
    { kind: 'sprint', pile: 'sprints', id: 's1', find: (id) => s.sprintById(id),
      inbound: { id: 's2', title: 'ship it', start: '2026-10-01', end: '2026-10-14', kind: 'sprint', deliverables: [] } },
    { kind: 'habit', pile: 'habits', id: 'h1', find: (id) => s.activeHabits().find((x) => x.id === id) || null,
      inbound: { id: 'h2', name: 'Stretch', order: 1 } },
    { kind: 'habitlog', pile: 'habitLog', id: '2026-09-01', find: (date) => (s.habitDone(date, 'h1') ? { id: date } : null),
      inbound: { ids: ['h1'], updatedAt: '2026-09-03T08:00:00.000Z' }, inboundId: '2026-09-03' }
  ];
  // what a device still on schema 19 sends: the piles inside meta, all empty
  const oldMeta = { kind: 'meta', id: 'meta', data: { semester: s.state.semester, settings: {}, habits: [], habitLog: {}, links: [], wishlist: [], sprints: [] } };

  for (const k of KINDS) {
    const row = s.snapshotRows().find((r) => r.kind === k.kind && r.id === k.id);
    check(`a ${k.kind} is a row of its own`, !!row, `${k.kind}: no row with id ${k.id}`);
    check(`...with the clock sync reads off it`, !!row && s.rowStamp(k.kind, k.id) === row.data.updatedAt,
      `${k.kind}: rowStamp ${s.rowStamp(k.kind, k.id)} vs row ${row?.data.updatedAt}`);
    const meta = s.snapshotRows().find((r) => r.kind === 'meta').data;
    check(`...and meta no longer carries the ${k.pile}`, meta[k.pile] === undefined, `${k.kind}: meta has ${k.pile}`);

    const inId = k.inboundId || k.inbound.id;
    check(`a ${k.kind} from the cloud lands where the app reads it`,
      s.applyRow({ kind: k.kind, id: inId, data: k.inbound }) === true && !!k.find(inId),
      `${k.kind}: ${inId} not found after applyRow`);
    check(`...and a tombstone takes the ${k.kind} away`,
      s.applyRow({ kind: k.kind, id: inId, deleted: true, data: {} }) === true && k.find(inId) === null,
      `${k.kind}: ${inId} still there`);
    s.applyRow(oldMeta);
    check(`an old build’s empty ${k.pile} inside meta cannot wipe the ${k.kind}`, !!k.find(k.id),
      `${k.kind}: ${k.id} gone after a schema-19 meta`);
  }

  {
    const meta = s.snapshotRows().find((r) => r.kind === 'meta').data;
    check('meta is the semester, the calendar and the settings, and nothing else',
      Object.keys(meta).sort().join() === 'calendar,semester,settings', Object.keys(meta).sort().join());
    const ticks = s.snapshotRows().find((r) => r.kind === 'habitlog' && r.id === '2026-09-01');
    check('a day of ticks is keyed by the day and carries its ids', JSON.stringify(ticks?.data.ids) === '["h1"]',
      JSON.stringify(ticks?.data));
    check('a habit with no edit yet reads its creation', s.rowStamp('habit', 'h1') === '2026-08-30T00:00:00.000Z',
      String(s.rowStamp('habit', 'h1')));
  }

  {
    // the sync clock on a day of ticks: an ISO stamp rowStamp can read, moved by the tick
    s.toggleHabit('2026-09-02', 'h1', true);
    const at = s.rowStamp('habitlog', '2026-09-02');
    check('a tick stamps its day with a clock sync can read', /^\d{4}-\d{2}-\d{2}T/.test(at) && at > '2026-09-01T09:00:00.000Z', String(at));
    s.toggleHabit('2026-09-02', 'h1', false);
    check('unticking the last one drops the day and its clock',
      !s.state.habitLog['2026-09-02'] && !s.state.habitLogAt['2026-09-02']);
    check('a day of ticks from the cloud lands with its clock',
      s.applyRow({ kind: 'habitlog', id: '2026-09-03', data: { ids: ['h1'], updatedAt: '2026-09-03T08:00:00.000Z' } })
      && s.state.habitLogAt['2026-09-03'] === '2026-09-03T08:00:00.000Z');
    check('...and an empty one clears the day', s.applyRow({ kind: 'habitlog', id: '2026-09-03', data: { ids: [] } })
      && !s.state.habitLog['2026-09-03']);
  }
});

suite('Safety — no device credential rides in any row', async ({ check }) => {
  // Google tokens, the Supabase keys and the cursors belong to the device.
  // Settings sync by list (SYNCED_SETTINGS); anything off it must stay put.
  const s = await storeWith(base({
    settings: {
      weekStart: 1, tzSeen: 'America/New_York', canvasFeedAt: '2026-09-01T00:00:00.000Z', trackingAt: '2026-09-01T00:00:00.000Z',
      gcal: { clientId: 'cid-secret', calendarId: 'primary', enabled: true, pushPlans: true, syncToken: 'tok-secret', window: null, lastSync: null },
      cloud: { url: 'https://x.supabase.co', anonKey: 'anon-secret', enabled: true, cursor: 'cur-secret', lastSync: null }
    }
  }));
  const wire = JSON.stringify(s.snapshotRows());
  for (const secret of ['cid-secret', 'tok-secret', 'x.supabase.co', 'anon-secret', 'cur-secret']) {
    check(`no row carries ${secret}`, !wire.includes(secret));
  }
  const synced = s.snapshotRows().find((r) => r.kind === 'meta').data.settings;
  const leaked = ['gcal', 'cloud', 'cursor', 'tzSeen', 'canvasFeedAt', 'trackingAt'].filter((k) => k in synced);
  check('the synced settings hold no device key', leaked.length === 0, leaked.join());
  check('...while a listed one still travels', synced.weekStart === 1, JSON.stringify(synced));
});

suite('Safety — a row that lands comes back out the same', async ({ check }) => {
  /* Two devices must agree on a row's bytes, or each push comes straight
     back: A sends, B keeps it in a different shape, B's next snapshot no
     longer matches what it received, B pushes, A keeps that in *its* shape...
     a ping-pong on every push, for ever. The hash is the JSON, so key order
     counts, and so does a field one side fills in and the other leaves out. */
  const a = await storeWith(base({
    areas: [
      {
        id: 'c1', name: 'Thermo', category: 'course', order: 0, freewrite: 'hi',
        schedule: [{ days: [1], start: '10:30', end: '11:35', tz: 'America/New_York' }]
      },
      // a course on its own days: the keys are there only when set
      { id: 'c2', name: 'Seminar', category: 'course', order: 1, from: '2026-09-14', until: '2026-10-19', schedule: [] }
    ],
    items: [
      {
        id: 'i1', areaId: 'c1', title: 'Read', type: 'task',
        plan: { date: '2026-09-03', start: '09:00', mins: 60 },
        repeat: { freq: 'weekly', ex: {} }, subtasks: [{ id: 's1', text: 'p1', done: false }]
      },
      { id: 'i2', areaId: 'c1', title: 'PS1', type: 'homework', due: '2026-09-10', dueTime: '23:59', estMins: 90 },
      // from Canvas: one moved by hand (null), one still where the import put it
      { id: 'i3', areaId: 'c1', title: 'PS2', due: '2026-09-17', canvasId: 'cv-3', canvasCourse: 'MEE2340', canvasArea: null },
      { id: 'i4', areaId: 'c1', title: 'PS3', due: '2026-09-24', canvasId: 'cv-4', canvasCourse: 'MEE2340', canvasArea: 'c1' }
    ],
    cards: [{ id: 'k1', areaId: null, text: 'a card' }],
    links: [{ id: 'l1', url: 'https://x.y/z', title: 'x', areaId: null }],
    wishlist: [{ id: 'w1', title: 'Calipers', price: 30, status: 'wanted' }],
    sprints: [{
      id: 'p1', areaId: 'c1', kind: 'sprint', title: 'Hot', start: '2026-09-07', end: '2026-09-20',
      deliverables: [{ id: 'd1', text: 'x', done: false }]
    }],
    habits: [{ id: 'h1', name: 'Steps', order: 0 }],
    habitLog: { '2026-09-01': ['h1'] },
    notes: { '2026-09-01': { focus: 'f', text: 't', tomorrow: '', top3: [], journal: { c1: 'j' } } }
  }));
  const sent = a.snapshotRows();
  const hash = (d) => JSON.stringify(d);
  const key = (r) => r.kind + ':' + r.id;
  const KINDS = ['area', 'item', 'card', 'note', 'link', 'wish', 'sprint', 'habit', 'habitlog', 'meta'];
  check('there is a row of every kind to try', KINDS.every((k) => sent.some((r) => r.kind === k)),
    KINDS.filter((k) => !sent.some((r) => r.kind === k)).join());

  // The other device takes them as they came. Same module, wiped, and a
  // copy of the rows, so nothing passes by being the very same object —
  // and one store instance fewer on a page that already has many.
  for (const k of ['areas', 'items', 'cards', 'links', 'wishlist', 'sprints', 'habits']) a.state[k].length = 0;
  for (const k of ['notes', 'habitLog', 'habitLogAt']) for (const d of Object.keys(a.state[k])) delete a.state[k][d];
  for (const r of JSON.parse(JSON.stringify(sent))) a.applyRow(r);
  const got = new Map(a.snapshotRows().map((r) => [key(r), hash(r.data)]));
  const bad = sent.filter((r) => got.get(key(r)) !== hash(r.data));
  check('every row is the same bytes on the device it lands on', bad.length === 0, bad.map(key).join());

  // ...and still after that device has been reloaded, since migrate() rebuilds every row
  const c = await storeWith(JSON.parse(JSON.stringify(a.state)));
  const again = new Map(c.snapshotRows().map((r) => [key(r), hash(r.data)]));
  const drift = sent.filter((r) => again.get(key(r)) !== hash(r.data));
  check('...and after a reload, or every restart would push the whole store', drift.length === 0,
    drift.map(key).join());

  // the keys that are only there when set: absent stays absent, null stays
  // null, set stays set — a key filled in on one side is a row that never settles
  const c1 = c.areaById('c1'), c2 = c.areaById('c2');
  check('an area with no days of its own comes back without the keys', !('from' in c1) && !('until' in c1),
    JSON.stringify([c1.from, c1.until]));
  check('...and one with them keeps them', c2.from === '2026-09-14' && c2.until === '2026-10-19',
    JSON.stringify([c2.from, c2.until]));
  const i1 = c.itemById('i1'), i3 = c.itemById('i3'), i4 = c.itemById('i4');
  check('an item never from Canvas comes back without canvasArea', !('canvasArea' in i1) && !('canvasCourse' in i1),
    JSON.stringify([i1.canvasArea, i1.canvasCourse]));
  check('one moved by hand keeps its null', 'canvasArea' in i3 && i3.canvasArea === null, JSON.stringify(i3.canvasArea));
  check('one still where the import put it keeps the area', i4.canvasArea === 'c1', JSON.stringify(i4.canvasArea));
});
</script>
</body>
</html>
