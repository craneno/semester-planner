<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Canvas tests</title>
<link rel="stylesheet" href="./tests.css">
</head>
<body>
<script type="module">
/* Two halves. The feed is text — folded lines, escaped commas, three shapes
   of date — and reading it must not depend on any state. The import is what
   writes: an assignment becomes a deadline in the right course, and bringing
   the same feed in again must refresh what Canvas owns and leave alone what a
   person set by hand. */
import { suite, sharedStoreWith } from './harness.js';

// one folded line in the first DESCRIPTION, an escaped comma, a UTC time, and
// an office-hours event that is not an assignment at all
const FEED = [
  'BEGIN:VCALENDAR',
  'VERSION:2.0',
  'PRODID:-//Instructure//Canvas//EN',
  'BEGIN:VEVENT',
  'DTSTAMP:20260901T120000Z',
  'UID:event-assignment-123456',
  'DTSTART;VALUE=DATE:20260915',
  'SUMMARY:Problem Set 3 [ME 2340 Thermodynamics]',
  'DESCRIPTION:Chapters 4-5\\, all pro',
  ' blems.\\nSubmit as PDF.',
  'URL:https://x.instructure.com/courses/1/assignments/123456',
  'END:VEVENT',
  'BEGIN:VEVENT',
  'UID:event-assignment-789',
  'DTSTART:20260920T035900Z',
  'SUMMARY:Lab report 1 [EECE 2413 Circuits Lab]',
  'END:VEVENT',
  'BEGIN:VEVENT',
  'UID:event-calendar-event-55',
  'DTSTART:20260910T140000Z',
  'DTEND:20260910T150000Z',
  'SUMMARY:Office hours [ME 2340 Thermodynamics]',
  'END:VEVENT',
  'END:VCALENDAR'
].join('\r\n');

/* Seeded before either suite starts. canvas.js imports the one store, and
   store.js reads localStorage the moment it loads — so the seed has to be in
   place before the first suite's import() of canvas.js, or the import suite
   below finds a store built from whatever the page held. */
const s = await sharedStoreWith({
  version: 20,
  semester: { name: 'Fall 2026', start: '2026-09-02', end: '2026-12-12' },
  areas: [
    { id: 'th', name: 'Thermodynamics', category: 'course', order: 0 },
    { id: 'gen', name: 'General', category: 'personal', order: 1 }
  ],
  items: [], cards: [], notes: {}
});

suite('Canvas — the feed', async ({ check }) => {
  const { parseIcs, icsWhen, splitSummary, isAssignment, matchArea } = await import('../js/canvas.js');

  {
    const evs = parseIcs(FEED);
    check('every VEVENT is read', evs.length === 3, String(evs.length));
    const ps = evs[0];
    check('a folded line is put back together, the escaped comma a comma', ps.description === 'Chapters 4-5, all problems.\nSubmit as PDF.',
      JSON.stringify(ps.description));
    check('the summary, the uid and the url come through',
      ps.summary === 'Problem Set 3 [ME 2340 Thermodynamics]' && ps.uid === 'event-assignment-123456'
      && ps.url === 'https://x.instructure.com/courses/1/assignments/123456');
  }

  {
    check('a whole day is a date with no time',
      JSON.stringify(icsWhen('20260915', { VALUE: 'DATE' })) === '{"date":"2026-09-15","time":null}');
    // UTC is turned into the clock here, whatever here is
    const local = new Date(Date.UTC(2026, 8, 20, 3, 59, 0));
    const pad = (n) => String(n).padStart(2, '0');
    const want = {
      date: `${local.getFullYear()}-${pad(local.getMonth() + 1)}-${pad(local.getDate())}`,
      time: `${pad(local.getHours())}:${pad(local.getMinutes())}`
    };
    check('a Z time becomes local wall clock', JSON.stringify(icsWhen('20260920T035900Z')) === JSON.stringify(want),
      JSON.stringify(icsWhen('20260920T035900Z')) + ' vs ' + JSON.stringify(want));
    check('a zoned wall clock is taken as read',
      JSON.stringify(icsWhen('20260920T235900', { TZID: 'America/New_York' })) === '{"date":"2026-09-20","time":"23:59"}');
    check('rubbish is null', icsWhen('next tuesday') === null);
  }

  {
    check('the course is the bracket at the end',
      JSON.stringify(splitSummary('Problem Set 3 [ME 2340 Thermodynamics]'))
      === '{"title":"Problem Set 3","course":"ME 2340 Thermodynamics"}');
    check('no bracket, no course', JSON.stringify(splitSummary('Read chapter 2')) === '{"title":"Read chapter 2","course":""}');
    check('a bracket in the middle is part of the title',
      splitSummary('Quiz [take-home] [ME 2340]').title === 'Quiz [take-home]');
    check('only a bracket, and the course is the title too',
      JSON.stringify(splitSummary('[ME 2340]')) === '{"title":"ME 2340","course":"ME 2340"}', JSON.stringify(splitSummary('[ME 2340]')));
  }

  {
    check('assignments are assignments', isAssignment({ uid: 'event-assignment-1' }));
    check('a calendar event is not', !isAssignment({ uid: 'event-calendar-event-1' }));
  }

  {
    const { inTerm } = await import('../js/canvas.js');
    check('with no term set, every date is in it', inTerm('2020-01-01', null) && inTerm('2031-12-31', {}));
  }

  {
    const areas = [
      { id: 'th', name: 'Thermodynamics' },
      { id: 'ee', name: 'Electrical Engineering' },
      { id: 'lab', name: 'EE lab' },
      { id: 'mm', name: 'Math Methods' },
      { id: 'old', name: 'Circuits Lab', archived: true }
    ];
    check('the whole area name inside the course wins', matchArea('ME 2340 Thermodynamics', areas) === 'th');
    check('longest name first, so the lab does not take the lecture',
      matchArea('EECE 2412 Electrical Engineering', areas) === 'ee');
    check('every real word of the name is enough', matchArea('MATH 2341 Methods for Math', areas) === 'mm');
    check('an archived area is not a home', matchArea('EECE 2413 Circuits Lab', areas) === null);
    check('nothing fits, nothing is guessed', matchArea('PHIL 1101 Ethics', areas) === null);
    check('an empty course is unfiled', matchArea('', areas) === null);

    // what a person taught by moving one counts first — unless that area is
    // gone, when the name decides again
    const { homeFor } = await import('../js/canvas.js');
    const moved = [{ canvasCourse: 'ME 2340 Thermodynamics', areaId: 'old', canvasArea: 'gen' }];
    check('a course whose voted home is archived falls back to the name', homeFor('ME 2340 Thermodynamics', moved, areas) === 'th',
      String(homeFor('ME 2340 Thermodynamics', moved, areas)));
  }

  {
    // a reminder block inside the event has a DESCRIPTION of its own, and one event has no SUMMARY at all
    const alarm = ['BEGIN:VCALENDAR', 'BEGIN:VEVENT', 'UID:event-assignment-al', 'DTSTART;VALUE=DATE:20260915',
      'SUMMARY:Essay [ME 2340 Thermodynamics]', 'DESCRIPTION:Two pages.',
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Reminder', 'TRIGGER:-PT15M', 'END:VALARM',
      'URL:https://x.instructure.com/courses/1/assignments/al', 'END:VEVENT',
      'BEGIN:VEVENT', 'UID:event-assignment-nameless', 'DTSTART;VALUE=DATE:20260916', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const evs = parseIcs(alarm);
    const [al, nameless] = evs;
    check('a VALARM inside the event keeps its lines to itself',
      al?.description === 'Two pages.' && al?.url === 'https://x.instructure.com/courses/1/assignments/al', JSON.stringify(al));
    check('...and the event is read to its end', evs.length === 2 && nameless?.uid === 'event-assignment-nameless', String(evs.length));
    check('no SUMMARY reads as none', nameless && nameless.summary === undefined);
  }
});

suite('Canvas — the import', async ({ check }) => {
  const { importCanvas } = await import('../js/canvas.js');

  {
    const res = importCanvas(FEED);
    check('two assignments came in', res.added === 2, JSON.stringify(res));
    check('office hours did not', res.skipped === 1 && !s.state.items.some((t) => /office/i.test(t.title)));
    const ps = s.state.items.find((t) => t.canvasId === 'event-assignment-123456');
    check('a problem set is homework due that day', ps && ps.type === 'homework' && ps.due === '2026-09-15' && ps.dueTime === null,
      JSON.stringify(ps && { type: ps.type, due: ps.due, dueTime: ps.dueTime }));
    check('...filed in Thermodynamics', ps.areaId === 'th');
    check('...named without the course', ps.title === 'Problem Set 3');
    check('...with the notes and the link', ps.notes.includes('Submit as PDF') && ps.notes.includes('instructure.com'));
    check('...and a deadline, never a block', ps.plan === null);
    const lab = s.state.items.find((t) => t.canvasId === 'event-assignment-789');
    check('a course nobody has lands in the default area, like anything with no home',
      lab && lab.areaId === 'gen', String(lab?.areaId));
    check('...and is named in the result so it can be moved', res.unfiled.length === 1 && /Lab report 1/.test(res.unfiled[0]), JSON.stringify(res.unfiled));
    // the day depends on the zone the test runs in; the hour is what matters
    check('a timed assignment keeps its hour', /^\d\d:\d\d$/.test(lab?.dueTime || ''), String(lab?.dueTime));
  }

  {
    // a person files the lab away from where the import put it, ticks the
    // problem set, writes a note — then the feed comes in again with the
    // problem set moved
    const ps = s.state.items.find((t) => t.canvasId === 'event-assignment-123456');
    const lab = s.state.items.find((t) => t.canvasId === 'event-assignment-789');
    s.upsertItem({ id: lab.id, areaId: 'th' });
    s.toggleItem(ps.id, true);
    s.upsertItem({ id: ps.id, notes: 'my own note' });
    const labStamp = s.itemById(lab.id).updatedAt;
    const moved = FEED.replace('DTSTART;VALUE=DATE:20260915', 'DTSTART;VALUE=DATE:20260917');
    const res = importCanvas(moved);
    check('the same feed again adds nothing, and touches only the row that moved', res.added === 0 && res.updated === 1, JSON.stringify(res));
    check('...and makes no copies', s.state.items.filter((t) => t.canvasId).length === 2);
    check('a moved due date lands', s.itemById(ps.id).due === '2026-09-17');
    check('the tick stays', s.itemById(ps.id).done === true);
    check('the note stays', s.itemById(ps.id).notes === 'my own note');
    check('the hand-filed area stays, marked moved', s.itemById(lab.id).areaId === 'th' && s.itemById(lab.id).canvasArea === null,
      JSON.stringify({ areaId: s.itemById(lab.id).areaId, canvasArea: s.itemById(lab.id).canvasArea }));
    check('a row nothing moved on keeps its clock', s.itemById(lab.id).updatedAt === labStamp,
      'stamped now, it would beat a real edit from another device');
  }

  {
    // Canvas renames the problem set and lists it under another course name
    const ps = s.state.items.find((t) => t.canvasId === 'event-assignment-123456');
    const renamed = FEED.replace('SUMMARY:Problem Set 3 [ME 2340 Thermodynamics]', 'SUMMARY:Problem Set 3, revised [ME 2340 Thermo II]');
    const res = importCanvas(renamed);
    check('a rename on Canvas lands', res.updated === 1 && s.itemById(ps.id).title === 'Problem Set 3, revised', s.itemById(ps.id).title);
    check('...and so does the course it is listed under', s.itemById(ps.id).canvasCourse === 'ME 2340 Thermo II', s.itemById(ps.id).canvasCourse);
    check('...the tick and the note staying', s.itemById(ps.id).done === true && s.itemById(ps.id).notes === 'my own note');
    importCanvas(FEED);   // and back, so the rest reads as before
  }

  {
    // a person drags the problem set onto the calendar; the next morning's feed must not pull it back off
    const ps = s.state.items.find((t) => t.canvasId === 'event-assignment-123456');
    s.upsertItem({ id: ps.id, plan: { date: '2026-09-16', start: '14:00', mins: 90 }, due: null, dueTime: null });
    const stamp = s.itemById(ps.id).updatedAt;
    const res = importCanvas(FEED);   // Canvas still says the 15th
    check('a block the person made keeps its plan on the next feed',
      s.itemById(ps.id).plan?.date === '2026-09-16' && s.itemById(ps.id).due === null, JSON.stringify(s.itemById(ps.id).plan));
    check('...and is neither counted as updated nor stamped again', res.updated === 0 && s.itemById(ps.id).updatedAt === stamp, JSON.stringify(res));
  }

  {
    check('an empty feed does nothing', JSON.stringify(importCanvas('')) === '{"added":0,"updated":0,"unfiled":[],"skipped":0,"cleared":0}');
    check('a feed with the same uid twice is one assignment',
      importCanvas(FEED + '\r\n' + FEED).added === 0 && s.state.items.filter((t) => t.canvasId).length === 2);
  }

  {
    // last term's course is still in the feed; its due dates are not work
    const old = ['BEGIN:VCALENDAR', 'BEGIN:VEVENT', 'UID:event-assignment-old', 'DTSTART;VALUE=DATE:20260801',
      'SUMMARY:Final reflection [ME 2340 Thermodynamics]', 'END:VEVENT', 'BEGIN:VEVENT', 'UID:event-assignment-next',
      'DTSTART;VALUE=DATE:20270115', 'SUMMARY:Reading [ME 2340 Thermodynamics]', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const res = importCanvas(old);
    check('an assignment due before the term is left alone', res.added === 0 && res.skipped === 2 && !s.state.items.some((t) => t.canvasId === 'event-assignment-old'));
    check('...and one due after it', !s.state.items.some((t) => t.canvasId === 'event-assignment-next'));
    // the slack is 14 days (TERM_SLACK): 09-02 back to 08-19, 12-12 on to 12-26
    const { inTerm } = await import('../js/canvas.js');
    check('two weeks either side is still the term, to the day', inTerm('2026-08-19') && inTerm('2026-12-26'));
    check('...and a day more is not', !inTerm('2026-08-18') && !inTerm('2026-12-27'));
  }

  {
    const bare = ['BEGIN:VCALENDAR', 'BEGIN:VEVENT', 'UID:event-assignment-bare', 'DTSTART;VALUE=DATE:20260918', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    importCanvas(bare);
    const t = s.state.items.find((t) => t.canvasId === 'event-assignment-bare');
    check('an assignment with no SUMMARY still has a name', t?.title === 'Untitled assignment', String(t?.title));
  }
});

/* A course no area is named for. What has to hold: it lands in the default
   area, unfiled, remembering the course; move one and the rest go along;
   moving one again is that one alone; the next feed files new ones from the
   course where the moved ones sit; an older import that never kept the
   course is filed on the next feed; a copy is not from Canvas. */
/* Ticked, swept at the day reset, and the feed still lists it: the next
   import made it again, unticked, every morning. What has to hold: a swept
   assignment and one deleted by hand stay gone; one still here is still
   brought up to date; a new one still comes in; the list arriving from
   another device is merged with this one, not put in its place; and a day
   long before the term drops off the list. */
suite('Canvas — cleared stays cleared', async ({ check }) => {
  const { importCanvas } = await import('../js/canvas.js');
  const { addDays, today } = await import('../js/util.js');
  const had = { items: s.state.items, cleared: s.state.settings.canvasCleared, sem: { ...s.state.semester } };
  try {
    s.state.items = [];
    delete s.state.settings.canvasCleared;
    importCanvas(FEED);
    const ps = s.state.items.find((t) => t.canvasId === 'event-assignment-123456');
    const lab = s.state.items.find((t) => t.canvasId === 'event-assignment-789');
    s.toggleItem(ps.id, true);
    const gone = s.sweepDone(addDays(today(), 1));
    check('the ticked one is swept', gone.length === 1 && !s.itemById(ps.id));
    check('...and its id kept, with its due day', s.state.settings.canvasCleared?.['event-assignment-123456'] === '2026-09-15', JSON.stringify(s.state.settings.canvasCleared));
    check('...in a setting that syncs', s.SYNCED_SETTINGS.includes('canvasCleared'));

    let res = importCanvas(FEED.replace('SUMMARY:Lab report 1', 'SUMMARY:Lab report 1, v2'));
    check('the next import does not make it again', !s.state.items.some((t) => t.canvasId === 'event-assignment-123456') && res.added === 0 && res.cleared === 1, JSON.stringify(res));
    check('...and still brings the one still here up to date', s.itemById(lab.id).title === 'Lab report 1, v2' && res.updated === 1);

    s.deleteItem(lab.id);
    res = importCanvas(FEED);
    check('one deleted by hand stays deleted too', !s.state.items.some((t) => t.canvasId) && res.cleared === 2, JSON.stringify(res));

    const fresh = FEED.replace('UID:event-assignment-789', 'UID:event-assignment-999');
    res = importCanvas(fresh);
    check('a new assignment still comes in', res.added === 1 && s.state.items.some((t) => t.canvasId === 'event-assignment-999'), JSON.stringify(res));

    // another device cleared one this device never had
    s.applyRow({ kind: 'meta', id: 'meta', data: { settings: { canvasCleared: { 'event-assignment-555': '2026-10-01' } } } });
    const list = s.state.settings.canvasCleared || {};
    check('a list from another device is merged, not put in place of this one',
      !!list['event-assignment-555'] && !!list['event-assignment-123456'] && !!list['event-assignment-789'], JSON.stringify(list));

    s.applyRow({ kind: 'meta', id: 'meta', data: { settings: { canvasCleared: { 'event-assignment-old': '2025-01-10' } } } });
    check('a day long before the term drops off', !('event-assignment-old' in s.state.settings.canvasCleared), JSON.stringify(s.state.settings.canvasCleared));

    const plain = s.upsertItem({ title: 'Not from Canvas', areaId: 'gen', due: '2026-09-15' });
    const before = JSON.stringify(s.state.settings.canvasCleared);
    s.deleteItem(plain.id);
    check('a task of your own adds nothing to the list', JSON.stringify(s.state.settings.canvasCleared) === before);
  } finally {
    s.state.items = had.items;
    if (had.cleared === undefined) delete s.state.settings.canvasCleared; else s.state.settings.canvasCleared = had.cleared;
    Object.assign(s.state.semester, had.sem);
  }
});

suite('Canvas — move one, the rest follow', async ({ check }) => {
  const { importCanvas, homeFor } = await import('../js/canvas.js');
  const COURSE = 'ME 4500 Capstone Design';
  const ev = (u, i) => ['BEGIN:VEVENT', `UID:event-assignment-${u}`, `DTSTART;VALUE=DATE:2026100${i}`, `SUMMARY:Milestone ${i} [${COURSE}]`, 'END:VEVENT'];
  const feed = ['BEGIN:VCALENDAR', ...ev('c1', 1), ...ev('c2', 2), ...ev('c3', 3), 'END:VCALENDAR'].join('\r\n');
  const by = (u) => s.state.items.find((t) => t.canvasId === 'event-assignment-' + u);

  const res = importCanvas(feed);
  check('a course no area is named for lands in the default area, unfiled',
    res.unfiled.length === 3 && ['c1', 'c2', 'c3'].every((u) => by(u)?.areaId === 'gen'), JSON.stringify(res));
  check('...remembering the course and where it was put', by('c1').canvasCourse === COURSE && by('c1').canvasArea === 'gen');
  check('...with no home yet', homeFor(COURSE) === null);

  s.upsertItem({ id: by('c1').id, areaId: 'th' });
  check('move one and the rest of the course go along', by('c2').areaId === 'th' && by('c3').areaId === 'th');
  check('...and the course has a home now', homeFor(COURSE) === 'th');
  s.upsertItem({ id: by('c3').id, areaId: 'gen' });
  check('moving one again is that one alone', by('c1').areaId === 'th' && by('c2').areaId === 'th' && by('c3').areaId === 'gen');
  check('...the home is where most of them sit', homeFor(COURSE) === 'th');

  const more = feed.replace('END:VCALENDAR', [...ev('c4', 4), 'END:VCALENDAR'].join('\r\n'));
  const r2 = importCanvas(more);
  check('the next one from that course is filed there as it comes in',
    r2.added === 1 && r2.unfiled.length === 0 && by('c4').areaId === 'th', JSON.stringify({ r2, area: by('c4')?.areaId }));
  check('...and the one moved by hand stays put, even back where the import had it', by('c3').areaId === 'gen' && by('c3').canvasArea === null);

  const old = by('c2');
  delete old.canvasCourse; delete old.canvasArea; old.areaId = 'gen';
  importCanvas(more);
  check('an older import still in the default area is filed with its course on the next feed',
    by('c2').areaId === 'th' && by('c2').canvasCourse === COURSE && by('c2').canvasArea === 'th');

  const dup = s.duplicateItem(by('c1').id);
  check('a copy is not from Canvas', !!dup && !dup.canvasId && !dup.canvasCourse && !dup.canvasArea);
  for (const t of s.state.items.filter((t) => t.canvasCourse === COURSE || t.id === dup.id)) s.deleteItem(t.id);
});

/* The feed fetched for you. What has to hold: only a Canvas link is worth
   saving; the fetch goes once a day per device and not again within it; a
   failure leaves no stamp, so the next open tries again; no link saved is
   nothing to do, but the day is stamped; signed out, nothing goes out; and
   what came in is not an undo step. */
suite('Canvas — by itself, once a day', async ({ check }) => {
  const { refreshIfDue, refreshFeed, feedDue, isFeedUrl, FEED_EVERY } = await import('../js/canvas.js');
  const C = await import('../js/cloud.js');

  check('a feed link is https on a Canvas host',
    isFeedUrl('https://northeastern.instructure.com/feeds/calendars/user_abc.ics') && isFeedUrl('https://canvas.school.edu/feeds/x.ics')
    && isFeedUrl('https://x.canvas.school.edu/feeds/x.ics'));
  check('...and nothing else', !isFeedUrl('http://northeastern.instructure.com/x.ics') && !isFeedUrl('https://evil.com/?instructure.com')
    && !isFeedUrl('https://instructure.com.evil.com/x') && !isFeedUrl('javascript:alert(1)') && !isFeedUrl(''));
  // `canvas.` in front of any name once let any site in
  check('a canvas label outside a school domain is not Canvas',
    !isFeedUrl('https://canvas.evil.com/feeds/x.ics') && !isFeedUrl('https://x.canvas.evil.com/x.ics')
    && !isFeedUrl('https://canvas.edu/x.ics') && !isFeedUrl('https://canvas.school.edu.evil.com/x.ics'));
  check('the day stamp stays on the device', !s.SYNCED_SETTINGS.includes('canvasFeedAt'), 'each device fetches for itself');

  for (const t of s.state.items.filter((t) => t.canvasId)) s.deleteItem(t.id);
  // a delete now keeps the assignment out of the next import; this suite
  // wants a clean slate, so the list goes too
  delete s.state.settings.canvasCleared;
  s.commit(() => { s.state.settings.canvasFeedAt = ''; });
  let calls = 0;
  const fetch = async () => { calls++; return FEED; };
  const t0 = Date.parse('2026-09-03T12:00:00Z');

  check('signed out, nothing goes out', (await refreshIfDue({ fetch, now: t0 })) === null && calls === 0);

  C._setClient({}, { userId: 'u-canvas', email: 't@x' });
  check('due when never fetched', feedDue(t0));
  const res = await refreshIfDue({ fetch, now: t0 });
  check('signed in and due, it fetches and brings the feed in', calls === 1 && res?.added === 2, JSON.stringify(res));
  check('...and stamps the time', s.state.settings.canvasFeedAt === new Date(t0).toISOString());
  check('an hour later it does nothing', (await refreshIfDue({ fetch, now: t0 + 3600e3 })) === null && calls === 1);
  check('a day later it goes again, and the same feed changes nothing',
    (await refreshIfDue({ fetch, now: t0 + FEED_EVERY }))?.updated === 0 && calls === 2);

  s.commit(() => { s.state.settings.canvasFeedAt = ''; });
  const bad = async () => { throw new Error('502'); };
  check('a failure is swallowed and leaves no stamp, so the next open tries again',
    (await refreshIfDue({ fetch: bad, now: t0 })) === null && s.state.settings.canvasFeedAt === '');
  const none = async () => null;
  check('no link saved is nothing to bring in, but the day is stamped',
    (await refreshIfDue({ fetch: none, now: t0 })) === null && s.state.settings.canvasFeedAt !== '');

  // a settings-only commit is no undo step any more, so the step this check
  // needs comes from a note; the feed stamp is reset in the same commit
  s.commit(() => { s.state.settings.canvasFeedAt = ''; s.state.notes['2026-01-05'] = { focus: 'undo me' }; });
  const hadUndo = s.canUndo();   // the commit above is a step of its own
  let src = null;
  const off = s.subscribe((m) => { src = m?.source; });
  const [a, b] = await Promise.all([refreshFeed({ fetch, now: t0 }), refreshFeed({ fetch, now: t0 })]);
  off();
  check('what came in tells the page as canvas, in one commit', src === 'canvas');
  check('...and is not an undo step: it clears the stack', hadUndo && !s.canUndo(),
    `(could undo before: ${hadUndo}) — undoing an import the app made by itself would only come back tomorrow`);
  check('two asks at once are one fetch', a === b && calls === 3);
  // The empty client is never asked anything: cloud sync is off in this
  // seed, so no sync runs, and refreshIfDue only reads isSignedIn(). Putting
  // userId back leaves cloud.js signed out, as it was found.
  C.cloud.userId = null;
});

/* A calendar file becomes blocks. What has to hold: a timed event is a
   scheduled block of its length, a whole-day one an all-day plan, a weekly
   rule a weekly repeat on its days until its UNTIL; brought in twice, the
   second time brings the same events up to date rather than making them
   again; and the one with no start is left out. */
suite('Calendar file — .ics to blocks', async ({ check }) => {
  const I = await import('../js/icsimport.js');
  const { parseIcs } = await import('../js/canvas.js');
  const ICS = [
    'BEGIN:VCALENDAR',
    'BEGIN:VEVENT', 'UID:one@x', 'SUMMARY:Lab safety', 'LOCATION:Snell 108',
    'DTSTART;TZID=America/New_York:20260915T140000', 'DTEND;TZID=America/New_York:20260915T153000', 'END:VEVENT',
    'BEGIN:VEVENT', 'UID:two@x', 'SUMMARY:Club night', 'DTSTART;VALUE=DATE:20260918', 'DTEND;VALUE=DATE:20260919', 'END:VEVENT',
    'BEGIN:VEVENT', 'UID:three@x', 'SUMMARY:Standup', 'DTSTART;TZID=America/New_York:20260914T090000', 'DTEND;TZID=America/New_York:20260914T091500',
    'RRULE:FREQ=WEEKLY;BYDAY=MO,WE;UNTIL=20261211T000000Z', 'END:VEVENT',
    'BEGIN:VEVENT', 'UID:four@x', 'SUMMARY:No when', 'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
  const rows = I.planIcs(parseIcs(ICS));
  check('three events with a start, one without left out', rows.length === 3, String(rows.length));
  const lab = rows.find((r) => r.uid === 'one@x'), club = rows.find((r) => r.uid === 'two@x'), stand = rows.find((r) => r.uid === 'three@x');
  check('a timed event is a scheduled block of its length', lab.plan.date === '2026-09-15' && lab.plan.start === '14:00' && lab.plan.mins === 90, JSON.stringify(lab.plan));
  check('...with its room', lab.location === 'Snell 108');
  check('a whole-day event is an all-day plan', club.plan.date === '2026-09-18' && !club.plan.start, JSON.stringify(club.plan));
  check('a weekly rule is a weekly repeat on its days', stand.repeat?.freq === 'weekly' && stand.repeat.days.join() === '1,3', JSON.stringify(stand.repeat));
  {
    // UNTIL=20261211T000000Z is an instant, some hour of the 10th or the 11th
    // here; the 09:00 standup on that day is in only if it starts by then
    const { ymd, addDays } = await import('../js/util.js');
    const u = new Date(Date.UTC(2026, 11, 11, 0, 0, 0));
    const uTime = `${String(u.getHours()).padStart(2, '0')}:${String(u.getMinutes()).padStart(2, '0')}`;
    const want = '09:00' > uTime ? addDays(ymd(u), -1) : ymd(u);
    check('...until the last day here its UNTIL reaches', stand.repeat.until === want, `${stand.repeat.until} vs ${want}`);
  }
  check('a rule this planner cannot say is no rule', I.repeatFromRrule('FREQ=HOURLY') === null);
  check('COUNT is kept when there is no UNTIL', I.repeatFromRrule('FREQ=DAILY;COUNT=5').count === 5);

  const before = s.state.items.length;
  try {
    let res;
    s.commit(() => { res = I.applyIcs(rows, 'gen'); });
    check('brought in: three made, in the area asked for', res.made === 3 && res.updated === 0 && s.state.items.filter((t) => t.icsUid).every((t) => t.areaId === 'gen'), JSON.stringify(res));
    const made = s.state.items.find((t) => t.icsUid === 'one@x');
    check('...as events, the room in the notes', made.type === 'event' && made.notes === 'Snell 108');
    // moved by hand, then the file comes in again with a new time
    s.commit(() => { s.upsertItem({ id: made.id, areaId: 'th' }); });
    const again = I.planIcs(parseIcs(ICS.replace('20260915T140000', '20260915T150000')));
    s.commit(() => { res = I.applyIcs(again, 'gen'); });
    check('again: nothing made twice, all brought up to date', res.made === 0 && res.updated === 3, JSON.stringify(res));
    check('...the new time taken, the area you moved it to kept', made.plan.start === '15:00' && made.areaId === 'th', `${made.plan.start} ${made.areaId}`);
  } finally {
    s.commit(() => { for (const t of s.state.items.filter((t) => t.icsUid)) s.deleteItem(t.id); });
    check('put back', s.state.items.length === before);
  }
});

/* The harder shapes of a calendar file. What has to hold: a colon inside a
   quoted parameter is not where the value starts; a rule's weekdays and its
   UNTIL move with a UTC start the way the start does; a day of a series with
   its own RECURRENCE-ID is an exception on the series, never the series; an
   EXDATE is a day skipped; a moved day whose series came in earlier joins
   it; and a tick made here outlives the file coming in again. */
suite('Calendar file — zones, moved days and skipped ones', async ({ check }) => {
  const I = await import('../js/icsimport.js');
  const { parseIcs, splitLine } = await import('../js/canvas.js');
  const { isRepeatDate } = await import('../js/repeat.js');
  const { ymd, addDays } = await import('../js/util.js');
  const hm = (d) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

  {
    // the Week asks on every draw, into the same #view: one drop was one
    // dialog per draw
    const host = document.createElement('div');
    let wired = 0;
    const add = host.addEventListener.bind(host);
    host.addEventListener = (...a) => { wired++; add(...a); };
    for (let i = 0; i < 5; i++) I.acceptIcsDrop(host, { navigate: () => {} });
    check('a drop target is wired once, however often it is asked', wired === 2, String(wired));
  }

  {
    const cut = splitLine('DTSTART;TZID="(UTC-05:00) Eastern Time (US & Canada)":20260915T140000');
    check('a colon inside a quoted parameter is not the value', cut?.value === '20260915T140000', JSON.stringify(cut));
    check('...and the parameter comes back without its quotes', cut?.params.TZID === '(UTC-05:00) Eastern Time (US & Canada)');
    const evs = parseIcs(['BEGIN:VCALENDAR', 'BEGIN:VEVENT', 'UID:q@x', 'SUMMARY:Seminar',
      'DTSTART;TZID="(UTC-05:00) Eastern Time (US & Canada)":20260915T140000',
      'DTEND;TZID="(UTC-05:00) Eastern Time (US & Canada)":20260915T150000', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n'));
    check('...so an Outlook event with one is read, not dropped',
      evs.length === 1 && evs[0].start?.date === '2026-09-15' && evs[0].start?.time === '14:00' && evs[0].end?.time === '15:00',
      JSON.stringify(evs[0]));
  }

  {
    // a Monday 21:30 class in New York, written as Tuesday 01:30Z
    const inst = new Date(Date.UTC(2026, 8, 15, 1, 30));
    const [row] = I.planIcs(parseIcs(['BEGIN:VCALENDAR', 'BEGIN:VEVENT', 'UID:ny@x', 'SUMMARY:Night class',
      'DTSTART:20260915T013000Z', 'DTEND:20260915T024500Z', 'RRULE:FREQ=WEEKLY;BYDAY=TU;UNTIL=20261212T045959Z',
      'END:VEVENT', 'END:VCALENDAR'].join('\r\n')));
    check('the rule’s weekday moves with the start', row.repeat.days.join() === String(inst.getDay()),
      `${row.repeat.days} vs ${inst.getDay()}`);
    check('...so the first day is one the rule gives', isRepeatDate(row.repeat, row.plan.date, row.plan.date));
    const u = new Date(Date.UTC(2026, 11, 12, 4, 59, 59));
    const want = hm(inst) > hm(u) ? addDays(ymd(u), -1) : ymd(u);
    check('a UTC UNTIL is the last day here it reaches', row.repeat.until === want, `${row.repeat.until} vs ${want}`);
  }

  const LECTURE = [
    'BEGIN:VCALENDAR',
    'BEGIN:VEVENT', 'UID:lec@x', 'SUMMARY:Lecture',
    'DTSTART;TZID=America/New_York:20260914T100000', 'DTEND;TZID=America/New_York:20260914T110000',
    'RRULE:FREQ=WEEKLY;BYDAY=MO;COUNT=10',
    'EXDATE;TZID=America/New_York:20260921T100000,20260928T100000', 'END:VEVENT',
    // moved a day and a room, after the series in the file
    'BEGIN:VEVENT', 'UID:lec@x', 'RECURRENCE-ID;TZID=America/New_York:20261005T100000', 'SUMMARY:Lecture (room change)',
    'DTSTART;TZID=America/New_York:20261006T140000', 'DTEND;TZID=America/New_York:20261006T153000', 'END:VEVENT',
    'BEGIN:VEVENT', 'UID:lec@x', 'RECURRENCE-ID;TZID=America/New_York:20261012T100000', 'STATUS:CANCELLED',
    'DTSTART;TZID=America/New_York:20261012T100000', 'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');

  const rows = I.planIcs(parseIcs(LECTURE));
  const lec = rows[0];
  check('a series and its moved days are one row', rows.length === 1 && lec.uid === 'lec@x', JSON.stringify(rows.map((r) => r.uid)));
  check('...the series itself, not the last moved day', lec.title === 'Lecture' && lec.plan.date === '2026-09-14' && lec.plan.start === '10:00');
  check('EXDATE days are skipped, the way a deleted occurrence is',
    lec.repeat.ex?.['2026-09-21']?.off === true && lec.repeat.ex?.['2026-09-28']?.off === true, JSON.stringify(lec.repeat.ex));
  const mv = lec.repeat.ex?.['2026-10-05'];
  check('a moved day is an exception on its own day of the rule',
    mv?.date === '2026-10-06' && mv?.start === '14:00' && mv?.mins === 90 && mv?.title === 'Lecture (room change)', JSON.stringify(mv));
  check('a cancelled one is off', lec.repeat.ex?.['2026-10-12']?.off === true);

  const before = s.state.items.length;
  try {
    let res;
    s.commit(() => { res = I.applyIcs(rows, 'gen'); });
    const series = s.state.items.find((t) => t.icsUid === 'lec@x');
    const on = (d) => s.itemsPlannedOn(d).filter((t) => t.seriesId === series.id);
    check('brought in: one series', res.made === 1 && s.state.items.filter((t) => t.icsUid).length === 1, JSON.stringify(res));
    check('...on its first Monday', on('2026-09-14').length === 1);
    check('...not on a day skipped', on('2026-09-21').length === 0 && on('2026-09-28').length === 0);
    check('...the moved one on the day it moved to, at its new time', on('2026-10-05').length === 0
      && on('2026-10-06')[0]?.plan.start === '14:00' && on('2026-10-06')[0]?.title === 'Lecture (room change)');
    check('...and the cancelled one gone', on('2026-10-12').length === 0);

    // only the moved day, in a file of its own: the series here takes it
    const alone = I.planIcs(parseIcs(['BEGIN:VCALENDAR', 'BEGIN:VEVENT', 'UID:lec@x',
      'RECURRENCE-ID;TZID=America/New_York:20261019T100000', 'SUMMARY:Lecture',
      'DTSTART;TZID=America/New_York:20261020T100000', 'DTEND;TZID=America/New_York:20261020T110000',
      'END:VEVENT', 'END:VCALENDAR'].join('\r\n')));
    s.commit(() => { res = I.applyIcs(alone, 'gen'); });
    check('a moved day on its own never takes the series’ place',
      res.made === 0 && s.state.items.filter((t) => t.icsUid).length === 1 && series.repeat.freq === 'weekly'
      && series.plan.date === '2026-09-14', JSON.stringify(res));
    check('...it joins the series as an exception', series.repeat.ex?.['2026-10-19']?.date === '2026-10-20'
      && on('2026-10-20').length === 1 && on('2026-10-19').length === 0, JSON.stringify(series.repeat.ex));

    // ticked here, then the file again: the tick stays
    s.commit(() => s.toggleItem(`${series.id}@2026-09-14`, true));
    s.commit(() => { res = I.applyIcs(I.planIcs(parseIcs(LECTURE)), 'gen'); });
    check('the file again brings the series up to date, not a copy', res.made === 0 && res.updated === 1);
    check('...and a day ticked here stays ticked', s.itemById(`${series.id}@2026-09-14`)?.done === true);
    check('...the skipped days still skipped', on('2026-09-21').length === 0);
  } finally {
    s.commit(() => { for (const t of s.state.items.filter((t) => t.icsUid)) s.deleteItem(t.id); });
    check('put back', s.state.items.length === before);
  }
});

/* Dates off a syllabus. What has to hold: a day not on the calendar is not
   offered — Feb 30, a month 15 — and a first number that cannot be a month
   is the day. */
suite('Syllabus — only real days', async ({ check }) => {
  const { detect, realDate } = await import('../js/syllabus.js');
  check('a real day is itself', realDate(2026, 10, 15) === '2026-10-15');
  check('Feb 30 is no day', realDate(2026, 2, 30) === null);
  check('Feb 29 only in a leap year', realDate(2028, 2, 29) === '2028-02-29' && realDate(2026, 2, 29) === null);
  check('a month 15 is no month', realDate(2026, 15, 10) === null);
  const found = detect([
    'HW 3 due 10/15',
    'Essay due 15/10',
    'Quiz Feb 30',
    'Lab report due 13/13'
  ].join('\n'), { yearHint: 2026 });
  const by = (t) => found.find((f) => f.title.startsWith(t));
  check('month first, as written', by('HW 3')?.due === '2026-10-15', JSON.stringify(found));
  check('a first number past 12 is the day', by('Essay')?.due === '2026-10-15', JSON.stringify(found));
  check('Feb 30 is not offered', !by('Quiz'));
  check('nor a day with no month in it', !by('Lab report'));
});
</script>
