<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Habit tests</title>
<link rel="stylesheet" href="./tests.css">
</head>
<body>
<script type="module">
import { suite, storeWith } from './harness.js';

const base = (over = {}) => ({
  version: 10,
  semester: { name: 'Fall 2026', start: '2026-08-01', end: '2026-12-12' },
  areas: [], items: [], cards: [], notes: {},
  habits: [], habitLog: {},
  ...over
});

/* Each seed is pinned to the version that added it, so a habit deleted on
   purpose does not come back at the next bump. */
suite('Habits — the seed', async ({ check }) => {
  {
    const s = await storeWith({ version: 8, areas: [], items: [] });
    const names = s.activeHabits().map((x) => x.name);
    check('a fresh upgrade seeds every starting habit, in the order given',
      names.join(' | ') === 'No phone — morning | No phone — eating | No phone — night | 10k steps or workout | Out of bed by 9:00 | Sunscreen',
      names.join(' | '));
  }
  {
    // already on 9 with the first five: only the one 10 adds should appear
    const s = await storeWith(base({
      version: 9,
      habits: ['No phone — morning', '10k steps or workout'].map((name, i) => ({ id: 'h' + i, name, order: i }))
    }));
    check('a later bump adds only its own habit',
      s.activeHabits().map((x) => x.name).join(' | ') === 'No phone — morning | 10k steps or workout | Sunscreen',
      s.activeHabits().map((x) => x.name).join(' | '));
  }
  {
    const s = await storeWith(base({ version: 10, habits: [] }));
    check('no seed once already on 10', s.activeHabits().length === 0,
      'a habit deleted on purpose must not come back at the next bump');
  }
});

suite('Habits — ticking and streaks', async ({ check }) => {

  /* ---- ticking ---- */

  {
    const s = await storeWith(base({ habits: [{ id: 'h1', name: 'Steps', order: 0 }] }));
    check('a day starts unticked', s.habitDone('2026-08-26', 'h1') === false);
    check('toggling reports the new state', s.toggleHabit('2026-08-26', 'h1') === true);
    check('...and it sticks', s.habitDone('2026-08-26', 'h1') === true);
    check('toggling again clears it', s.toggleHabit('2026-08-26', 'h1') === false);
    check('an empty day leaves no entry behind',
      s.state.habitLog['2026-08-26'] === undefined,
      'unticked days should not accumulate as empty arrays');

    s.toggleHabit('2026-08-26', 'h1', true);
    s.toggleHabit('2026-08-26', 'h1', true);
    check('forcing on twice does not duplicate',
      s.state.habitLog['2026-08-26'].length === 1);
    check('one day does not tick another', s.habitDone('2026-08-27', 'h1') === false);
  }

  /* ---- streaks ---- */

  {
    const s = await storeWith(base({ habits: [{ id: 'h1', name: 'Steps', order: 0 }] }));
    const ref = '2026-08-29';
    const on = (d) => s.toggleHabit(d, 'h1', true);

    check('no ticks means no streak', s.habitStreak('h1', ref) === 0);

    on('2026-08-29');
    check('today alone is a streak of one', s.habitStreak('h1', ref) === 1);

    on('2026-08-28'); on('2026-08-27');
    check('consecutive days accumulate', s.habitStreak('h1', ref) === 3, String(s.habitStreak('h1', ref)));

    on('2026-08-25');   // a gap on the 26th
    check('a gap stops the count', s.habitStreak('h1', ref) === 3, String(s.habitStreak('h1', ref)));
  }
  {
    // the day is not over: an untouched today must not wipe out yesterday's run
    const s = await storeWith(base({ habits: [{ id: 'h1', name: 'Steps', order: 0 }] }));
    s.toggleHabit('2026-08-28', 'h1', true);
    s.toggleHabit('2026-08-27', 'h1', true);
    check('today being untouched does not break the streak',
      s.habitStreak('h1', '2026-08-29') === 2, String(s.habitStreak('h1', '2026-08-29')));
    check('...but yesterday untouched as well is no streak at all',
      s.habitStreak('h1', '2026-08-30') === 0, String(s.habitStreak('h1', '2026-08-30')));
  }

  /* ---- the 21-day countdown ---- */

  {
    const s = await storeWith(base({ habits: [{ id: 'h1', name: 'Steps', order: 0 }] }));
    const ref = '2026-08-29';
    const back = (n) => new Date(Date.UTC(2026, 7, 29) - n * 86400000).toISOString().slice(0, 10);

    check('a habit with no run has the whole way to go',
      s.habitRemaining('h1', ref) === 21, String(s.habitRemaining('h1', ref)));

    for (let i = 0; i < 3; i++) s.toggleHabit(back(i), 'h1', true);
    check('the countdown follows the streak',
      s.habitRemaining('h1', ref) === 18, String(s.habitRemaining('h1', ref)));

    for (let i = 3; i < 21; i++) s.toggleHabit(back(i), 'h1', true);
    check('reaching the target leaves nothing to go',
      s.habitRemaining('h1', ref) === 0, String(s.habitRemaining('h1', ref)));

    for (let i = 21; i < 30; i++) s.toggleHabit(back(i), 'h1', true);
    check('a longer run does not go negative',
      s.habitStreak('h1', ref) === 30 && s.habitRemaining('h1', ref) === 0,
      `streak ${s.habitStreak('h1', ref)}, remaining ${s.habitRemaining('h1', ref)}`);
  }
});

suite('Habits — editing, and the rows they sync as', async ({ check }) => {

  /* ---- editing ---- */

  {
    const s = await storeWith(base());
    const made = s.addHabit('  Read 20 pages  ');
    check('a new habit is trimmed', made.name === 'Read 20 pages');
    check('...and goes last', s.addHabit('Later').order > made.order);
    s.updateHabit(made.id, { name: 'Read 30 pages' });
    check('a habit can be renamed', s.activeHabits()[0].name === 'Read 30 pages');

    s.toggleHabit('2026-08-28', made.id, true);
    s.toggleHabit('2026-08-28', 'other', true);
    s.deleteHabit(made.id);
    check('deleting removes the habit', !s.activeHabits().some((x) => x.id === made.id));
    check('...and every tick it had',
      !(s.state.habitLog['2026-08-28'] || []).includes(made.id));
    check('...without touching another habit’s day',
      (s.state.habitLog['2026-08-28'] || []).includes('other'));
  }
  {
    // a habit's ticks are spread over the term, a row a day, and every one
    // of them has to go with it
    const s = await storeWith(base({
      habits: [{ id: 'h1', name: 'Steps', order: 0 }, { id: 'h2', name: 'Read', order: 1 }]
    }));
    for (const d of ['2026-08-20', '2026-08-21', '2026-08-22']) s.toggleHabit(d, 'h1', true);
    s.toggleHabit('2026-08-21', 'h2', true);
    s.deleteHabit('h1');
    check('deleting takes its ticks off every day, not only one',
      !Object.values(s.state.habitLog).some((l) => l.includes('h1')), JSON.stringify(s.state.habitLog));
    check('...and a day left empty loses its clock too',
      s.state.habitLogAt['2026-08-20'] === undefined && !!s.state.habitLogAt['2026-08-21'],
      'an empty day is no row, so it needs no stamp; a day still holding another habit keeps one');
  }
  {
    const s = await storeWith(base({
      habits: [
        { id: 'h1', name: 'A', order: 0 }, { id: 'h2', name: 'B', order: 1 }, { id: 'h3', name: 'C', order: 2 }
      ]
    }));
    s.reorderHabits(['h3', 'h1', 'h2']);
    check('habits can be reordered', s.activeHabits().map((x) => x.name).join() === 'C,A,B');
    check('archived habits drop out of the list',
      (s.updateHabit('h1', { archived: true }), s.activeHabits().map((x) => x.name).join()) === 'C,B');

    // archiving hides the row; it does not forget the history
    s.toggleHabit('2026-08-28', 'h1', true);
    check('an archived habit still answers for its ticks', s.habitDone('2026-08-28', 'h1') === true);
    check('...and for its streak', s.habitStreak('h1', '2026-08-28') === 1, String(s.habitStreak('h1', '2026-08-28')));
  }

  /* ---- a day of ticks is a row, since schema 20 ----
     The log used to ride inside `meta`: one row, no clock, and two devices
     ticking the same day fought over the whole map. Each day's ticks are a
     row keyed by the day now, like a note. What reaches another device is
     checked with every other row kind, in safety.test.html. */

  {
    const s = await storeWith(base({ habits: [{ id: 'h1', name: 'Steps', order: 0 }] }));
    s.toggleHabit('2026-08-28', 'h1', true);
    const day = s.snapshotRows().find((r) => r.kind === 'habitlog');
    check('a day of ticks is a row keyed by the day', day && day.id === '2026-08-28' && day.data.ids.join() === 'h1');
    check('...stamped when it was ticked', !!day.data.updatedAt && s.rowStamp('habitlog', '2026-08-28') === day.data.updatedAt);
    s.toggleHabit('2026-08-28', 'h1', false);
    check('an empty day is no row at all', !s.snapshotRows().some((r) => r.kind === 'habitlog'));
  }
});
</script>
</body>
</html>
