<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Undo tests</title>
<link rel="stylesheet" href="./tests.css">
</head>
<body>
<script type="module">
/* One undo for everything, in the store. What has to hold: a step goes back
   and forward; a burst of commits is one step; a row put back carries the
   clock now, or the server refuses it as stale and the next sync undoes the
   undo; and a change from outside clears the stack, since replaying history
   over the world as it is now would lose someone else's edit. */
import { suite, storeWith } from './harness.js';

const base = () => ({
  version: 20,
  semester: { name: 'Fall 2026', start: '2026-09-02', end: '2026-12-12' },
  areas: [{ id: 'a1', name: 'Thermo', category: 'course', order: 0 }],
  items: [], cards: [], links: [], wishlist: [], sprints: [], habits: [], habitLog: {}, notes: {}
});

const tick = (ms) => new Promise((r) => setTimeout(r, ms));

suite('Undo — back and forward', async ({ check }) => {
  const s = await storeWith(base());
  s.undoSettings.coalesceMs = 0;   // every commit its own step, for the test's sake

  check('nothing to undo on a fresh store', s.canUndo() === false && s.undo() === null);

  s.commit(() => s.upsertItem({ id: 'u1', title: 'Read chapter 3' }), { label: 'add a task' });
  check('a commit can be undone', s.canUndo() === true);
  check('undo says what it undid', s.undo() === 'add a task');
  check('...and the task is gone', s.itemById('u1') === null);
  check('...and can be redone', s.canRedo() === true && s.redo() === 'add a task' && s.itemById('u1')?.title === 'Read chapter 3');

  s.commit(() => { s.itemById('u1').title = 'Read chapter 4'; });
  s.commit(() => { s.itemById('u1').title = 'Read chapter 5'; });
  check('an unlabelled commit is undone as "the last change"', s.undo() === 'the last change');
  check('one step back is one commit', s.itemById('u1').title === 'Read chapter 4');
  s.undo();
  check('...and another is the one before', s.itemById('u1').title === 'Read chapter 3');
  s.commit(() => { s.itemById('u1').title = 'Something new'; });
  check('a new edit after an undo drops the redo', s.canRedo() === false);
});

suite('Undo — the stack is only so deep', async ({ check }) => {
  const s = await storeWith(base());
  s.undoSettings.coalesceMs = 0;
  const max = s.undoSettings.max;
  // one commit more than the stack holds: the oldest step, the add, falls off
  s.commit(() => s.upsertItem({ id: 'd1', title: 'v0' }));
  for (let i = 1; i <= max; i++) s.commit(() => { s.itemById('d1').title = `v${i}`; });
  let n = 0;
  while (s.canUndo() && n < max + 5) { s.undo(); n++; }
  check(`only ${max} steps go back`, n === max, `${n} undos`);
  check('the oldest step fell off, so the first edit stands', s.itemById('d1')?.title === 'v0',
    String(s.itemById('d1')?.title));
});

suite('Undo — a burst is one step', async ({ check }) => {
  const s = await storeWith(base());
  s.undoSettings.coalesceMs = 300;
  s.commit(() => s.upsertItem({ id: 'b1', title: 'a' }));
  s.commit(() => { s.itemById('b1').title = 'ab'; });
  s.commit(() => { s.itemById('b1').title = 'abc'; });
  await tick(350);
  s.commit(() => { s.itemById('b1').title = 'abcd'; });
  s.undo();
  check('the last commit, alone after a pause, is its own step', s.itemById('b1')?.title === 'abc');
  s.undo();
  check('the three typed close together go as one', s.itemById('b1') === null);
});

suite('Undo — a row put back is stamped now', async ({ check }) => {
  const s = await storeWith(base());
  s.undoSettings.coalesceMs = 0;
  s.commit(() => s.upsertItem({ id: 'r1', title: 'kept' }));
  s.commit(() => { s.itemById('r1').updatedAt = '2026-01-01T00:00:00.000Z'; });
  s.commit(() => s.deleteItem('r1'));
  const beforeRow = new Date().toISOString();
  s.undo();
  const back = s.itemById('r1');
  check('the row is back', !!back && back.title === 'kept', 'it was deleted in the commit being undone');
  check('...with the clock now, not the one it had', back.updatedAt >= beforeRow, `${back.updatedAt} vs ${beforeRow}`);
  check('sync will read that clock', s.rowStamp('item', 'r1') === back.updatedAt);

  s.commit(() => s.toggleHabit('2026-09-01', 'h1', true));
  s.commit(() => { s.state.habitLogAt['2026-09-01'] = '2026-01-01T00:00:00.000Z'; });
  s.commit(() => s.toggleHabit('2026-09-01', 'h1', false));
  const beforeTicks = new Date().toISOString();
  s.undo();
  check('a day of ticks put back gets its clock too',
    s.habitDone('2026-09-01', 'h1') && s.state.habitLogAt['2026-09-01'] >= beforeTicks,
    `${s.state.habitLogAt['2026-09-01']} vs ${beforeTicks}`);

  // a note is a row too: put back with its old clock, an older copy elsewhere would beat it
  s.commit(() => s.setJournalEntry('a1', '2026-09-02', 'first draft'));
  s.commit(() => { s.state.notes['2026-09-02'].updatedAt = '2026-01-01T00:00:00.000Z'; });
  s.commit(() => s.setJournalEntry('a1', '2026-09-02', 'second draft'));
  const beforeNote = new Date().toISOString();
  s.undo();
  check('a note put back is stamped now',
    s.journalEntry('a1', '2026-09-02') === 'first draft' && s.state.notes['2026-09-02'].updatedAt >= beforeNote,
    `${s.journalEntry('a1', '2026-09-02')} at ${s.state.notes['2026-09-02'].updatedAt}`);
});

suite('Undo — the world moving clears it', async ({ check }) => {
  const s = await storeWith(base());
  s.undoSettings.coalesceMs = 0;
  s.commit(() => s.upsertItem({ id: 'c1', title: 'mine' }));
  s.commit(null, { source: 'cloud' });
  check('a change from the cloud clears the stack', s.canUndo() === false, 'replaying history over it would lose the other device’s edit');
  s.commit(() => s.upsertItem({ id: 'c1b', title: 'mine again' }));
  s.commit(null, { source: 'gcal' });
  check('so does one from Google', s.canUndo() === false);
  // the storage listener tells subscribers { external: true }; commit() takes the same flag
  s.commit(() => s.upsertItem({ id: 'c1c', title: 'and again' }));
  s.commit(null, { external: true });
  check('and a save seen from another tab', s.canUndo() === false);

  s.commit(() => s.upsertItem({ id: 'c2', title: 'mine too' }));
  let seen = null;
  const off = s.subscribe((meta) => { seen = meta?.source; });
  s.undo();
  off();
  check('an undo tells the page with a source of its own', seen === 'undo');
  check('...and is not itself remembered as a step', s.canUndo() === false && s.canRedo() === true);
  s.redo();
  check('...nor a redo', s.canRedo() === false && s.itemById('c2')?.title === 'mine too');
});

/* A commit may say which keys it touches, and then only those are copied:
   a keystroke in a note need not clone every task. What has to hold: the
   undo still puts the touched key back; a key left out is left alone; a
   later commit in the same step adds its keys to the copy the step began
   with; and a commit that says nothing still copies everything. */
suite('Undo — a commit that says what it touches', async ({ check }) => {
  const s = await storeWith(base());
  s.undoSettings.coalesceMs = 0;
  s.commit(() => s.upsertItem({ id: 't1', title: 'before' }));
  const d = '2026-10-01';

  s.commit(() => { s.note(d).text = 'evening'; s.touchNote(d); }, { touches: ['notes'] });
  check('the touched key comes back', s.undo() !== null && !s.state.notes[d]?.text, JSON.stringify(s.state.notes[d]));
  check('...and the untouched key was never copied, so redo carries only notes',
    s.redo() !== null && s.state.notes[d].text === 'evening' && s.itemById('t1').title === 'before');

  // one step, two commits: the second touches a key the first did not
  s.commit(() => { s.note(d).text = 'later'; }, { touches: ['notes'] });   // its own step
  s.undoSettings.coalesceMs = 800;                                          // ...and this joins it
  s.commit(() => { s.itemById('t1').title = 'after'; }, { touches: ['items'] });
  s.undo();
  check('a key touched later in the step is put back too',
    s.state.notes[d].text === 'evening' && s.itemById('t1').title === 'before',
    `${s.state.notes[d].text} / ${s.itemById('t1').title}`);
  s.redo();
  check('...and comes forward again', s.state.notes[d].text === 'later' && s.itemById('t1').title === 'after');

  s.undoSettings.coalesceMs = 0;
  s.commit(() => { s.itemById('t1').title = 'plain'; });
  s.undo();
  check('a commit that says nothing still copies everything', s.itemById('t1').title === 'after');

  // a commit that names only keys undo does not keep is no step at all: an
  // undo that changes nothing, and a redo wiped for it, were the bug
  check('(the undo above left a redo)', s.canRedo());
  s.commit(() => { s.state.settings.hour12 = !s.state.settings.hour12; }, { touches: ['settings'] });
  check('a commit touching only keys outside UNDO_KEYS makes no step, and keeps the redo',
    s.canRedo() && s.redo() !== null && s.itemById('t1').title === 'plain', s.itemById('t1').title);
});

/* A commit that says nothing of what it touches is copied whole; if it then
   changed nothing undo keeps, it is no step either. What has to hold: no
   step, the redo kept, and the next undo is the last real change — even with
   the stack full. */
suite('Undo — a commit that changes nothing kept is no step', async ({ check }) => {
  const s = await storeWith(base());
  s.undoSettings.coalesceMs = 0;
  s.commit(() => s.upsertItem({ id: 'n1', title: 'kept' }));
  s.commit(() => { s.itemById('n1').title = 'edited'; });
  s.undo();
  s.commit(() => { s.state.settings.lastAreaId = 'a1'; });
  check('a commit that changed no kept key leaves the redo', s.canRedo() && s.redo() !== null && s.itemById('n1').title === 'edited');
  s.commit(() => { s.state.settings.railHidden = true; });
  check('...and undo goes back to the last real change', s.undo() !== null && s.itemById('n1').title === 'kept');

  // with the stack full, the oldest step is not lost to one that changes nothing
  const max = s.undoSettings.max;
  for (let i = 0; i < max; i++) s.commit(() => { s.itemById('n1').title = `v${i}`; });
  s.commit(() => { s.state.settings.railHidden = false; });
  let n = 0;
  while (s.canUndo() && n < max + 5) { s.undo(); n++; }
  check(`still ${max} steps back`, n === max, `${n} undos`);
  check('...the oldest of them the first edit', s.itemById('n1')?.title === 'kept', String(s.itemById('n1')?.title));
});

/* Undo closes the merge window. What has to hold: an edit made straight
   after an undo is a step of its own, never folded into an older step it
   has nothing to do with. */
suite('Undo — an edit straight after an undo is its own step', async ({ check }) => {
  const s = await storeWith(base());
  s.undoSettings.coalesceMs = 800;
  s.commit(() => s.upsertItem({ id: 'w1', title: 'first' }));
  await tick(900);
  s.commit(() => { s.itemById('w1').title = 'second'; });
  s.undo();
  s.commit(() => { s.itemById('w1').title = 'third'; });
  s.undo();
  check('the undo takes back only the edit made after the last one',
    s.itemById('w1')?.title === 'first', String(s.itemById('w1')?.title));
});
</script>
</body>
</html>
