<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Semester Planner</title>
<meta name="description" content="A semester planner: one task, every view.">
<meta name="theme-color" content="#F6F6F4">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<div id="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <input class="sem-name" id="sem-name" aria-label="Semester name" spellcheck="false">
      <div class="sem-meta" id="sem-meta"></div>
    </div>
    <nav class="rail" id="rail" aria-label="Views"></nav>
    <div class="sync-stack">
      <button class="sync-strip" id="sync" type="button">
        <span class="sync-led" data-s="off"></span>
        <span class="sync-label eyebrow">Calendar</span>
      </button>
      <button class="sync-strip" id="cloudsync" type="button">
        <span class="sync-led" data-s="off"></span>
        <span class="sync-label eyebrow">Cloud</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="btn ghost sm mobile-only" id="menu-btn" aria-label="Menu">☰</button>
      <h1 id="view-title">Overview</h1>
      <div class="quickadd">
        <span class="eyebrow desktop-only">Add</span>
        <input id="quickadd-input" type="text" autocomplete="off" spellcheck="false"
               placeholder="Problem set 3 due fri 5pm 2h !high">
        <span class="hint desktop-only">enter</span>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>

</div>

<nav class="tabbar" id="tabbar" aria-label="Views"></nav>

<div class="scrim" id="peek-scrim"></div>
<aside class="peek" id="peek" aria-label="Task detail"></aside>
<div id="toasts" aria-live="polite"></div>

<noscript>
  <p style="padding:24px">This planner needs JavaScript.</p>
</noscript>

<script type="module" src="./js/app.js"></script>
</body>
</html>
